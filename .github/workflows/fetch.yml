name: Fetch wiki pages

# Fetches each season's Wikipedia page and Big Brother Wiki (Fandom) page into cache/,
# rebuilds web/weeks.json, details.json, report.txt and proofread.xlsx, and commits
# them back to the branch if any page changed.
# Runs daily, when this file or seasons.yaml changes, or by hand from the Actions tab.
on:
  push:
    paths:
      - .github/workflows/fetch.yml
      - seasons.yaml
  schedule:
    # Daily at 14:00 UTC, so the hosted page picks up last night's episode.
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      seasons:
        description: "Season numbers to fetch, space-separated (blank = all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: fetch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Fetch pages
        run: python -m bbgrid fetch ${{ github.event.inputs.seasons }}
      - name: Build weeks.json and report.txt
        run: |
          python -m bbgrid build
          python -m bbgrid proofread
          cat report.txt
      - name: Commit if the pages changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cache/ web/weeks.json web/details.json report.txt proofread.xlsx
          # Only the fetch timestamps change when a page hasn't been edited, so compare
          # the pages themselves. Staged, so newly added pages count too.
          if git diff --cached --quiet -- 'cache/*.html' 'cache/*.wikitext' 'cache/*.houseguests.json' 'cache/*.formats.json'; then
            echo "Wiki pages unchanged; nothing to commit"
          else
            git commit -m "Update wiki page cache and weeks.json"
            git push
          fi
