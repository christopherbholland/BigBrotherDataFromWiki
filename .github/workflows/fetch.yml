name: Fetch wiki pages

# Fetches each season's Wikipedia page and Big Brother Wiki (Fandom) page into cache/,
# rebuilds web/weeks.json, details.json, report.txt and proofread.xlsx, and commits
# them back to the branch, with updated test snapshots, if any page changed.
# Fetches the airing (newest) season every hour and every season once a day; also runs
# when this file or seasons.yaml changes, or by hand from the Actions tab.
on:
  push:
    paths:
      - .github/workflows/fetch.yml
      - seasons.yaml
  schedule:
    # Hourly, the airing season only, so HOH, veto and eviction results show up within
    # an hour or two of being added to the wikis (GitHub often starts scheduled runs late,
    # so a once-a-day run could leave the page most of a day behind).
    - cron: "17 * * * *"
    # Daily at 14:00 UTC, every season, to pick up edits to past seasons.
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      seasons:
        description: "Season numbers to fetch, space-separated (blank = all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: fetch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Fetch pages
        # Passed through the environment, not pasted into the script, so the input
        # is only ever read as season numbers.
        env:
          SEASONS: ${{ github.event.inputs.seasons }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$SCHEDULE" = "17 * * * *" ]; then
            SEASONS=$(python -c "from bbgrid.config import load_seasons; print(max(load_seasons()))")
          fi
          python -m bbgrid fetch $SEASONS
      - name: Build weeks.json and report.txt
        run: |
          python -m bbgrid build
          python -m bbgrid proofread
          cat report.txt
      - name: Update test snapshots
        # The snapshots record what's read from each cached page, so they change with
        # the pages. Updating them here keeps the Tests workflow green; the snapshot
        # diff in the commit shows exactly what the refresh changed.
        run: UPDATE_SNAPSHOTS=1 pytest -q tests/test_snapshots.py tests/test_fandom_snapshots.py
      - name: Commit if the pages changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cache/ web/weeks.json web/details.json report.txt proofread.xlsx tests/snapshots/
          # Only the fetch timestamps change when a page hasn't been edited, so compare
          # the pages themselves. Staged, so newly added pages count too.
          if git diff --cached --quiet -- 'cache/*.html' 'cache/*.wikitext' 'cache/*.houseguests.json' 'cache/*.formats.json'; then
            echo "Wiki pages unchanged; nothing to commit"
          else
            git commit -m "Update wiki page cache and weeks.json"
            git push
          fi
