name: Fetch Wikipedia pages

# Fetches each season's page into cache/ and commits it back to the branch.
# Runs when this file or seasons.yaml changes, or by hand from the Actions tab.
on:
  push:
    paths:
      - .github/workflows/fetch.yml
      - seasons.yaml
  workflow_dispatch:
    inputs:
      seasons:
        description: "Season numbers to fetch, space-separated (blank = all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: fetch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Fetch pages
        run: python -m bbgrid fetch ${{ github.event.inputs.seasons }}
      - name: Build (for the log; outputs are not committed)
        run: |
          python -m bbgrid build
          cat report.txt
      - name: Commit cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cache/
          if git diff --cached --quiet; then
            echo "No changes to cache/"
          else
            git commit -m "Update Wikipedia page cache"
            git push
          fi
