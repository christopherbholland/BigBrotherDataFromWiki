name: Publish page

# Publishes web/ to GitHub Pages. Runs on pushes to main that touch web/, after
# each fetch run (its commits don't trigger push events), or by hand.
on:
  push:
    branches: [main]
    paths: [web/**, .github/workflows/pages.yml]
  workflow_run:
    workflows: ["Fetch Wikipedia pages"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
