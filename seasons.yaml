# Which seasons to build, and each one's page on the two wikis.
#
# seasons:     a range ("21-28"), a number, or a list of both (["1-5", "21-28"]).
#              For every US season so far, use "1-28" (see docs/all-seasons.md first).
# titles:      each wiki's page title, with {n} standing for the season number.
#   wikipedia  the Wikipedia article (the grid's source)
#   fandom     the Big Brother Wiki page (extra detail: competitions, Have-Nots, bios)
# exceptions:  a season whose title doesn't follow the pattern, per wiki. null leaves
#              that season out of that wiki.
seasons: "21-28"
titles:
  wikipedia: "Big Brother {n} (American season)"
  fandom: "Big Brother {n} (US)"
exceptions:
  wikipedia: {}
  fandom: {}
