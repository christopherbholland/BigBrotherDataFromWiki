// ---------- Analytics: patterns across every season ----------

let ANALYTICS = null;
// Out of the house that round (details.json's reasons for not voting).
const NOT_IN_HOUSE = /evicted|comeback|zombie/i;
// Competition types that are mostly about the body: what the endgame is said to favor.
const ATHLETIC = ["Physical", "Endurance", "Hybrid"];
const STAGES = [
  ["10 or more left", n => n >= 10],
  ["6 to 9 left", n => n >= 6 && n <= 9],
  ["4 or 5 left", n => n === 4 || n === 5],
  ["Final three", n => n <= 3],
];
const AGES = [["Under 25", a => a < 25], ["25 to 29", a => a >= 25 && a < 30], ["30 to 39", a => a >= 30 && a < 40], ["40 and over", a => a >= 40]];

// The longest run of consecutive items that pass test: { n, items }.
function longestRun(list, test) {
  let best = { n: 0, items: [] }, cur = [];
  for (const o of list) {
    if (!test(o)) { cur = []; continue; }
    cur.push(o);
    if (cur.length > best.n) best = { n: cur.length, items: [...cur] };
  }
  return best;
}

// Every houseguest's rounds in the house (from trendRounds), with what they won
// and whether they were nominated, plus how their game ended.
function analyticsData(d) {
  if (ANALYTICS) return ANALYTICS;
  const rounds = trendRounds(d);
  const seasons = seasonList();
  const size = new Map();
  seasons.forEach(s => seasonRounds(s, d).rounds.forEach(x => size.set(`${s}|${x.label}|${x.i}`, x.size)));
  const finales = d.finales || {};
  const people = new Map();
  for (const p of d.players) {
    const f = finales[p.season] || {};
    const m = ((p.fandom || {}).place || "").match(/^(\d+)/);
    people.set(`${p.season}|${p.name}`, {
      p, season: p.season, name: p.name, done: !!f.decided, age: playerBio(p).age,
      place: !p.result ? null : /^winner/i.test(p.result) ? 1 : /^runner/i.test(p.result) ? 2 : m ? +m[1] : null,
      jury: [...(f.jury || []), ...(f.finalists || [])].some(j => j.name === p.name),
      hoh: 0, veto: 0, rounds: [],
    });
  }
  for (const x of rounds) {
    x.size = size.get(`${x.season}|${x.label}|${x.i}`) ?? null;
    const wr = (((d.weeks[`${x.season}|${x.label}`] || {}).rounds) || [])[x.i] || { votes: [], not_voting: [] };
    const r = x.r;
    const house = new Set([...wr.votes.map(v => v.voter), ...wr.not_voting.filter(v => !NOT_IN_HOUSE.test(v.reason)).map(v => v.voter),
      ...r.hoh, ...r.nominees_initial, ...r.nominees_final, ...r.veto_winners, ...(r.evicted ? [r.evicted] : [])]);
    for (const name of house) {
      const a = people.get(`${x.season}|${name}`);
      if (!a) continue;
      const hoh = r.hoh.includes(name), veto = r.veto_winners.includes(name);
      a.hoh += hoh; a.veto += veto;
      a.rounds.push({ x, hoh, veto, safe: hoh || veto, nom: r.nominees_initial.includes(name) || r.nominees_final.includes(name),
                      block: r.nominees_final.includes(name), out: r.evicted === name });
    }
  }
  const all = [...people.values()];
  for (const a of all) {
    a.wins = a.hoh + a.veto;
    a.noms = a.rounds.filter(o => o.nom).length;
    a.block = a.rounds.filter(o => o.block).length;
    a.survived = a.rounds.filter(o => o.block && !o.out).length;
    a.safe = a.rounds.filter(o => o.safe).length;
    a.streak = longestRun(a.rounds, o => o.safe);
    a.clean = longestRun(a.rounds, o => !o.nom);
  }
  const bySeason = new Map(seasons.map(s => [s, all.filter(a => a.season === s)]));
  const top = s => { const list = bySeason.get(s); const n = Math.max(0, ...list.map(a => a.wins)); return list.filter(a => a.wins === n && n > 0); };
  const firstRound = s => rounds.find(x => x.season === s && x.r.hoh.length);
  return (ANALYTICS = { rounds, seasons, all, people, bySeason, top, firstRound,
    done: seasons.filter(s => (finales[s] || {}).decided).sort((a, b) => a - b),
    get: (s, n) => people.get(`${s}|${n}`) });
}

// "Winner", "Runner-up", "5th · Evicted", "Still in the game".
function finishHtml(a) {
  if (!a) return ZERO;
  if (a.place === 1) return `<span class="t won">Winner</span>`;
  if (!a.p.result) return `<span class="muted">Still in the game</span>`;
  const how = a.p.result.replace(/\s*\(.*\)$/, "");
  if (a.place === 2) return "Runner-up";
  return a.place ? `${ordinal(a.place)} <span class="muted">· ${esc(how)}${a.jury ? ", jury" : ""}</span>` : esc(how);
}

const whoHtml = a => `<div class="pl">${faceHtml(a.season, a.name, faceState(a.p))}<span>${plink(a.season, a.name)}</span></div>`;
const avg = (xs, f) => xs.length ? xs.reduce((n, x) => n + f(x), 0) / xs.length : null;
const fixed = n => n == null ? "–" : (Math.round(n * 10) / 10).toString();
const joinAnd = xs => xs.length > 1 ? xs.slice(0, -1).join(", ") + " and " + xs[xs.length - 1] : xs[0] || "";
const whoIn = a => `${plink(a.season, a.name)} (BB${a.season})`;
// "Weeks 8–10", or the round keys when they aren't plain weeks.
function spanText(items) {
  const a = items[0].x.key, b = items[items.length - 1].x.key;
  if (a === b) return a;
  const m = a.match(/^Week (\d+)$/), n = b.match(/^Week (\d+)$/);
  return m && n ? `Weeks ${m[1]}–${n[1]}` : `${a} – ${b}`;
}

async function showAnalytics() {
  const d = await openView("analytics", null, "Loading…");
  if (!d) return;
  const panel = $("analytics-panel");
  panel.innerHTML = `<div class="view-body trend">${analyticsHtml(analyticsData(d), d)}</div>`;
}

function analyticsHtml(A, d) {
  const done = A.all.filter(a => a.done);
  const doneSeasons = A.done;
  const range = seasonsText(A.rounds);

  // Comp leaders and winners.
  const leaders = doneSeasons.map(s => ({ s, top: A.top(s) }));
  const leaderWon = leaders.filter(l => l.top.some(a => a.place === 1));
  const leaderEarly = leaders.filter(l => l.top.every(a => a.place > 3));
  const winners = done.filter(a => a.place === 1);
  // First HOH and week 1 nominees.
  const firsts = A.seasons.map(s => ({ s, x: A.firstRound(s) })).filter(f => f.x);
  const firstHohs = firsts.flatMap(f => f.x.r.hoh.map(n => A.get(f.s, n)).filter(Boolean));
  const firstDone = firstHohs.filter(a => a.done);
  const wk1 = firsts.flatMap(f => [...new Set([...f.x.r.nominees_initial, ...f.x.r.nominees_final])].map(n => ({ f, a: A.get(f.s, n) }))).filter(o => o.a);
  const wk1Done = wk1.filter(o => o.a.done);
  const wk1Out = wk1.filter(o => o.f.x.r.evicted === o.a.name);
  // Comp types by stage: every HOH and veto competition the Big Brother Wiki lists,
  // each part of the final HOH included. A part without a round (the final HOH's
  // first part) belongs to the week's last round.
  const comps = STAGES.map(() => []);
  for (const w of DATA.weeks) {
    if (!w.rounds.length) continue;
    for (const c of fandomComps(d.weeks[`${w.season}|${w.week_label}`])) {
      if (c.kind !== "hoh" && c.kind !== "veto") continue;
      const x = A.rounds.find(x => x.season === w.season && x.label === w.week_label && x.i === (c.round || w.rounds.length) - 1);
      const k = x && x.size != null ? STAGES.findIndex(([, test]) => test(x.size)) : -1;
      if (k >= 0) comps[k].push({ ...c, season: w.season });
    }
  }
  const tally = (label, cs) => {
    const cats = Object.fromEntries([...CATEGORY_NAMES, ""].map(c => [c, 0]));
    cs.forEach(c => cats[CATEGORY_NAMES.includes(c.category) ? c.category : ""]++);
    const typed = CATEGORY_NAMES.reduce((n, c) => n + cats[c], 0);
    return { label, cats, typed, athletic: ATHLETIC.reduce((n, c) => n + cats[c], 0) };
  };
  const stageComps = STAGES.map(([label], k) => tally(label, comps[k]));
  const early = stageComps[0], late = tally("5 or fewer left", comps.slice(2).flat());
  const finals = [...new Set(comps[3].map(c => c.season))];
  const finalEndurance = finals.filter(s => comps[3].some(c => c.season === s && c.category === "Endurance"));
  // Streaks.
  const streaks = A.all.filter(a => a.streak.n >= 2).sort((a, b) => b.streak.n - a.streak.n || b.wins - a.wins || b.season - a.season);
  const clean = A.all.filter(a => a.rounds.length).sort((a, b) => b.clean.n - a.clean.n || (a.place ?? 99) - (b.place ?? 99));
  const never = done.filter(a => a.noms === 0 && a.rounds.length).sort((a, b) => a.place - b.place || b.season - a.season);
  // Ages, finished seasons only.
  const ages = AGES.map(([label, test]) => {
    const xs = done.filter(a => a.age != null && test(a.age));
    return { label, xs, jury: xs.filter(a => a.jury).length, wins: avg(xs, a => a.wins), won: xs.filter(a => a.place === 1) };
  });
  const young = ages[0], old = ages[ages.length - 1];
  // Veto use, first seasons against the latest.
  const sorted = [...A.seasons].sort((a, b) => a - b);
  const vetoOf = ss => vetoStats(A.rounds.filter(x => ss.includes(x.season)));
  const head = sorted.slice(0, 3), tail = sorted.slice(-3);
  const vHead = vetoOf(head), vTail = vetoOf(tail);

  const notes = [
    leaders.length && `The season’s comp leader won ${leaderWon.length} of ${leaders.length} finished seasons${leaderWon.length ? `: ${joinAnd(leaderWon.map(l => l.top.filter(a => a.place === 1).map(whoIn)[0]))}` : ""}. `
      + (leaderEarly.length ? `The house got its comp leader out before the final three only ${leaderEarly.length === 1 ? "once" : `${leaderEarly.length} times`}: ${joinAnd(leaderEarly.flatMap(l => l.top).map(a => `${whoIn(a)}, ${ordinal(a.place)}`))}.` : "Every comp leader reached the final three."),
    winners.length && `Winners averaged ${fixed(avg(winners, a => a.wins))} comp wins and ${fixed(avg(winners, a => a.noms))} nominations. ${winners.filter(a => a.noms === 0).length ? `${joinAnd(winners.filter(a => a.noms === 0).map(whoIn))} ${winners.filter(a => a.noms === 0).length === 1 ? "was" : "were"} never nominated.` : "Every winner was nominated at least once."}`,
    firstDone.length && `First HOHs finished ${ordinal(Math.round(avg(firstDone, a => a.place)))} on average; ${firstDone.filter(a => a.jury).length} of ${firstDone.length} made the jury${firstDone.some(a => a.place === 1) ? `, and ${joinAnd(firstDone.filter(a => a.place === 1).map(whoIn))} won` : ", and none won"}.`,
    wk1.length && `${wk1Out.length} of ${wk1.length} week-one nominees went home that week. Of the rest, in finished seasons, ${wk1Done.filter(o => o.a.jury && o.f.x.r.evicted !== o.a.name).length} made the jury${wk1Done.some(o => o.a.place === 1) ? ` and ${joinAnd(wk1Done.filter(o => o.a.place === 1).map(o => whoIn(o.a)))} won` : ""}.`,
    early.typed && late.typed && `Physical, endurance and hybrid competitions made up ${pctOf(early.athletic, early.typed)}% of typed comps with 10 or more left, and ${pctOf(late.athletic, late.typed)}% with 5 or fewer. The final HOH had an endurance part in ${finalEndurance.length} of ${finals.length} seasons.`,
    streaks.length && `The longest run of rounds safe by winning HOH or veto: ${streaks[0].streak.n}, by ${joinAnd(streaks.filter(a => a.streak.n === streaks[0].streak.n).map(a => `${whoIn(a)}, ${esc(spanText(a.streak.items))}`))}.`,
    young.xs.length && old.xs.length && `Houseguests 40 and over made the jury ${pctOf(old.jury, old.xs.length)}% of the time, against ${pctOf(young.jury, young.xs.length)}% for those under 25.`,
    vHead.rounds && vTail.rounds && `The veto was used in ${pctOf(vHead.used, vHead.rounds)}% of rounds in ${seasonsText(A.rounds.filter(x => head.includes(x.season)))} and ${pctOf(vTail.used, vTail.rounds)}% in ${seasonsText(A.rounds.filter(x => tail.includes(x.season)))}.`,
  ].filter(Boolean);

  const lede = `Patterns across ${range}: ${A.all.length} houseguests and ${A.rounds.length} rounds. `
    + `Finished seasons (${seasonsText(A.rounds.filter(x => doneSeasons.includes(x.season)))}) count for anything about how a game ended.`;

  return `<p class="lede">${lede}</p>`
    + `<div class="stats">`
    + statTile(`${leaderWon.length}/${leaders.length}`, "Comp leaders who won", "seasons whose top comp winner won")
    + statTile(firstDone.length ? ordinal(Math.round(avg(firstDone, a => a.place))) : "–", "First HOH’s average finish", `${firstDone.filter(a => a.jury).length} of ${firstDone.length} made the jury`)
    + statTile(`${pctOf(wk1Out.length, wk1.length)}%`, "Week-one nominees out that week", `${wk1Out.length} of ${wk1.length}`)
    + statTile(late.typed ? `${pctOf(late.athletic, late.typed)}%` : "–", "Athletic comps with 5 or fewer left", `against ${pctOf(early.athletic, early.typed)}% with 10 or more`)
    + `</div>`
    + `<h2>What stands out</h2><ul class="eg-notes">${notes.map(n => `<li>${n}</li>`).join("")}</ul>`
    + compBeastsHtml(A)
    + compThreatHtml(A, leaders)
    + streakHtml(streaks)
    + firstHohHtml(A, firsts)
    + weekOneHtml(A, firsts)
    + offBlockHtml(clean, never)
    + stagesHtml(stageComps)
    + agesHtml(ages)
    + seasonPatternsHtml(A)
    + `<p class="src">From Wikipedia’s voting tables and the Big Brother Wiki (competition types, placings); ages from Wikipedia’s cast tables. Only the rounds the grid models are counted, so a twist week it doesn’t fully model can leave a gap in a streak.</p>`;
}

// The most HOH and veto wins in one season.
function compBeastsHtml(A) {
  const list = [...A.all].filter(a => a.wins >= 3).sort((a, b) => b.wins - a.wins || b.hoh - a.hoh || b.season - a.season).slice(0, 15);
  if (!list.length) return "";
  return `<h2>Comp beasts</h2><p class="note">The most HOH and veto wins in a single season, and how each of those games ended.</p>`
    + `<div class="scroll"><table class="players"><thead><tr><th scope="col" class="l">Houseguest</th><th scope="col">Season</th>`
    + thIcon("hoh", "HOH wins") + thIcon("veto", "Veto wins") + th("Total") + th("Longest run", "Most rounds in a row with an HOH or veto win")
    + `<th scope="col" class="l">How it ended</th></tr></thead><tbody>`
    + list.map(a => `<tr><td>${whoHtml(a)}</td><td>BB${a.season}</td><td>${num(a.hoh)}</td><td>${num(a.veto)}</td><td><strong>${a.wins}</strong></td>`
      + `<td>${a.streak.n}</td><td class="l">${finishHtml(a)}</td></tr>`).join("")
    + `</tbody></table></div>`;
}

// Did the house get its comp threat out? Each season's comp leader and what the block did to them.
function compThreatHtml(A, leaders) {
  const rows = [...A.seasons].map(s => ({ s, top: A.top(s) })).filter(l => l.top.length);
  const doneRows = rows.filter(l => leaders.some(x => x.s === l.s));
  const survived = doneRows.flatMap(l => l.top).filter(a => a.block > 0 && a.place != null && a.place <= 2);
  return `<h2>Getting the comp threat out</h2><p class="note">Each season’s comp leader: how often they sat on the block at the vote, how often they survived it, and where they finished. `
    + `${survived.length ? `${joinAnd(survived.map(whoIn))} survived the block and still reached the final two.` : ""}</p>`
    + `<div class="scroll"><table class="players"><thead><tr><th scope="col" class="l">Season</th><th scope="col" class="l">Comp leader</th>` + th("Wins")
    + th("On the block", "Times on the block at the vote") + th("Survived", "Times on the block at the vote and not evicted")
    + `<th scope="col" class="l">How it ended</th></tr></thead><tbody>`
    + rows.map(({ s, top }) => top.map((a, i) => `<tr>${i ? `<td class="l"></td>` : `<td class="l"><a class="plink" href="#players=${s}">BB${s}</a></td>`}`
      + `<td class="l">${whoHtml(a)}</td><td>${a.wins}</td><td>${num(a.block)}</td><td>${num(a.survived)}</td><td class="l">${finishHtml(a)}</td></tr>`).join("")).join("")
    + `</tbody></table></div>`;
}

// Back-to-back wins: rounds in a row safe because they held HOH or the veto.
function streakHtml(streaks) {
  const list = streaks.filter(a => a.streak.n >= 3).slice(0, 12);
  const pairs = streaks.filter(a => a.streak.n === 2).length;
  if (!list.length && !pairs) return "";
  return `<h2>Back-to-back wins and immunity runs</h2><p class="note">Rounds in a row a houseguest couldn’t be evicted because they won HOH or the veto. `
    + `${pairs ? `Besides these, ${plural(pairs, "houseguest", "houseguests")} won in two rounds running.` : ""}</p>`
    + (list.length ? `<div class="scroll"><table class="players"><thead><tr><th scope="col" class="l">Houseguest</th><th scope="col">Season</th>`
      + th("Rounds in a row") + `<th scope="col" class="l">When</th><th scope="col" class="l">What they won</th>` + th("Safe rounds", "Rounds with an HOH or veto win, all season")
      + `<th scope="col" class="l">How it ended</th></tr></thead><tbody>`
      + list.map(a => {
        const items = a.streak.items;
        const won = items.map(o => [o.hoh && "HOH", o.veto && "veto"].filter(Boolean).join(" + ")).join(", ");
        return `<tr><td>${whoHtml(a)}</td><td>BB${a.season}</td><td><strong>${a.streak.n}</strong></td>`
          + `<td class="l"><a class="plink" href="${weekHash(a.season, items[0].x.label)}">${esc(spanText(items))}</a></td>`
          + `<td class="l wrap">${esc(won)}</td><td>${a.safe} <span class="muted">of ${a.rounds.length}</span></td><td class="l">${finishHtml(a)}</td></tr>`;
      }).join("") + `</tbody></table></div>` : "");
}

function firstHohHtml(A, firsts) {
  return `<h2>The first HOH</h2><p class="note">Who won the season’s first Head of Household, and how far they got.</p>`
    + `<div class="scroll"><table class="players"><thead><tr><th scope="col" class="l">Season</th><th scope="col" class="l">First HOH</th>`
    + th("Wins", "HOH and veto wins, all season") + th("Noms", "Rounds nominated") + `<th scope="col" class="l">How it ended</th></tr></thead><tbody>`
    + firsts.map(({ s, x }) => x.r.hoh.map((n, i) => {
      const a = A.get(s, n);
      return `<tr>${i ? `<td class="l"></td>` : `<td class="l"><a class="plink" href="${weekHash(s, x.label)}">BB${s}</a></td>`}`
        + `<td class="l">${a ? whoHtml(a) : esc(n)}</td><td>${a ? num(a.wins) : ZERO}</td><td>${a ? num(a.noms) : ZERO}</td><td class="l">${finishHtml(a)}</td></tr>`;
    }).join("")).join("")
    + `</tbody></table></div>`;
}

function weekOneHtml(A, firsts) {
  return `<h2>Nominated in week one</h2><p class="note">The first nominees of each season, including anyone named as a replacement, and what became of them.</p>`
    + `<div class="scroll"><table class="players"><thead><tr><th scope="col" class="l">Season</th><th scope="col" class="l">Nominee</th>`
    + th("Noms", "Rounds nominated, all season") + `<th scope="col" class="l">How it ended</th></tr></thead><tbody>`
    + firsts.map(({ s, x }) => {
      const names = [...new Set([...x.r.nominees_initial, ...x.r.nominees_final])];
      return names.map((n, i) => {
        const a = A.get(s, n);
        const tag = !x.r.nominees_initial.includes(n) ? ` <span class="tag">Replacement</span>` : !x.r.nominees_final.includes(n) ? ` <span class="tag">Saved</span>` : "";
        return `<tr>${i ? `<td class="l"></td>` : `<td class="l"><a class="plink" href="${weekHash(s, x.label)}">BB${s}</a></td>`}`
          + `<td class="l"><div class="pl">${a ? faceHtml(s, n, faceState(a.p)) : ""}<span>${plink(s, n)}${tag}</span></div></td>`
          + `<td>${a ? num(a.noms) : ZERO}</td><td class="l">${finishHtml(a)}</td></tr>`;
      }).join("");
    }).join("")
    + `</tbody></table></div>`;
}

// Never nominated, and the longest runs off the block.
function offBlockHtml(clean, never) {
  const list = clean.slice(0, 12);
  return `<h2>Staying off the block</h2><p class="note">The most rounds in a row without being nominated, at the ceremony or as a replacement. A run that reaches the end of their game is marked.</p>`
    + `<div class="scroll"><table class="players"><thead><tr><th scope="col" class="l">Houseguest</th><th scope="col">Season</th>`
    + th("Rounds in a row") + `<th scope="col" class="l">When</th>` + th("Noms", "Rounds nominated, all season") + `<th scope="col" class="l">How it ended</th></tr></thead><tbody>`
    + list.map(a => {
      const items = a.clean.items, last = items[items.length - 1] === a.rounds[a.rounds.length - 1];
      return `<tr><td>${whoHtml(a)}</td><td>BB${a.season}</td><td><strong>${a.clean.n}</strong></td>`
        + `<td class="l"><a class="plink" href="${weekHash(a.season, items[0].x.label)}">${esc(spanText(items))}</a>${last ? ` <span class="tag">To the end</span>` : ""}</td>`
        + `<td>${num(a.noms)}</td><td class="l">${finishHtml(a)}</td></tr>`;
    }).join("") + `</tbody></table></div>`
    + (never.length ? `<p class="voters mt-2">Never nominated, in finished seasons: ${never.map(a => `${plink(a.season, a.name)} <span class="muted">(BB${a.season}, ${a.place === 1 ? "winner" : a.place === 2 ? "runner-up" : a.place ? ordinal(a.place) : "–"})</span>`).join(", ")}.</p>` : "");
}

// What kind of competitions were played at each stage of the game.
function stagesHtml(stages) {
  const parts = st => catParts(st.cats);
  return `<h2>Competition types by stage of the game</h2><p class="note">Every HOH and veto competition, grouped by how many houseguests were left. Does the end of the game really turn physical?</p>`
    + keyHtml(catParts(stages[0].cats).map(([l, , c]) => [l, c]))
    + `<div class="scroll"><table class="players"><thead><tr><th scope="col" class="l">Houseguests left</th>` + th("Comps")
    + `<th scope="col" class="l">Types</th>` + th("Athletic", "Physical, endurance or hybrid, of the typed competitions") + `</tr></thead><tbody>`
    + stages.map(st => `<tr><td class="l">${esc(st.label)}</td><td>${Object.values(st.cats).reduce((a, b) => a + b, 0)}</td>`
      + `<td class="l">${stackBar(parts(st), `${st.label}: competition types`)}</td><td>${pctCell(st.athletic, st.typed)}</td></tr>`).join("")
    + `</tbody></table></div>`;
}

function agesHtml(ages) {
  return `<h2>Age</h2><p class="note">Houseguests in finished seasons, by their age when the season began.</p>`
    + `<div class="scroll"><table class="players"><thead><tr><th scope="col" class="l">Age</th>` + th("Houseguests") + th("Comp wins", "HOH and veto wins per houseguest")
    + th("Made the jury") + `<th scope="col" class="l">Winners</th></tr></thead><tbody>`
    + ages.map(g => `<tr><td class="l">${esc(g.label)}</td><td>${g.xs.length}</td><td>${fixed(g.wins)}</td><td>${pctCell(g.jury, g.xs.length)}</td>`
      + `<td class="l">${g.won.length ? g.won.map(a => `${plink(a.season, a.name)} <span class="muted">(${a.age}, BB${a.season})</span>`).join(", ") : ZERO}</td></tr>`).join("")
    + `</tbody></table></div>`;
}

// One row per season: how the game went and what winning took.
function seasonPatternsHtml(A) {
  const rows = A.seasons.map(s => {
    const xs = A.rounds.filter(x => x.season === s);
    const h = hohStats(xs), v = vetoStats(xs);
    const typed = CATEGORY_NAMES.reduce((n, c) => n + h.cats[c], 0);
    const athletic = ATHLETIC.reduce((n, c) => n + (h.cats[c] || 0), 0);
    const w = A.bySeason.get(s).find(a => a.place === 1);
    return `<tr><td class="l"><a class="plink" href="#hoh=${s}">BB${s}</a></td><td>${h.rounds}</td><td>${h.people}</td><td>${pctCell(v.used, v.rounds)}</td>`
      + `<td>${num(v.backdoor)}</td><td>${pctCell(athletic, typed)}</td>`
      + `<td class="l">${w ? whoHtml(w) : `<span class="muted">Not decided yet</span>`}</td>`
      + `<td>${w ? w.wins : ZERO}</td><td>${w ? num(w.noms) : ZERO}</td><td>${w && w.age != null ? w.age : ZERO}</td></tr>`;
  }).join("");
  return `<h2>Season by season</h2><p class="note">How each season played, and what winning took. Backdoors are replacement nominees evicted without having played in the veto.</p>`
    + `<div class="scroll"><table class="players"><thead><tr><th scope="col" class="l">Season</th>` + th("Rounds") + th("HOH winners", "Different houseguests who won HOH")
    + th("Veto used") + th("Backdoors") + th("Athletic HOHs", "Physical, endurance or hybrid HOH competitions, of the typed ones")
    + `<th scope="col" class="l">Winner</th>` + th("Wins", "The winner’s HOH and veto wins") + th("Noms", "Rounds the winner was nominated") + th("Age")
    + `</tr></thead><tbody>${rows}</tbody></table></div>`;
}

// ---------- Week board: the story behind a week on the stream's dashboard ----------

// Names as links, joined for a tile ("Angela, Kimo").
const names = (season, xs) => xs.map(x => plink(season, x)).join(", ");

// One round as tiles: HOH, the nominations, the veto, any twist rows, and who went home.
function roundTilesHtml(w, r, i, d) {
  const S = w.season, v = d && d.rounds[i] ? d.rounds[i].veto : null;
  const comp = kind => {
    const c = d ? roundComp(d, i + 1, kind) : null;
    return c ? `“${esc(c.name)}”${c.category ? ` · ${esc(c.category)}` : ""}` : "";
  };
  const tiles = [];
  if (r.hoh.length) tiles.push(statTile(names(S, r.hoh), "Head of Household", comp("hoh")));
  if (r.nominees_initial.length) {
    const changed = r.nominees_final.length && r.nominees_final.map(nkey).join() !== r.nominees_initial.map(nkey).join();
    tiles.push(statTile(names(S, r.nominees_initial), "Nominated", changed ? `On the block at the vote: ${esc(r.nominees_final.join(", "))}` : "Still on the block at the vote"));
  }
  if (r.veto_winners.length) {
    let what = "";
    if (v) {
      const self = v.on.length === 1 && r.veto_winners.includes(v.on[0]);
      what = !v.used ? "Not used" : `Used on ${self ? "themselves" : esc(v.on.join(", "))}`
        + (v.replacements.length ? ` · ${esc(v.replacements.join(", "))} named instead` : "");
      if (v.twist_saved.length) what += `${what ? " · " : ""}${esc(v.twist_saved.join(", "))} saved by a twist`;
    } else what = esc(vetoBrief(r) ? vetoBrief(r).replace(/^./, c => c.toUpperCase()) : "");
    tiles.push(statTile(names(S, r.veto_winners), "Veto", [what, comp("veto")].filter(Boolean).join(" · ")));
  }
  for (const [label, xs] of Object.entries(r.extras || {})) tiles.push(statTile(names(S, xs), esc(extraLabel(label)), ""));
  if (r.evicted) {
    const t = r.tally;
    const how = !t ? "" : t.type === "vote" ? `${t.votes_to_evict === t.votes_cast ? "Unanimous, " : ""}${tallyText(t)} vote` : esc(tallyText(t));
    tiles.push(statTile(plink(S, r.evicted), "Evicted", how).replace(`class="stat"`, `class="stat out"`));
  }
  return `<div class="stats">${tiles.join("")}</div>`;
}

// The same week number in every season, one row each; the season on the board is highlighted.
function acrossTableHtml(week, here) {
  const rows = DATA.weeks.filter(w => w.week === week).sort((a, b) => b.season - a.season);
  if (!rows.length) return `<p class="muted">No season has a week ${week} yet.</p>`;
  const col = (w, f) => w.rounds.length ? w.rounds.map(f).join("<br>") : ZERO;
  return `<div class="scroll"><table class="players across"><thead><tr>${th("Season")}${th("HOH", "", "l")}${th("Nominated", "", "l")}`
    + `${th("Veto", "", "l")}${th("Evicted", "", "l")}${th("Vote", "", "l")}${th("What was different", "", "l")}</tr></thead><tbody>`
    + rows.map(w => `<tr${w.season === here ? ` class="here"` : ""}><td><a class="plink" href="#week=${w.season}/${week}">BB${w.season}</a></td>`
      + `<td>${col(w, r => esc(r.hoh.join(" & ")) || ZERO)}</td>`
      + `<td>${col(w, r => esc(r.nominees_initial.join(", ")) || ZERO)}</td>`
      + `<td>${col(w, r => r.veto_winners.length ? `${esc(r.veto_winners.join(" & "))} <span class="muted">${esc(vetoBrief(r))}</span>` : ZERO)}</td>`
      + `<td>${col(w, r => r.evicted ? `<strong>${esc(r.evicted)}</strong>` : ZERO)}</td>`
      + `<td>${col(w, r => esc(tallyText(r.tally)) || ZERO)}</td>`
      + `<td class="why">${esc([statusText(w), ...w.rounds.flatMap(r => Object.keys(r.extras || {}).map(extraLabel))].filter(Boolean).join(" · ")) || ZERO}</td></tr>`).join("")
    + `</tbody></table></div>`;
}

function showBoard(kicker, title, body) {
  BOARD_HEAD = { kicker, title };
  setView("board");
  $("board-panel").innerHTML = body;
}

async function showWeekBoard(season, label) {
  const hash = location.hash;
  const w = weekRecord(season, label);
  if (!w) {
    return showBoard(`Season ${season}`, label || "Week", `<div class="msg">BB${season} has no week “${esc(label)}”. Try e.g. <code>#week=${season}/5</code>.</div>`);
  }
  const head = [`Season ${season}`, w.week_label];
  if (!DETAILS) showBoard(...head, `<div class="msg">Loading…</div>`);
  let d = null;
  try { d = weekDetail(await loadDetails(), season, label); } catch (err) { /* the tiles still work from weeks.json */ }
  if (location.hash !== hash) return;  // moved on while loading
  const eps = d ? d.episodes : [];
  // "Days 24–31": the first and last day of the week's episodes.
  const dayNums = eps.flatMap(e => (e.days || "").match(/\d+/g) || []).map(Number);
  const days = dayNums.length ? (Math.min(...dayNums) === Math.max(...dayNums) ? `Day ${dayNums[0]}` : `Days ${Math.min(...dayNums)}–${Math.max(...dayNums)}`) : "";
  const lede = [statusText(w), days].filter(Boolean).join(" · ");
  const different = d ? specialHtml(d) : "";
  const epList = eps.length ? `<ul class="plain">` + eps.map(ep => `<li><strong>${esc(ep.title)}</strong> <span class="muted">${esc(
    [ep.days, fmtDate(ep), ep.viewers_millions != null ? `${ep.viewers_millions}M viewers` : ""].filter(Boolean).join(" · "))}</span></li>`).join("") + `</ul>` : "";
  const nav = `<nav class="pager" aria-label="Weeks">`
    + pagerHtml(season, label).replace(/^<nav[^>]*>|<\/nav>$/g, "")
    + `</nav><p class="src"><a class="plink" href="#">All weeks</a>${w.week != null ? ` · <a class="plink" href="#weekall=${w.week}">${esc(w.week_label)} in every season</a>` : ""} · ← → change week, ↑ ↓ change season</p>`;
  showBoard(...head, `<div class="view-body trend wk-board">`
    + (lede ? `<p class="lede">${esc(lede)}</p>` : "")
    + (w.rounds.length ? w.rounds.map((r, i) => (w.rounds.length > 1 ? `<h2>${esc(roundLabel(w, i))}</h2>` : "") + roundTilesHtml(w, r, i, d)).join("")
      : `<p class="muted">No round was modeled this week.</p>`)
    + (different ? `<h2>What was different</h2>${different}` : "")
    + (d && d.rounds.length ? `<h2>Votes to evict</h2>${votesHtml(w, d)}` : "")
    + (epList ? `<h2>Episodes</h2>${epList}` : "")
    + `<p class="src">Source: Wikipedia’s voting history and episode table; competitions from the Big Brother Wiki.</p>`
    + nav + `</div>`);
}

function showAcross(week) {
  showBoard("Every season", `Week ${week}`, `<div class="view-body trend wk-board">`
    + `<p class="lede">How week ${week} went in each season. Click or tap a season for the full week.</p>`
    + acrossTableHtml(week, null)
    + `<p class="src">Source: Wikipedia’s voting history tables.</p>`
    + `<nav class="pager" aria-label="Weeks">${week > 1 ? `<a href="#weekall=${week - 1}">‹ Week ${week - 1}</a>` : `<span aria-hidden="true">‹</span>`}`
    + `<a href="#weekall=${week + 1}">Week ${week + 1} ›</a></nav></div>`);
}

// On a board, ← → step through the weeks and ↑ ↓ through the seasons (newest on top).
function boardKeys(e) {
  if (currentView !== "board" || e.altKey || e.metaKey || e.ctrlKey) return;
  if (e.key === "Escape") { location.hash = "#"; return; }
  if (!/^Arrow/.test(e.key)) return;
  const am = location.hash.match(/^#weekall=(\d+)$/);
  if (am) {
    const n = +am[1] + (e.key === "ArrowLeft" ? -1 : e.key === "ArrowRight" ? 1 : 0);
    if (n !== +am[1] && n >= 1) { e.preventDefault(); location.hash = `#weekall=${n}`; }
    return;
  }
  const m = location.hash.match(/^#week=(\d+)\/(.*)$/);
  if (!m) return;
  const season = +m[1], raw = decodeURIComponent(m[2]);
  const w = /^\d+$/.test(raw) ? DATA.weeks.find(x => x.season === season && x.week === +raw) : weekRecord(season, raw);
  if (!w) return;
  let to = null;
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") to = weekNeighbors(season, w.week_label)[e.key === "ArrowLeft" ? "prev" : "next"];
  else if (w.week != null) {
    const list = seasonList(), i = list.indexOf(season) + (e.key === "ArrowUp" ? -1 : 1);
    to = list[i] != null ? DATA.weeks.find(x => x.season === list[i] && x.week === w.week) : null;
  }
  if (to) { e.preventDefault(); location.hash = to.week != null ? `#week=${to.season}/${to.week}` : weekHash(to.season, to.week_label); }
}

// ---------- Routing: #week=26/Week%2010 · #players=26 · #player=26/Angela · #comps=26 · #comps=major · #comp=The%20Wall · #endgame=26 · #finale=26 · #afh · #analytics · #hoh=all · #veto=26 ----------

function route() {
  if (!DATA) return;
  const newest = seasonList()[0];
  const fm = location.hash.match(/^#comp=(.+)$/);
  if (fm) {
    if (currentView === "weeks" && !currentSeason) currentSeason = newest;
    return showFormat(decodeURIComponent(fm[1]));
  }
  const tm = location.hash.match(/^#(hoh|veto)=(all|\d+)$/);
  if (tm) { hideDrawer(); return showTrend(tm[1], tm[2] === "all" ? "all" : +tm[2]); }
  if (location.hash === "#afh") { hideDrawer(); return showAfh(); }
  if (location.hash === "#analytics") { hideDrawer(); return showAnalytics(); }
  if (location.hash === "#comps=major") { hideDrawer(); return showMajorComps(); }
  const am = location.hash.match(/^#weekall=(\d+)$/);
  if (am) { hideDrawer(); return showAcross(+am[1]); }
  const m = location.hash.match(/^#(week|players|player|comps|endgame|finale)=(\d+)(?:\/(.*))?$/);
  if (!m) { setView("weeks"); hideDrawer(); return; }
  const kind = m[1], season = +m[2], rest = m[3] ? decodeURIComponent(m[3]) : null;
  if (kind === "week") {
    // "#week=26/11" names the week by number, the way the stream's dashboard does.
    const label = /^\d+$/.test(rest || "") ? ((DATA.weeks.find(w => w.season === season && w.week === +rest) || {}).week_label || rest) : rest;
    // The simple view shows a week as a full board, sized for the stream, instead of the drawer.
    if (simple) { hideDrawer(); return showWeekBoard(season, label); }
    if (currentView === "weeks" || currentView === "board") setView("weeks");
    showWeek(season, label);
  } else if (kind === "player") {
    // A player opened from another tab keeps that tab behind the drawer, if it's for their season.
    // Favorite, HOH, Veto, Analytics and Major comps show every season, so they always stay.
    const keep = currentView === "afh" || currentView === "analytics" || TREND[currentView] || (currentView === "comps" && compsScope === "major")
      || (currentView !== "weeks" && currentSeason === season);
    if (!keep) showPlayers(season);
    showPlayer(season, rest);
  } else {
    hideDrawer();
    VIEWS[kind].show(season || newest, rest);
  }
}

for (const view of Object.keys(VIEWS)) {
  // The week board has no tab.
  if ($(`tab-${view}`)) $(`tab-${view}`).addEventListener("click", () => { location.hash = viewHash(view, currentSeason || seasonList()[0]); });
}
for (const view of SEASON_VIEWS) wireSeasonPicker(`${view}-season-pick`, VIEWS[view].hash);
$("endgame-start-pick").addEventListener("click", e => {
  const b = e.target.closest("button[data-start]");
  if (b) location.hash = endgameHash(currentSeason, +b.dataset.start);
});
// HOH and Veto pick "All seasons" or one; the tab itself is wired with the others above.
for (const kind of Object.keys(TREND)) {
  wireSeasonPicker(`${kind}-season-pick`, s => `#${kind}=${s}`);
  wireTrendTips($(`${kind}-panel`));
}
wireTrendTips($("analytics-panel"));
$("grid-mode").addEventListener("click", e => {
  const b = e.target.closest("button[data-mode]");
  if (!b || !DATA) return;
  gridMode = b.dataset.mode;
  try { localStorage.setItem("gridMode", gridMode); } catch (err) {}
  renderGrid(DATA);
});
$("faces-btn").addEventListener("click", () => {
  if (!DATA) return;
  showFaces = !showFaces;
  try { localStorage.setItem("faces", showFaces ? "on" : "off"); } catch (err) {}
  renderGrid(DATA);
});
// Simple view lives in the address (?simple=1), so a stream's browser source can link straight to it.
$("simple-btn").addEventListener("click", () => {
  simple = !simple;
  document.documentElement.classList.toggle("simple", simple);
  showFaces = defaultFaces();
  if (DATA) renderGrid(DATA);
  if (simple) params.set("simple", "1"); else params.delete("simple");
  const query = params.toString();
  history.replaceState(null, "", location.pathname + (query ? "?" + query : "") + location.hash);
});
// Simple view is left open for a whole show, so it picks up new data by itself: every
// 10 minutes it rereads weeks.json and, if it was rebuilt, redraws the grid and the open tab.
const REFRESH_MS = 10 * 60 * 1000;
async function refreshData() {
  let data;
  try {
    const r = await fetch("weeks.json", { cache: "no-cache" });
    if (!r.ok) return;
    data = await r.json();
  } catch (err) { return; }
  if (!DATA || data.generated_at === DATA.generated_at) return;
  const fresh = onlySeasons(data, seasonFilter(params.get("seasons")));
  if (!fresh.weeks.length) return;
  DATA = fresh; DETAILS = null; detailsPromise = null;
  renderGrid(DATA); renderFooter(DATA);
  // An open drawer isn't redrawn under the reader; it picks up the new data when it next opens.
  if ($("drawer").hidden) route();
}
setInterval(() => { if (simple && !document.hidden) refreshData(); }, REFRESH_MS);
// A resized browser source changes the column widths, so the names are measured again.
let fitTimer = null;
addEventListener("resize", () => { clearTimeout(fitTimer); fitTimer = setTimeout(fitGrid, 150); });
$("drawer-close").addEventListener("click", closeDrawer);
$("scrim").addEventListener("click", closeDrawer);
document.addEventListener("keydown", e => {
  if ($("drawer").hidden) return boardKeys(e);
  if (e.key === "Escape") closeDrawer();
  // ← / → step through a season's weeks while a week is open.
  const m = location.hash.match(/^#week=(\d+)\/(.*)$/);
  if (m && (e.key === "ArrowLeft" || e.key === "ArrowRight") && !e.altKey && !e.metaKey && !e.ctrlKey) {
    const n = weekNeighbors(+m[1], decodeURIComponent(m[2]))[e.key === "ArrowLeft" ? "prev" : "next"];
    if (n) { e.preventDefault(); location.hash = weekHash(n.season, n.week_label); }
  }
});
addEventListener("hashchange", route);

fetch("weeks.json")
  .then(r => { if (!r.ok) throw new Error(r.status + " " + r.statusText); return r.json(); })
  .then(data => {
    DATA = onlySeasons(data, seasonFilter(params.get("seasons")));
    if (!DATA.weeks.length) {
      document.getElementById("panel").innerHTML =
        `<div class="msg">No seasons match <code>?seasons=${esc(params.get("seasons"))}</code>. Try e.g. <code>?seasons=26-28</code>.</div>`;
      return;
    }
    render(DATA); route();
  })
  .catch(err => {
    document.getElementById("panel").innerHTML =
      `<div class="msg">Couldn’t load weeks.json (${esc(err.message)}). Run <code>python -m bbgrid build</code>, then serve this folder, e.g. <code>python -m http.server -d web</code>.</div>`;
  });
</script>
</body>
</html>
