<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big Brother Weeks</title>
<meta name="theme-color" content="#050a1a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eef1f7" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-title" content="BB Weeks">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
/* ==========================================================================
   Styles follow docs/style-guide.md; tests/test_style.py checks the rules.
   1. Tokens: every color, font size, weight, letter spacing, radius and shadow.
   2. Base and shared components: build new UI from these first.
   3. Views: layout for each tab, written with the tokens only.
   ========================================================================== */

/* 1. Tokens ---------------------------------------------------------------- */
:root {
  color-scheme: light;
  /* Surfaces and text */
  --surface-0: #eef1f7;
  --surface-1: #ffffff;
  --cell: #e3e8f2;
  --cell-hover: #d2d9e8;
  --line: #d3d9e6;
  --text-primary: #0a1024;
  --text-secondary: #4b5572;
  --text-muted: #7a839c;
  --tip-bg: #ffffff;
  --tip-shadow: 0 6px 24px rgba(10,16,36,.14);
  /* Meaning */
  --accent: #2563eb;
  --now: #0a1024;
  --warning: #fab219;
  --critical: #d03b3b;
  --good: #17784f;
  --gold: #f5b82e;
  --silver: #c9ced8;
  --bronze: #f08a24;
  /* Text on a filled color: pair each fill with its on-color */
  --on-accent: #ffffff;
  --on-good: #ffffff;
  --on-critical: #ffffff;
  --on-gold: #1a1200;
  --on-silver: #111111;
  --on-bronze: #1a0c00;
  --on-series: #ffffff;
  --on-series-light: #0a1024;
  /* Overlays */
  --scrim: rgba(0,0,0,.3);
  --shadow-raised: 0 1px 2px rgba(0,0,0,.12);
  --shadow-drawer: -8px 0 32px rgba(0,0,0,.18);

  /* Type: one family, ten sizes, four weights, two trackings */
  --font: system-ui, -apple-system, "Segoe UI", sans-serif;
  --fs-3xs: 10px;  /* initials on the smallest faces, table group labels */
  --fs-2xs: 11px;  /* caps labels, chips, fine print */
  --fs-xs: 12px;   /* secondary text, legends, section headings */
  --fs-sm: 13px;   /* tables, notes, controls */
  --fs-md: 14px;   /* body */
  --fs-lg: 15px;   /* ledes, card titles */
  --fs-xl: 17px;   /* names on cards, count badges, drawer title */
  --fs-2xl: 22px;  /* page title, stat numbers */
  --fs-3xl: 28px;  /* initials on big faces */
  --fs-4xl: 40px;  /* the jury score */
  --fw-regular: 400;
  --fw-semibold: 600;
  --fw-bold: 700;
  --fw-heavy: 800;
  --track-tight: .02em;
  --track-caps: .08em;  /* every UPPERCASE label */

  /* Shape */
  --r-xs: 2px;     /* legend swatches */
  --r-sm: 4px;     /* small faces, bar ends, the "now" pill */
  --r-md: 6px;     /* buttons inside a control, faces, count badges */
  --r-lg: 8px;     /* panels, controls, tooltip, stat tiles */
  --r-xl: 10px;    /* cards, big faces */
  --r-sheet: 14px; /* the phone bottom sheet */
  --r-pill: 999px; /* chips */

  /* Space: a 4px scale; the panel inset shrinks on phones */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --inset: var(--sp-4);

  /* Series colors (HOH and Veto views): comp types in the Big Brother Wiki's order,
     and what the veto did. Validated as a categorical set on both surfaces
     (dataviz validate_palette.js). */
  --cat-endurance: #2a78d6; --cat-physical: #eb6834; --cat-skill: #1baf7a; --cat-mental: #eda100;
  --cat-hybrid: #e87ba4; --cat-puzzle: #008300; --cat-crapshoot: #4a3aa7; --cat-none: #c3c9d6;
  --out-self: #2a78d6; --out-other: #eb6834; --out-kept: #c3c9d6;
}
@media (max-width: 640px) { :root { --inset: var(--sp-3); } }
/* Dark: the navy "stock watch" board look. The two dark blocks must stay identical
   (the first follows the system setting, the second is ?theme=dark). */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface-0: #050a1a;
    --surface-1: #0a1128;
    --cell: #0e1733;
    --cell-hover: #1a2750;
    --line: #1c2748;
    --text-primary: #ffffff;
    --text-secondary: #a9b3cf;
    --text-muted: #6e7a9c;
    --accent: #2f6bff;
    --now: #8a96b8;
    --tip-bg: #101a38;
    --tip-shadow: 0 8px 32px rgba(0,0,0,.6);
    --good: #0f5c45;
    --cat-endurance: #3987e5; --cat-physical: #d95926; --cat-skill: #199e70; --cat-mental: #c98500;
    --cat-hybrid: #d55181; --cat-puzzle: #008300; --cat-crapshoot: #9085e9; --cat-none: #36415f;
    --out-self: #3987e5; --out-other: #d95926; --out-kept: #36415f;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-0: #050a1a;
  --surface-1: #0a1128;
  --cell: #0e1733;
  --cell-hover: #1a2750;
  --line: #1c2748;
  --text-primary: #ffffff;
  --text-secondary: #a9b3cf;
  --text-muted: #6e7a9c;
  --accent: #2f6bff;
  --now: #8a96b8;
  --tip-bg: #101a38;
  --tip-shadow: 0 8px 32px rgba(0,0,0,.6);
  --good: #0f5c45;
  --cat-endurance: #3987e5; --cat-physical: #d95926; --cat-skill: #199e70; --cat-mental: #c98500;
  --cat-hybrid: #d55181; --cat-puzzle: #008300; --cat-crapshoot: #9085e9; --cat-none: #36415f;
  --out-self: #3987e5; --out-other: #d95926; --out-kept: #36415f;
}
/* ?simple=1, the stream view: every size steps up so it reads on a shrunk-down stream. */
:root.simple {
  --fs-3xs: 12px;
  --fs-2xs: 13px;
  --fs-xs: 14px;
  --fs-sm: 16px;
  --fs-md: 17px;
  --fs-lg: 18px;
  --fs-xl: 20px;
  --fs-2xl: 28px;
  --fs-3xl: 32px;
  --fs-4xl: 48px;
}

/* 2. Base ------------------------------------------------------------------ */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--surface-0); color: var(--text-primary);
  font: var(--fw-regular) var(--fs-md)/1.4 var(--font);
}
main { max-width: 1400px; margin: 0 auto; padding: var(--sp-6) var(--sp-4) 48px; }
.muted, .zero { color: var(--text-muted); }
.grow { flex: 1; }
.lead { font-size: var(--fs-lg); }
.tight { margin: var(--sp-1) 0; }
.mt-2 { margin-top: var(--sp-2) !important; }
.mt-3 { margin-top: var(--sp-3) !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.pct { font-variant-numeric: tabular-nums; }
.pct small { color: var(--text-muted); font-size: var(--fs-2xs); margin-left: 3px; }

/* Links: a name or season inside text is a .plink; source links inherit their color. */
a.plink { color: inherit; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 2px; }
a.plink:hover { text-decoration-color: currentColor; }
.src a, .season-info a { color: inherit; }
.voters a, footer a { color: var(--text-secondary); }

/* Focus: one ring for everything you can tab to. */
.tabs button:focus-visible, .seg button:focus-visible, .seg select:focus-visible,
.pager a:focus-visible, #drawer-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* Caps label: every UPPERCASE label shares its case, tracking and weight. Size is set where used. */
.kicker, .grid th, table.players th, table.plays th, .fin-card .role, .eg-round h3 .size,
.view-body h2, #drawer-body h3, .leaders h2, .afh-card h2, .simple .kicker {
  text-transform: uppercase; letter-spacing: var(--track-caps); font-weight: var(--fw-bold);
}

/* Section heading: splits a panel (or the drawer) into titled parts, with a rule above. */
.view-body h2, #drawer-body h3 {
  font-size: var(--fs-xs); color: var(--text-primary);
  margin: var(--sp-6) 0 var(--sp-2); padding-top: var(--sp-3); border-top: 1px solid var(--line);
}
.view-body h2:first-child { border-top: 0; margin-top: var(--sp-2); }
.leaders h2 { font-size: var(--fs-xs); margin: 0 0 var(--sp-2); }
/* Subheading: a round or part inside a section. */
#drawer-body h4, .wk-board h4 { font-size: var(--fs-sm); font-weight: var(--fw-semibold); color: var(--text-secondary); margin: var(--sp-3) 0 var(--sp-1); }

/* Panel: the white box each tab renders into; .view-body pads a panel of prose and charts. */
.panel { background: var(--surface-1); border: 1px solid var(--line); border-radius: var(--r-lg); overflow-x: auto; }
.view-body { padding: var(--sp-1) var(--inset) var(--sp-5); }
.scroll { overflow-x: auto; }

/* Card: a boxed item on a panel (a round, a jury column, a favorite, a leader). */
.board-col, .eg-round, .afh-card, .leaders li {
  border: 1px solid var(--line); border-radius: var(--r-xl); background: var(--surface-0);
}
.board-col.win, .afh-card.won, .leaders li:nth-child(1) { border-color: var(--gold); }

/* Stat tile: a big number and what it counts. */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--sp-2); margin-top: var(--sp-3); }
.stat { background: var(--surface-0); border-radius: var(--r-lg); padding: var(--sp-2) 10px; }
.stat b { display: block; font-size: var(--fs-2xl); font-variant-numeric: tabular-nums; }
.stat span { display: block; font-size: var(--fs-xs); line-height: 1.3; color: var(--text-secondary); }
.stat small { display: block; font-size: var(--fs-2xs); color: var(--text-muted); margin-top: 2px; }

/* Count badge: the number at the end of a card or leader row. */
.leaders .n, .board-col h3 .n {
  flex: none; font-size: var(--fs-xl); font-weight: var(--fw-heavy); padding: 3px 9px; border-radius: var(--r-md);
  background: var(--cell); font-variant-numeric: tabular-nums;
}
.leaders .n, .board-col.win h3 .n { background: var(--good); color: var(--on-good); }

/* Chip: a short label in a row of text. .tag is outlined; .cat and .t are filled. */
.tag, .cat, .t {
  display: inline-block; font-size: var(--fs-2xs); font-weight: var(--fw-regular); line-height: 17px;
  padding: 0 7px; border-radius: var(--r-pill); white-space: nowrap; color: var(--text-secondary);
}
.tag { box-shadow: inset 0 0 0 1px var(--line); margin-left: 6px; }
.tag.afh { box-shadow: inset 0 0 0 1px var(--gold); color: var(--text-primary); }
.cat, .t { background: var(--cell); }
.t { margin: 1px 3px 1px 0; }
/* Icon: an inline drawing (the HOH key, the veto medal) sized to the text around it. */
.icon { display: inline-block; width: 1.3em; height: 1.3em; vertical-align: -.3em; }
.t.icon-only { padding: 0 5px; }
.t .icon { width: 1.35em; height: 1.35em; }
th .icon { width: 1.8em; height: 1.8em; vertical-align: middle; }
.t.hoh { background: var(--accent); color: var(--on-accent); }
.t.veto { background: var(--good); color: var(--on-good); }
.t.nom { background: color-mix(in srgb, var(--warning) 32%, transparent); color: var(--text-primary); }
.t.out { background: var(--critical); color: var(--on-critical); }
.t.dec { background: none; box-shadow: inset 0 0 0 1px var(--text-primary); color: var(--text-primary); font-weight: var(--fw-semibold); }
.t.won { background: var(--gold); color: var(--on-gold); font-weight: var(--fw-bold); }

/* Controls: .tabs picks the view; .seg is every other picker or toggle. */
.toolbar { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; margin-bottom: var(--sp-4); }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px var(--sp-5); margin-bottom: var(--sp-3); }
.tabs {
  display: inline-flex; gap: 2px; padding: 3px; max-width: 100%; overflow-x: auto;
  background: var(--cell); border: 1px solid var(--line); border-radius: var(--r-lg);
}
.tabs button {
  flex: none; border: 0; background: none; color: var(--text-secondary); font: inherit; font-weight: var(--fw-semibold);
  padding: 6px 14px; border-radius: var(--r-md); cursor: pointer;
}
.tabs button:hover { color: var(--text-primary); }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }
/* Phones: nine tabs don't fit one row, so they sit in two rows (five, then four), all in sight. */
@media (max-width: 640px) {
  .tabs { display: grid; grid-template-columns: repeat(5, 1fr); width: 100%; overflow: visible; }
  .tabs button { padding: 7px var(--sp-1); font-size: var(--fs-sm); }
}
.seg {
  display: inline-flex; gap: 2px; padding: 2px; max-width: 100%; overflow-x: auto;
  background: var(--cell); border: 1px solid var(--line); border-radius: var(--r-lg); font-size: var(--fs-sm);
}
.seg button, .seg select {
  flex: none; border: 0; font: inherit; font-weight: var(--fw-semibold); border-radius: var(--r-md); cursor: pointer;
}
.seg button { background: none; color: var(--text-secondary); padding: var(--sp-1) var(--sp-3); }
.seg button:hover { color: var(--text-primary); }
.seg button[aria-pressed="true"], .seg select { background: var(--surface-1); color: var(--text-primary); }
.seg button[aria-pressed="true"] { box-shadow: var(--shadow-raised); }
.seg select { padding: var(--sp-1) var(--sp-2); }
/* Phones: a long picker (every season) wraps instead of hiding its last buttons. */
@media (max-width: 640px) { .seg { flex-wrap: wrap; overflow: visible; } }
.pager { display: flex; justify-content: space-between; gap: var(--sp-2); margin: var(--sp-3) 0 var(--sp-1); }
.pager a, .pager span {
  font-size: var(--fs-sm); font-weight: var(--fw-semibold); padding: 5px 10px; border-radius: var(--r-md);
  background: var(--cell); color: var(--text-primary); text-decoration: none;
}
.pager a:hover { background: var(--cell-hover); }
.pager span { visibility: hidden; }

/* Legends: .key for series colors, .legend for the grid's marks, .t-legend for chips. */
.legend, .key, .t-legend { display: flex; flex-wrap: wrap; font-size: var(--fs-xs); color: var(--text-secondary); }
.legend { gap: 6px var(--sp-4); }
.key { gap: var(--sp-1) 14px; margin: 0 0 10px; }
.t-legend { gap: 6px 14px; margin: 0 0 10px; }
.legend > span, .key span { display: inline-flex; align-items: center; gap: 6px; }
.key i, .tipkey { width: 10px; height: 10px; border-radius: var(--r-xs); display: inline-block; flex: none; }
#tip .tipkey { margin-right: 6px; vertical-align: -1px; }
.cat .tipkey, .cat-bar .tipkey { margin-right: var(--sp-1); vertical-align: 0; }

/* Small print: .voters under a list, .src for where data came from, .note under a heading. */
.voters { font-size: var(--fs-xs); color: var(--text-secondary); margin-top: 2px; }
.src { font-size: var(--fs-xs); color: var(--text-muted); margin: var(--sp-2) 0 0; }
.msg { padding: var(--sp-6); color: var(--text-secondary); }
ul.plain { margin: 0; padding-left: 18px; }
ul.plain li { margin: 3px 0; }
blockquote.wnote {
  margin: var(--sp-2) 0; padding: var(--sp-2) 10px; border-left: 3px solid var(--line); background: var(--surface-0);
  border-radius: 0 var(--r-md) var(--r-md) 0; font-size: var(--fs-sm);
}
blockquote.wnote cite { display: block; font-style: normal; color: var(--text-muted); font-size: var(--fs-2xs); margin-top: var(--sp-1); }

/* Table: .players is the base data table (numbers right-aligned, first column pinned). */
table.players { border-collapse: collapse; font-size: var(--fs-sm); min-width: 100%; }
table.players th, table.players td {
  padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums;
}
table.players th { color: var(--text-secondary); font-size: var(--fs-2xs); }
table.players th:first-child, table.players td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface-1); }
table.players .l { text-align: left; }
table.players td.result { text-align: left; color: var(--text-secondary); }
table.players tr:last-child td { border-bottom: 0; }
table.players .grp th { font-size: var(--fs-3xs); font-weight: var(--fw-semibold); color: var(--text-muted); padding-bottom: 0; border-bottom: 0; text-align: center; }
table.players .gs { border-left: 1px solid var(--line); }
table.players th abbr { text-decoration: none; cursor: help; }
/* .plays: a compact table inside the drawer. */
table.plays { border-collapse: collapse; width: 100%; font-size: var(--fs-sm); }
table.plays th { text-align: left; font-size: var(--fs-3xs); color: var(--text-muted); padding: var(--sp-1) var(--sp-2) var(--sp-1) 0; border-bottom: 1px solid var(--line); }
table.plays td { padding: 5px var(--sp-2) 5px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
table.plays td.n { font-variant-numeric: tabular-nums; color: var(--text-secondary); }
table.plays tr:last-child td { border-bottom: 0; }

/* Face: a houseguest's 4:5 headshot from the Big Brother Wiki, or their initials.
   Sizes: 20-26px in rows and chips, 28-36px in tables and cards, 72-104px as a portrait. */
.face {
  flex: none; display: inline-grid; place-items: center; width: 36px; aspect-ratio: 4 / 5; border-radius: var(--r-md);
  object-fit: cover; object-position: 50% 15%; background: var(--cell-hover); color: var(--text-secondary);
  font-size: var(--fs-xs); font-weight: var(--fw-bold); line-height: 1; overflow: hidden; vertical-align: middle;
}
/* A zoomed portrait (a full-length shot): scaled up from near the top, so the head stays in frame. */
.face.zoom img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 0; transform: scale(var(--zoom)); transform-origin: 50% 4%; }
.face.out { filter: grayscale(1); opacity: .75; }
.face.live { box-shadow: 0 0 0 2px var(--accent); }
.face.won { box-shadow: 0 0 0 2px var(--gold); }
.pl { display: flex; align-items: center; gap: 10px; }
.pl .face { width: 32px; }
.pl small { display: block; color: var(--text-muted); font-size: var(--fs-2xs); }
/* Phones: the pinned name column stays narrow enough to leave room for the numbers. */
@media (max-width: 640px) { .pl small { display: none; } .pl { gap: var(--sp-2); } .pl .face { width: 26px; } }

/* 3. Views ----------------------------------------------------------------- */
/* Page header and footer */
.kicker { margin: 0; font-size: var(--fs-xs); color: var(--text-muted); font-weight: var(--fw-regular); }
h1 { font-size: var(--fs-2xl); font-weight: var(--fw-semibold); margin: 2px 0 6px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pill {
  font-size: var(--fs-2xs); font-weight: var(--fw-bold); line-height: 1; padding: 5px var(--sp-2); border-radius: var(--r-sm);
  background: var(--accent); color: var(--on-accent); letter-spacing: var(--track-tight);
}
.sub { color: var(--text-secondary); margin: 0 0 var(--sp-4); }
footer { margin-top: var(--sp-4); color: var(--text-muted); font-size: var(--fs-xs); line-height: 1.7; }
footer p { margin: 0; }
footer a { white-space: nowrap; }
/* ?embed=1: drop the page's own title and intro so a host page can supply its own. */
.embed main { padding-top: var(--sp-2); }
.embed .kicker, .embed h1, .embed .sub { display: none; }
/* ?simple=1, the stream view, laid out like the stream's own boards: a season line, a
   title with the week pill, then every week in one text-only grid (photos are off unless
   ?photos=1). The intro, the legend, the twist-week corners and the tooltip's table text
   go; with ?embed=1 the tabs and pickers go too, for a browser source nobody clicks, but
   the title stays. */
.simple .sub, .simple #weeks-view .legend, .simple .cell .flag,
.simple #tip .raw, .embed.simple .toolbar, .embed.simple .controls { display: none; }
.embed.simple .kicker { display: block; }
.embed.simple h1 { display: flex; }
/* The credits stay (the licenses need them) but run as one paragraph under an overlay. */
.embed.simple footer p { display: inline; }
.embed.simple footer p + p::before { content: " · "; }
/* Every week fits the width, so the whole season is on screen at once. A phone is too
   narrow for that, so there the grid keeps scrolling sideways (to the airing week). */
@media (min-width: 641px) {
  .simple table.grid { table-layout: fixed; }
  .simple .grid thead th:first-child { width: 80px; }
  .simple .cell, .simple .cell:has(.faces) { min-width: 0; }
}
.simple .cell { min-height: 58px; }
.simple .cell:not(.multi) .part { min-height: 58px; }
/* Names wrap at a space; one still too wide for its column steps down a size or two (.fit,
   .fit-2, set by fitGrid()), and only then breaks, so it's never cut off. */
.simple .cell .part { font-weight: var(--fw-bold); padding: 3px 2px; white-space: normal; line-height: 1.15; }
.simple .cell .part.fit { font-size: var(--fs-xs); }
.simple .cell .part.fit-2 { font-size: var(--fs-2xs); overflow-wrap: anywhere; }
/* The season that's airing is marked along its left edge. */
.simple .grid tbody tr:first-child th { box-shadow: inset 3px 0 0 var(--text-primary); }
.simple .cell .part .face { width: 40px; }
.simple .cell .part.wrap .who .face { width: 30px; }
.simple .cell.multi .part .face, .simple .cell.multi .part.wrap .who .face { width: 24px; }

/* Weeks: the grid */
.swatch { width: 18px; height: 14px; border-radius: var(--r-xs); background: var(--cell); border: 1px solid var(--line); display: inline-grid; }
.swatch.split { grid-template-rows: 1fr 1fr; gap: 1px; background: var(--line); }
.swatch.split i { background: var(--cell); }
table.grid { border-collapse: collapse; margin: var(--sp-2); width: calc(100% - 16px); }
.grid th { color: var(--text-secondary); font-size: var(--fs-2xs); padding: var(--sp-2) 6px; white-space: nowrap; }
.grid thead th { text-align: center; border-bottom: 1px solid var(--line); }
.grid thead th:first-child { text-align: left; padding-left: var(--sp-3); position: sticky; left: 0; background: var(--surface-1); z-index: 1; }
.grid tbody th {
  text-align: left; font-size: var(--fs-sm); letter-spacing: var(--track-tight); text-transform: none; color: var(--text-primary);
  padding: 0 var(--sp-3); position: sticky; left: 0; background: var(--surface-1); z-index: 1;
}
.grid tbody tr + tr > * { border-top: 1px solid var(--line); }
.grid td + td, .grid th + td { border-left: 1px solid var(--line); }
.grid tbody th a { color: inherit; text-decoration: none; }
.grid tbody th a:hover { text-decoration: underline; }
.grid td { padding: 0; height: 1px; }
.grid td > .cell { height: 100%; }
/* The week currently airing gets an outlined column, like the broadcast board. */
.grid .now { position: relative; }
.grid thead th.now { color: var(--text-primary); }
.grid .now::after { content: ""; position: absolute; inset: 0; pointer-events: none; border: solid var(--now); border-width: 0 1px; }
.grid thead th.now::after { border-top-width: 1px; }
.grid tbody tr:last-child .now::after { border-bottom-width: 1px; }
.cell {
  display: grid; gap: 1px; width: 100%; min-width: 86px; min-height: 48px; padding: 0; border: 0;
  background: none; color: inherit; font: inherit; cursor: pointer; position: relative; text-align: center;
  -webkit-tap-highlight-color: transparent;
}
.cell .part {
  background: var(--cell); padding: 3px 6px; font-size: var(--fs-sm); font-weight: var(--fw-semibold);
  display: flex; align-items: center; justify-content: center; min-height: 23px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}
.cell.multi .part { font-size: var(--fs-xs); }
.cell .part.wrap { white-space: normal; font-size: var(--fs-xs); line-height: 1.15; }
.cell:not(.multi) .part { min-height: 48px; }
.cell:hover .part, .cell:focus-visible .part { background: var(--cell-hover); }
.cell:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.cell .empty { color: var(--text-muted); font-weight: var(--fw-regular); }
.cell .part.faces { flex-direction: column; gap: var(--sp-1); padding: 6px var(--sp-1); }
.cell .part .who { display: flex; gap: 3px; justify-content: center; }
.cell .part .face { width: 34px; }
.cell .part.wrap .who .face { width: 28px; }
.cell .part .nm { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.cell.multi .part.faces { flex-direction: row; gap: 5px; padding: 3px 5px; justify-content: flex-start; }
.cell:has(.faces) { min-width: 92px; }
.cell.multi .part .face, .cell.multi .part.wrap .who .face { width: 20px; border-radius: var(--r-sm); }
.cell .part.faces.wrap .nm { white-space: normal; }
/* A folded corner marks a week that isn't fully modeled (note) or failed a check (error). */
.flag { position: absolute; top: 0; right: 0; width: 0; height: 0; border-style: solid; border-width: 0 10px 10px 0; border-color: transparent var(--warning) transparent transparent; }
.flag.error { border-right-color: var(--critical); }
.legend .flag-swatch { position: relative; width: 18px; height: 14px; border-radius: var(--r-xs); background: var(--cell); border: 1px solid var(--line); overflow: hidden; display: inline-block; }
.legend .flag-swatch .flag { border-width: 0 var(--sp-2) var(--sp-2) 0; }

/* Tooltip */
#tip {
  position: fixed; z-index: 10; max-width: min(380px, calc(100vw - 32px)); pointer-events: none;
  background: var(--tip-bg); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--tip-shadow);
  padding: 10px var(--sp-3); font-size: var(--fs-sm); display: none;
}
#tip h3 { margin: 0 0 2px; font-size: var(--fs-md); }
#tip .status { font-size: var(--fs-xs); color: var(--text-secondary); margin-bottom: 6px; }
#tip .round + .round { border-top: 1px solid var(--line); margin-top: var(--sp-2); padding-top: var(--sp-2); }
#tip .round h4 { margin: 0 0 var(--sp-1); font-size: var(--fs-xs); font-weight: var(--fw-semibold); color: var(--text-secondary); }
#tip dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; }
#tip dt { color: var(--text-secondary); }
#tip dd { margin: 0; }
#tip dt.result, #tip dd.result { margin-top: 6px; }
#tip .raw { margin-top: var(--sp-2); font-size: var(--fs-xs); max-height: 260px; overflow: auto; }
#tip .raw table { border-collapse: collapse; }
#tip .raw td { border-top: 1px solid var(--line); padding: 2px 6px 2px 0; vertical-align: top; white-space: pre-line; }
#tip .raw td:first-child { color: var(--text-secondary); }
#tip .fn { margin-top: 6px; color: var(--text-muted); font-size: var(--fs-xs); }

/* Details drawer: a side panel, or a bottom sheet on phones */
#scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; }
#drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100vw); z-index: 21;
  display: flex; flex-direction: column; background: var(--surface-1);
  border-left: 1px solid var(--line); box-shadow: var(--shadow-drawer);
}
@media (max-width: 640px) {
  #drawer { top: auto; left: 0; width: auto; height: 88vh; border-left: 0; border-top: 1px solid var(--line); border-radius: var(--r-sheet) var(--r-sheet) 0 0; }
}
.drawer-head { display: flex; align-items: flex-start; gap: var(--sp-2); padding: var(--sp-4) var(--sp-4) 10px; border-bottom: 1px solid var(--line); }
.drawer-head h2 { margin: 0; font-size: var(--fs-xl); flex: 1; }
.drawer-head .status { color: var(--text-secondary); font-size: var(--fs-sm); font-weight: var(--fw-regular); margin-top: 2px; }
#drawer-close {
  flex: none; border: 0; background: var(--cell); color: var(--text-primary); width: 32px; height: 32px;
  border-radius: var(--r-lg); font-size: var(--fs-xl); cursor: pointer;
}
#drawer-body { overflow: auto; padding: var(--sp-1) var(--sp-4) 32px; font-size: var(--fs-md); }
#drawer-body dl, .wk-board dl { display: grid; grid-template-columns: auto 1fr; gap: 3px var(--sp-3); margin: 0; }
#drawer-body dt, .wk-board dt { color: var(--text-secondary); }
#drawer-body dd, .wk-board dd { margin: 0; }
#drawer-body dt.result, #drawer-body dd.result { margin-top: var(--sp-2); }
.round + .round { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 10px; }
dl.votes { grid-template-columns: minmax(90px, max-content) 1fr !important; row-gap: 6px !important; align-items: center; }
dl.votes dt { color: var(--text-primary) !important; display: flex; align-items: center; gap: var(--sp-2); }
dl.votes dt .face { width: 24px; border-radius: var(--r-sm); font-size: var(--fs-3xs); }
dl.bio { margin-top: var(--sp-3) !important; }
.bio-head { display: flex; gap: var(--sp-4); align-items: flex-start; margin-top: var(--sp-3); }
.bio-head > .face { width: 104px; border-radius: var(--r-xl); font-size: var(--fs-3xl); }
.bio-head dl.bio { margin-top: 0 !important; flex: 1; min-width: 0; }
@media (max-width: 400px) { .bio-head > .face { width: 84px; } }
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { display: grid; grid-template-columns: 116px 1fr; align-items: baseline; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); }
.timeline li > a, .timeline li > span:first-child { color: var(--text-secondary); font-size: var(--fs-xs); }
.ep { border-top: 1px solid var(--line); padding: var(--sp-2) 0; }
h3 + .ep { border-top: 0; padding-top: 0; }
.ep summary { cursor: pointer; }
.ep-meta { color: var(--text-secondary); font-size: var(--fs-xs); }
.ep p { margin: var(--sp-2) 0 0; font-size: var(--fs-sm); line-height: 1.5; }
.ep p + p { margin-top: 10px; }

/* Players */
/* Who they are (age, hometown, job) reads apart from the game stats. */
table.players td.bio { color: var(--text-secondary); text-align: left; }
table.players td.bio.num { text-align: right; }
table.players th.bio { text-align: left; }
.season-info { margin: 10px var(--sp-3) var(--sp-1); color: var(--text-secondary); font-size: var(--fs-sm); }
.leaders { margin: var(--sp-3) var(--sp-3) var(--sp-1); }
.view-body .leaders { margin: 10px 0 var(--sp-1); }
.leaders ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(150px, 1fr)); gap: 10px; }
.leaders li { display: flex; align-items: center; gap: 10px; padding: var(--sp-2) 10px; }
.leaders li:nth-child(2) { border-color: var(--silver); }
.leaders li:nth-child(3) { border-color: var(--bronze); }
.leaders .rank {
  flex: none; width: 22px; height: 22px; border-radius: var(--r-md); display: grid; place-items: center;
  font-size: var(--fs-xs); font-weight: var(--fw-heavy); background: var(--cell); color: var(--text-secondary);
}
.leaders li:nth-child(1) .rank { background: var(--gold); color: var(--on-gold); }
.leaders li:nth-child(2) .rank { background: var(--silver); color: var(--on-silver); }
.leaders li:nth-child(3) .rank { background: var(--bronze); color: var(--on-bronze); }
.leaders .face { width: 36px; }
.leaders .who { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
.leaders .who > * { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.leaders .who a { font-weight: var(--fw-bold); }
.leaders .who span { font-size: var(--fs-2xs); color: var(--text-secondary); }
@media (max-width: 900px) { .leaders ol { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 230px; overflow-x: auto; padding-bottom: var(--sp-1); } }

/* Comps */
table.comps th, table.comps td, table.jury th, table.jury td { text-align: left; }
table.comps th.day, table.comps td.day { text-align: right; color: var(--text-secondary); }
/* Major comps: a winner per season per comp, and the double evictions. Stacked winners (a co-veto, two plays) get a gap. */
table.major td { vertical-align: top; }
table.major td .pl + .pl { margin-top: var(--sp-1); }
table.major td.wrap { min-width: 120px; }
.major-guide { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--sp-3); max-width: 820px; font-size: var(--fs-md); }
.major-guide p { margin: 2px 0 0; color: var(--text-secondary); font-size: var(--fs-sm); }
.cat-bar { display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-4); margin: 10px var(--sp-3) var(--sp-1); font-size: var(--fs-sm); color: var(--text-secondary); }
.view-body .cat-bar { margin: var(--sp-1) 0 10px; }
.cat-bar b { color: var(--text-primary); font-variant-numeric: tabular-nums; }

/* Finale */
.fin-head { display: flex; align-items: center; justify-content: center; gap: var(--sp-3) 32px; flex-wrap: wrap; padding: 18px 0 var(--sp-1); }
.fin-card { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; min-width: 120px; }
.fin-card .face { width: 96px; border-radius: var(--r-xl); font-size: var(--fs-3xl); }
.fin-card a { font-size: var(--fs-xl); font-weight: var(--fw-bold); }
.fin-card .role { font-size: var(--fs-2xs); line-height: 1.3; color: var(--text-muted); }
.fin-card.win .role { color: var(--text-primary); }
.fin-score { font-size: var(--fs-4xl); font-weight: var(--fw-heavy); font-variant-numeric: tabular-nums; }
.fin-lede { text-align: center; color: var(--text-secondary); margin: var(--sp-2) auto 0; font-size: var(--fs-lg); max-width: 640px; }
.board { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: var(--sp-3); }
.board-col { padding: 10px var(--sp-3) var(--sp-3); }
.board-col h3 { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; font-size: var(--fs-lg); }
.board-col h3 .face { width: 32px; }
.board-col h3 .n { margin-left: auto; }
.board-col ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.board-col li {
  display: flex; align-items: center; gap: 6px; font-size: var(--fs-sm); background: var(--surface-1);
  border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--sp-1) 9px var(--sp-1) var(--sp-1);
}
.board-col li .face { width: 26px; border-radius: var(--r-sm); font-size: var(--fs-3xs); }
.board-col li small { color: var(--text-muted); font-size: var(--fs-2xs); }
.board-col .none { color: var(--text-muted); font-size: var(--fs-sm); }
table.jury td { vertical-align: middle; }
table.jury td.why { white-space: normal; min-width: 180px; }
table.jury .tag { margin: 0 var(--sp-1) 0 0; }
table.duel { min-width: 0; width: 100%; max-width: 560px; }
table.duel th[scope="row"] {
  text-align: left; font-size: var(--fs-sm); font-weight: var(--fw-regular); color: var(--text-secondary);
  text-transform: none; letter-spacing: 0; position: sticky; left: 0; background: var(--surface-1);
}
table.duel thead th { text-align: right; font-size: var(--fs-sm); color: var(--text-primary); text-transform: none; letter-spacing: 0; }
table.duel tr:last-child th { border-bottom: 0; }
@media (max-width: 640px) {
  .fin-head { flex-wrap: nowrap; gap: var(--sp-3); }
  .fin-card { min-width: 0; }
  .fin-card .face { width: 72px; }
  .fin-score { font-size: var(--fs-3xl); }
}

/* HOH and Veto: trends across seasons, a season's weeks, and each week of the game */
.trend h2 { margin-bottom: var(--sp-1); }
.trend .note { color: var(--text-secondary); font-size: var(--fs-sm); margin: 0 0 var(--sp-3); max-width: 760px; }
.trend .lede { font-size: var(--fs-lg); margin: 14px 0 var(--sp-1); max-width: 820px; }
.trend .stats { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); max-width: 900px; }
.trend table.players td.wrap { white-space: normal; min-width: 150px; }
.trend table.players td .tag { margin: 0 var(--sp-1) 0 0; }
.trend .pl .face { width: 28px; }
/* A horizontal stacked bar: segments split by a 2px surface gap, rounded at the ends. */
.sbar { display: flex; gap: 2px; min-width: 150px; height: 18px; }
.sbar i {
  display: block; height: 100%; min-width: 3px; font: var(--fw-semibold) var(--fs-2xs)/18px var(--font); font-style: normal;
  color: var(--on-series); text-align: center; overflow: hidden;
}
.sbar i.lt { color: var(--on-series-light); }
.sbar i:first-child { border-radius: var(--r-sm) 0 0 var(--r-sm); }
.sbar i:last-child { border-radius: 0 var(--r-sm) var(--r-sm) 0; }
.sbar i:only-child { border-radius: var(--r-sm); }
/* Columns by week of the season. */
.wkchart { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(34px, 1fr); gap: 6px; max-width: 820px; }
.wkcol { display: flex; flex-direction: column; align-items: stretch; gap: var(--sp-1); }
.wkcol .bar { height: 140px; display: flex; flex-direction: column-reverse; gap: 2px; border-bottom: 1px solid var(--line); }
.wkcol .bar i { display: block; min-height: 3px; }
.wkcol .bar i:last-child { border-radius: var(--r-sm) var(--r-sm) 0 0; }
.wkcol .top { font-size: var(--fs-2xs); color: var(--text-secondary); text-align: center; font-variant-numeric: tabular-nums; min-height: 15px; }
.wkcol .lbl { font-size: var(--fs-2xs); color: var(--text-muted); text-align: center; }
.wkcol .spacer { flex: 1; }
/* The week board: the grid's cells, with a strip in the series color along the bottom. */
.board-grid .cell { text-decoration: none; }
.board-grid .cell .part { position: relative; padding-bottom: 7px; }
.board-grid .cell .part::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: var(--sp-1); background: var(--strip, transparent); }
.board-grid .cell .part.faces .face { width: 30px; }
.board-grid .cell.multi .part::after { height: 3px; }

/* Endgame */
.eg-cast { display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); gap: var(--sp-3); padding: var(--sp-4) 0 var(--sp-1); }
.eg-cast .fin-card { min-width: 0; }
.eg-cast .fin-card .face { width: 72px; font-size: var(--fs-2xl); }
/* Out of the game: a quiet ring the same width as the live one, so every portrait lines up. */
.eg-cast .fin-card .face.out { box-shadow: 0 0 0 2px var(--line); }
.eg-cast .fin-card a { font-size: var(--fs-lg); }
.eg-cast .fin-card small { font-size: var(--fs-xs); color: var(--text-secondary); }
@media (max-width: 640px) {
  .eg-cast { grid-template-columns: repeat(auto-fit, minmax(60px, 1fr)); gap: 6px; }
  .eg-cast .fin-card .face { width: 52px; font-size: var(--fs-xl); }
  .eg-cast .fin-card a { font-size: var(--fs-sm); }
  .eg-cast .fin-card .role { font-size: var(--fs-3xs); letter-spacing: 0; }
}
ul.eg-notes { margin: 0; padding-left: 18px; line-height: 1.55; }
ul.eg-notes li { margin: var(--sp-1) 0; }
.eg-rounds { display: grid; gap: var(--sp-3); }
.eg-round { padding: 10px 14px var(--sp-3); }
.eg-round h3 { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 0; font-size: var(--fs-lg); }
.eg-round h3 .size {
  font-size: var(--fs-2xs); font-weight: var(--fw-heavy); padding: 3px var(--sp-2); border-radius: var(--r-md);
  background: var(--accent); color: var(--on-accent);
}
.eg-round h3 a.wk { font-size: var(--fs-sm); font-weight: var(--fw-regular); color: var(--text-secondary); }
.eg-round .rule { color: var(--text-muted); font-size: var(--fs-xs); margin: var(--sp-1) 0 0; }
.eg-round .story { margin: var(--sp-2) 0 0; line-height: 1.55; }
.eg-round .decider { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: var(--sp-2); font-size: var(--fs-xs); color: var(--text-secondary); }
.eg-round .decider .face { width: 22px; border-radius: var(--r-sm); font-size: var(--fs-3xs); }
table.power th, table.power td { text-align: left; vertical-align: top; white-space: normal; }
table.power td { min-width: 112px; }
table.power td.gone { background: var(--surface-0); }
table.power thead th small { display: block; font-weight: var(--fw-regular); text-transform: none; letter-spacing: 0; color: var(--text-muted); }
.eg-picks { display: flex; flex-wrap: wrap; gap: 10px var(--sp-5); align-items: center; }
.eg-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: var(--sp-2); margin: 0 0 var(--sp-3); }
.eg-tiles .stat { margin: 0; }
.eg-tiles .stat b small { font-size: var(--fs-sm); font-weight: var(--fw-semibold); color: var(--text-muted); }
table.across th, table.across td { text-align: left; }
table.across tr.here td, table.across tr.here td:first-child { background: var(--cell); }

/* Week board (#week=26/11 in the simple view) and one week across seasons (#weekall=11):
   the story behind a week on the stream's stock-watch dashboard, on one screen. */
.wk-board .stats { max-width: none; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.wk-board .stat b { line-height: 1.15; }
.wk-board .stat.out b { color: var(--critical); }
.wk-board .lede { max-width: none; }
.wk-board table.across td { white-space: normal; vertical-align: top; }
.wk-board table.across td.why { min-width: 180px; color: var(--text-secondary); }
.embed.simple .wk-board .pager { display: none; }

/* America's Favorite HouseGuest */
.afh-facts { margin: var(--sp-1) var(--inset) 0; }
.afh-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--sp-3); padding: var(--sp-3) var(--inset) var(--sp-5); }
@media (max-width: 640px) { .afh-list { grid-template-columns: none; } }
.afh-src { padding: 0 var(--inset) var(--inset); }
.afh-card { padding: var(--sp-3) 14px 14px; min-width: 0; }
.afh-card h2 { display: flex; align-items: baseline; gap: var(--sp-2); margin: 0 0 10px; font-size: var(--fs-xs); }
.afh-card h2 .n { margin-left: auto; font-size: var(--fs-sm); letter-spacing: 0; text-transform: none; font-weight: var(--fw-bold); }
.afh-who { display: flex; gap: var(--sp-3); align-items: center; }
.afh-who .face { width: 72px; border-radius: var(--r-xl); font-size: var(--fs-2xl); flex: none; align-content: center; }
.afh-who > span:not(.face) { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.afh-who a { font-size: var(--fs-xl); font-weight: var(--fw-bold); }
.afh-who small { color: var(--text-secondary); font-size: var(--fs-xs); }
.afh-card .voters { margin-top: 10px; }
.afh-card blockquote.wnote { margin-top: 10px; background: var(--surface-1); }
.afh-card .none { color: var(--text-muted); font-size: var(--fs-md); margin: 0; }
</style>
</head>
<body>
<main>
  <p class="kicker" id="kicker">Big Brother US</p>
  <h1><span id="view-title">Week by week</span> <span class="pill" id="now-pill" hidden></span></h1>
  <p class="sub" id="view-sub">Who was evicted each week, or who was HOH. Click or tap a week for the full story.</p>
  <div class="toolbar">
    <div class="tabs" role="tablist" aria-label="View">
      <button role="tab" id="tab-weeks" aria-selected="true" aria-controls="weeks-view">Weeks</button>
      <button role="tab" id="tab-players" aria-selected="false" aria-controls="players-view">Players</button>
      <button role="tab" id="tab-comps" aria-selected="false" aria-controls="comps-view">Comps</button>

      <span id="legend-error" hidden><i class="flag-swatch"><i class="flag error"></i></i> Failed a check</span>
    </span>

  </section>

    <div class="controls eg-picks">
      <span class="seg" id="endgame-season-pick" role="group" aria-label="Season"></span>
      <span class="seg" id="endgame-start-pick" role="group" aria-label="Start the endgame at"></span>
    </div>
    <div class="panel" id="endgame-panel"></div>

    <div class="controls"><span class="seg" id="finale-season-pick" role="group" aria-label="Season"></span></div>
    <div class="panel" id="finale-panel"></div>
  </section>
  <section id="hoh-view" role="tabpanel" aria-labelledby="tab-hoh" hidden>
    <div class="controls"><span class="seg" id="hoh-season-pick" role="group" aria-label="Seasons"></span></div>
    <div class="panel" id="hoh-panel"></div>
  </section>
  <section id="veto-view" role="tabpanel" aria-labelledby="tab-veto" hidden>
    <div class="controls"><span class="seg" id="veto-season-pick" role="group" aria-label="Seasons"></span></div>
    <div class="panel" id="veto-panel"></div>

    <div class="panel" id="afh-panel"></div>

    <div class="panel" id="analytics-panel"></div>

    <div class="panel" id="board-panel"></div>
  </section>
