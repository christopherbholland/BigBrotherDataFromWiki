  return `<p class="key" aria-hidden="true">${items.map(([label, color]) => `<span><i style="background:${color}"></i>${esc(label)}</span>`).join("")}</p>`;
}

// A 100% bar: [[label, n, color], …]. The counts are in the tooltip and the table beside it.
function stackBar(parts, title) {
  const total = parts.reduce((a, [, n]) => a + n, 0);
  if (!total) return `<span class="zero">–</span>`;
  const tip = `<h3>${esc(title)}</h3>` + parts.filter(([, n]) => n).map(([l, n, c]) => `<div>${swatch(c)}${esc(l)}: <b>${n}</b> (${pctOf(n, total)}%)</div>`).join("");
  return `<div class="sbar" role="img" aria-label="${esc(parts.filter(([, n]) => n).map(([l, n]) => `${l} ${n}`).join(", "))}"${tipAttr(tip)}>`
    + parts.filter(([, n]) => n).map(([, n, c]) => `<i style="width:${(100 * n / total).toFixed(1)}%;background:${c}"></i>`).join("") + `</div>`;
}

const catParts = cats => [...CATEGORY_NAMES.map(c => [c, cats[c], catVar(c)]), ["Not typed", cats[""], catVar("")]];

// Columns by week of the season, each a stack of [label, n, color] parts.
function weekChart(groups, topText) {
  const unit = 128 / Math.max(1, ...groups.map(g => g.parts.reduce((a, [, n]) => a + n, 0)));
  return `<div class="scroll"><div class="wkchart">` + groups.map(g => {
    const total = g.parts.reduce((a, [, n]) => a + n, 0);
    const tip = `<h3>Week ${g.week}</h3><div class="status">${plural(total, "round")} across the seasons</div>`
      + g.parts.filter(([, n]) => n).map(([l, n, c]) => `<div>${swatch(c)}${esc(l)}: <b>${n}</b></div>`).join("");
    return `<div class="wkcol"${tipAttr(tip)} aria-label="Week ${g.week}: ${esc(g.parts.filter(([, n]) => n).map(([l, n]) => `${l} ${n}`).join(", "))}">`
      + `<span class="top">${topText(g)}</span><div class="bar">`
      + g.parts.filter(([, n]) => n).map(([, n, c]) => `<i style="height:${(n * unit).toFixed(1)}px;background:${c}"></i>`).join("")
      + `</div><span class="lbl">Wk ${g.week}</span></div>`;
  }).join("") + `</div></div>`;
}

function byWeekNumber(rounds) {
  const by = new Map();
  rounds.filter(x => x.week != null).forEach(x => { if (!by.has(x.week)) by.set(x.week, []); by.get(x.week).push(x); });
  return [...by].sort((a, b) => a[0] - b[0]).map(([week, xs]) => ({ week, xs }));
}

// The seasons × weeks board: the grid's cells, showing the HOH or veto winner, with a strip in the series color.
function trendBoard(kind, rounds) {
  const seasons = [...new Set(rounds.map(x => x.season))].sort((a, b) => b - a);
  const labels = [];
  for (const w of [...DATA.weeks].sort((a, b) => (a.week ?? 1e9) - (b.week ?? 1e9))) {
    if (seasons.includes(w.season) && !labels.includes(w.week_label)) labels.push(w.week_label);
  }
  const at = new Map();
  rounds.forEach(x => { const k = `${x.season}|${x.label}`; if (!at.has(k)) at.set(k, []); at.get(k).push(x); });
  let html = `<table class="grid board-grid"><thead><tr><th scope="col">Season</th>${labels.map(l => `<th scope="col">${esc(l.replace(/^Week\s*/i, "Wk "))}</th>`).join("")}</tr></thead><tbody>`;
  for (const s of seasons) {
    html += `<tr><th scope="row"><a href="#${kind}=${s}">BB${s}</a></th>`;
    for (const l of labels) {
      const xs = at.get(`${s}|${l}`);
      if (!xs) { html += `<td></td>`; continue; }
      const parts = xs.map(x => boardPart(kind, x)).join("");
      html += `<td><a class="cell${xs.length > 1 ? " multi" : ""}" href="${weekHash(s, l)}"${tipAttr(xs.map(x => boardTip(kind, x)).join(""))}`
        + ` aria-label="${esc(`BB${s} ${l}: ${xs.map(x => boardText(kind, x)).join("; ")}`)}">${parts}</a></td>`;
    }
    html += `</tr>`;
  }
  return `<div class="scroll">${html}</tbody></table></div>`;
}

function boardPart(kind, x) {
  const names = kind === "hoh" ? x.r.hoh : x.r.veto_winners;
  const color = kind === "hoh" ? (names.length ? catVar(x.hohComp && x.hohComp.category) : "transparent")
    : x.hasVeto ? outColor[x.vetoOutcome] : "transparent";
  const text = names.join(" & ");
  const wrap = names.length > 1 ? " wrap" : "";
  if (showFaces && names.length) {
    return `<span class="part faces${wrap}" style="--strip:${color}"><span class="who">${names.map(n => faceHtml(x.season, n)).join("")}</span><span class="nm">${esc(text)}</span></span>`;
  }
  return `<span class="part${wrap}${names.length ? "" : " empty"}" style="--strip:${color}">${esc(text || "—")}</span>`;
}

function boardText(kind, x) {
  if (kind === "hoh") return x.r.hoh.length ? `HOH ${x.r.hoh.join(" & ")}${x.hohComp && x.hohComp.category ? `, ${x.hohComp.category}` : ""}` : "no HOH";
  return x.hasVeto ? `veto ${x.r.veto_winners.join(" & ")}, ${vetoSentence(x, false)}` : "no veto";
}

function boardTip(kind, x) {
  const head = `<h3>BB${x.season} · ${esc(x.key)}</h3>`;
  const c = kind === "hoh" ? x.hohComp : x.vetoComp;
  const comp = c ? `<div class="status">${c.category ? swatch(kind === "hoh" ? catVar(c.category) : "var(--line)") : ""}“${esc(c.name)}”${c.format ? ` (${esc(c.format)})` : ""}${c.category ? ` · ${esc(c.category)}` : ""}</div>` : "";
  const row = (dt, dd) => dd ? `<dt>${dt}</dt><dd>${dd}</dd>` : "";
  if (kind === "hoh") {
    return `<div class="round">${head}${comp}<dl>${row("HOH", esc(x.r.hoh.join(" & ")))}${row("Noms", esc(x.r.nominees_initial.join(", ")))}`
      + row("Evicted", x.r.evicted ? `${esc(x.r.evicted)} <span class="muted">${esc(hohOutcomeText(x))}</span>` : "") + `</dl></div>`;
  }
  return `<div class="round">${head}${comp}<dl>${row("Veto", esc(x.r.veto_winners.join(" & ")) + (x.hasVeto ? ` <span class="muted">(${esc(x.vetoRoles.map(roleText).join(", "))})</span>` : ""))}`
    + row("Outcome", x.hasVeto ? `${swatch(outColor[x.vetoOutcome])}${esc(vetoSentence(x, false))}` : "")
    + row("Evicted", x.r.evicted ? `${esc(x.r.evicted)}${x.replaced ? ` <span class="muted">(${x.backdoor ? "backdoored" : "the replacement"})</span>` : ""}` : "") + `</dl></div>`;
}

const roleText = r => ({ hoh: "the HOH", nominee: "a nominee", hg: "not nominated" })[r];

function hohOutcomeText(x) {
  return { theirs: "one of the HOH’s nominees", backdoor: "backdoored: a replacement who didn’t play in the veto",
    renom: x.vetoPlayed ? "a replacement nominee who played in the veto" : "a replacement nominee", final: "the final HOH’s choice" }[x.hohOutcome] || "";
}

// "Used on themselves", "Used on Cam; Angela named", "Not used", plus anyone a twist took off the block.
function vetoSentence(x, links = true) {
  const name = n => links ? plink(x.season, n) : esc(n);
  const v = x.v, winners = x.r.veto_winners;
  let s;
  if (!v.used) s = "Not used";
  else {
    const self = v.on.filter(n => winners.includes(n)), others = v.on.filter(n => !winners.includes(n));
    s = "Used on " + [...(self.length ? [winners.length > 1 ? `${self.map(name).join(" and ")} (themselves)` : "themselves"] : []), ...others.map(name)].join(" and ");
    if (v.replacements.length) s += `; ${v.replacements.map(name).join(" and ")} named`;
  }
  if (v.twist_saved.length) s += `; ${v.twist_saved.map(name).join(" and ")} saved by a twist`;
  return s;
}

function scopePickerHtml(scope) {
  const list = seasonList();
  if (list.length + 1 <= SEASON_BUTTONS_MAX) {
    return `<button aria-pressed="${scope === "all"}" data-season="all">All seasons</button>`
      + list.map(s => `<button aria-pressed="${s === scope}" data-season="${s}">BB${s}</button>`).join("");
  }
  return `<select aria-label="Seasons"><option value="all"${scope === "all" ? " selected" : ""}>All seasons</option>${list.map(s =>
    `<option value="${s}"${s === scope ? " selected" : ""}>BB${s}</option>`).join("")}</select>`;
}

async function showTrend(kind, scope) {
  setView(kind);
  currentScope = scope;
  if (scope !== "all") currentSeason = scope;
  $(`${kind}-season-pick`).innerHTML = scopePickerHtml(scope);
  const panel = $(`${kind}-panel`);
  if (!DETAILS) panel.innerHTML = `<div class="msg">Loading…</div>`;
  let d;
  try { d = await loadDetails(); } catch (err) { panel.innerHTML = `<div class="msg">${errorHtml(err)}</div>`; return; }
  if (currentView !== kind || currentScope !== scope) return;
  const all = trendRounds(d);
  if (scope !== "all" && !all.some(x => x.season === scope)) { panel.innerHTML = `<div class="msg">No rounds modeled for BB${scope}.</div>`; return; }
  const body = kind === "hoh"
    ? (scope === "all" ? hohAllHtml(all) : hohSeasonHtml(all, scope))
    : (scope === "all" ? vetoAllHtml(all) : vetoSeasonHtml(all, scope));
  panel.innerHTML = `<div class="view-body trend">${body}</div>`;
}

// Top five for one season or every season, in the Players view's leaders strip.
function trendLeaders(title, top, word, words, allSeasons) {
  const list = top.filter(t => t.n > 1).slice(0, 5);
  if (list.length < 3) return "";
  const people = new Map(DETAILS.players.map(p => [`${p.season}|${p.name}`, p]));
  return `<h2>${esc(title)}</h2><section class="leaders" aria-label="${esc(title)}"><ol>`
    + list.map((t, i) => {
      const p = people.get(`${t.season}|${t.name}`);
      return `<li><span class="rank" aria-label="Rank ${i + 1}">${i + 1}</span>${faceHtml(t.season, t.name, p ? faceState(p) : "")}`
        + `<span class="who">${plink(t.season, t.name)}<span>${allSeasons ? `BB${t.season} · ` : ""}${esc(p && p.result ? p.result.replace(/\s*\(.*\)$/, "") : "In the game")}</span></span>`
        + `<span class="n" title="${esc(`${t.n} ${t.n === 1 ? word : words}`)}">${t.n}</span></li>`;
    }).join("") + `</ol></section>`;
}

// ---- HOH ----

function hohAllHtml(all) {
  const t = hohStats(all);
  const seasons = [...new Set(all.map(x => x.season))].sort((a, b) => b - a);
  const per = seasons.map(s => ({ s, st: hohStats(all.filter(x => x.season === s)) }));
  const lede = `Across ${seasonsText(all)}, ${t.wins} HOH wins went to ${t.people} houseguests. `
    + `The HOH’s own nominee went home ${pctOf(t.theirs, t.decided)}% of the time; the rest were replacement nominees, and ${plural(t.backdoor, "was a backdoor", "were backdoors")}: named after the veto without having played in it. `
    + `In finished seasons, eventual winners won ${pctOf(t.byWinner, t.doneWins)}% of the HOHs, and ${pctOf(t.exEvicted, t.after)}% of HOHs were evicted the very next round.`
    + mostInSeason(t.top);
  const rows = per.map(({ s, st }) => {
    const best = st.top[0];
    return `<tr><td class="l"><a class="plink" href="#hoh=${s}">BB${s}</a></td><td>${st.rounds}</td><td>${st.people}</td>`
      + `<td class="l">${best ? `<div class="pl">${faceHtml(s, best.name)}<span>${plink(s, best.name)} <span class="muted">×${best.n}</span></span></div>` : ""}</td>`
      + `<td>${pctCell(st.byWinner, st.doneWins)}</td><td>${pctCell(st.theirs, st.decided)}</td><td>${pctCell(st.backdoor, st.decided)}</td>`
      + `<td>${pctCell(st.exEvicted, st.after)}</td><td>${pctCell(st.alsoVeto, st.withVeto)}</td>`
      + `<td class="l">${stackBar(catParts(st.cats), `BB${s} HOH competitions`)}</td></tr>`;
  }).join("");
  const foot = `<tr><td class="l"><strong>All</strong></td><td>${t.rounds}</td><td>${t.people}</td><td></td>`
    + `<td>${pctCell(t.byWinner, t.doneWins)}</td><td>${pctCell(t.theirs, t.decided)}</td><td>${pctCell(t.backdoor, t.decided)}</td>`
    + `<td>${pctCell(t.exEvicted, t.after)}</td><td>${pctCell(t.alsoVeto, t.withVeto)}</td><td class="l">${stackBar(catParts(t.cats), "Every HOH competition")}</td></tr>`;
  const weeks = byWeekNumber(all.filter(x => x.r.hoh.length)).map(({ week, xs }) => {
    const cats = hohStats(xs).cats;
    return { week, xs, parts: catParts(cats) };
  });
  return `<p class="lede">${lede}</p>`
    + `<div class="stats">${statTile(t.wins, "HOH wins", `${t.people} different houseguests`)}`
    + statTile(`${pctOf(t.theirs, t.decided)}%`, "HOH’s nominee went home", `${t.theirs} of ${t.decided} evictions`)
    + statTile(`${pctOf(t.byWinner, t.doneWins)}%`, "Won by the eventual winner", `${t.byWinner} of ${t.doneWins}, finished seasons`)
    + statTile(`${pctOf(t.exEvicted, t.after)}%`, "Evicted the round after", `${t.exNominated} of ${t.after} were nominated`) + `</div>`
    + `<h2>Season by season</h2><p class="note">One row per season. A backdoor is a replacement nominee evicted without having played in the veto, so they never had a shot at saving themselves. A replacement who played, or whose veto players the sources don’t name, isn’t counted as one. The final HOH, who evicts one of the last three directly, isn’t counted.</p>`
    + keyHtml(catParts(t.cats).map(([l, , c]) => [l, c]))
    + `<div class="scroll"><table class="players"><thead><tr><th scope="col" class="l">Season</th><th scope="col"><abbr title="HOH rounds (a co-HOH week is one round)">Rounds</abbr></th><th scope="col"><abbr title="Different houseguests who won HOH">Winners</abbr></th>`
    + `<th scope="col" class="l">Most by one</th><th scope="col"><abbr title="HOHs won by the season’s eventual winner">By the winner</abbr></th>`
    + `<th scope="col"><abbr title="The evicted houseguest was one of the HOH’s nominees">Nominee went home</abbr></th><th scope="col"><abbr title="A replacement nominee who hadn’t played in the veto was evicted">Backdoor</abbr></th>`
    + `<th scope="col"><abbr title="The HOH was evicted in the next round">Out next round</abbr></th><th scope="col"><abbr title="The HOH also won that round’s veto">Also won veto</abbr></th>`
    + `<th scope="col" class="l">Competition types</th></tr></thead><tbody>${rows}${foot}</tbody></table></div>`
    + `<h2>Week by week</h2><p class="note">Every HOH, colored by the kind of competition. Hover for the competition and who went home; click for the week.</p>`
    + keyHtml(catParts(t.cats).map(([l, , c]) => [l, c])) + trendBoard("hoh", all)
    + `<h2>By week of the season</h2><p class="note">What kind of competition decided HOH in each week, all seasons together. The number on top is how many HOHs were played that week.</p>`
    + keyHtml(catParts(t.cats).map(([l, , c]) => [l, c])) + weekChart(weeks, g => g.xs.length)
    + trendLeaders("Most HOHs in a season", t.top, "HOH", "HOHs", true)
    + `<p class="src">From Wikipedia’s voting tables; competition names and types from the Big Brother Wiki. Twist weeks the grid doesn’t fully model count only the rounds it does.</p>`;
}

function hohSeasonHtml(all, season) {
  const mine = all.filter(x => x.season === season);
  const st = hohStats(mine), t = hohStats(all);
  const vs = (n, d, tn, td) => d && td ? `all seasons: ${pctOf(tn, td)}%` : "";
  const lede = `In BB${season}, ${st.wins} HOH wins went to ${st.people} houseguests.`
    + (st.decided ? ` The HOH’s own nominee went home ${st.theirs} of ${st.decided} times, and ${plural(st.backdoor, "eviction was a backdoor", "evictions were backdoors")}.` : "");
  const rows = mine.filter(x => x.r.hoh.length).map(x => {
    const c = x.hohComp;
    const out = { theirs: `<span class="tag">Their nominee</span>`, backdoor: `<span class="tag">Backdoor</span>`, renom: `<span class="tag">Replacement</span>`, final: `<span class="tag">Final HOH</span>` }[x.hohOutcome] || "";
    const next = x.exEvicted ? `<span class="tag">Evicted</span>` : x.exNominated ? `<span class="tag">Nominated</span>` : x.exEvicted == null ? "" : `<span class="muted">Safe</span>`;
    return `<tr><td class="l"><a class="plink" href="${weekHash(season, x.label)}">${esc(x.key)}</a></td>`
      + `<td class="l">${x.r.hoh.map(n => `<div class="pl">${faceHtml(season, n)}${plink(season, n)}</div>`).join("")}</td>`
      + `<td class="l">${c ? `“${esc(c.name)}”${c.format ? ` <span class="muted">(<a class="plink" href="${compHash(c.format)}">${esc(c.format)}</a>)</span>` : ""}` : `<span class="zero">–</span>`}</td>`
      + `<td class="l">${c && c.category ? `<span class="cat">${swatch(catVar(c.category))}${esc(c.category)}</span>` : `<span class="zero">–</span>`}</td>`
      + `<td class="l wrap">${x.r.nominees_initial.map(n => plink(season, n)).join(", ") || `<span class="zero">–</span>`}</td>`
      + `<td class="l">${x.r.evicted ? `${plink(season, x.r.evicted)} ${out}` : `<span class="zero">–</span>`}</td>`
      + `<td class="l">${next}</td></tr>`;
  }).join("");
  return `<p class="lede">${lede}</p>`
    + `<div class="stats">${statTile(st.wins, "HOH wins", `${st.people} different houseguests`)}`
    + statTile(st.decided ? `${pctOf(st.theirs, st.decided)}%` : "–", "HOH’s nominee went home", vs(st.theirs, st.decided, t.theirs, t.decided))
    + statTile(st.doneWins ? `${pctOf(st.byWinner, st.doneWins)}%` : "–", "Won by the eventual winner", st.doneWins ? vs(st.byWinner, st.doneWins, t.byWinner, t.doneWins) : "season still airing")
    + statTile(st.after ? `${pctOf(st.exEvicted, st.after)}%` : "–", "Evicted the round after", vs(st.exEvicted, st.after, t.exEvicted, t.after)) + `</div>`
    + trendLeaders(`Most HOHs in BB${season}`, st.top, "HOH", "HOHs", false)
    + `<h2>Every HOH</h2><div class="cat-bar">${catParts(st.cats).filter(([, n]) => n).map(([l, n, c]) => `<span>${swatch(c)}<b>${n}</b> ${esc(l)}</span>`).join("")}</div>`
    + `<div class="scroll"><table class="players"><thead><tr><th scope="col" class="l">Week</th><th scope="col" class="l">HOH</th><th scope="col" class="l">Competition</th>`
    + `<th scope="col" class="l">Type</th><th scope="col" class="l">Nominated</th><th scope="col" class="l">Went home</th><th scope="col" class="l"><abbr title="What happened to the HOH in the next round">Next round</abbr></th></tr></thead>`
    + `<tbody>${rows}</tbody></table></div>`
    + `<p class="src">“Their nominee”: one of the HOH’s nominees went home. “Backdoor”: a replacement nominee who hadn’t played in the veto went home. “Replacement”: a replacement nominee who played in the veto, or whose veto players the episode summaries don’t name, went home. <a class="plink" href="#hoh=all">Compare every season ›</a></p>`;
}

// ---- Veto ----

const vetoParts = st => VETO_OUT.map(([k, l, c]) => [l, st[k], c]);

function vetoAllHtml(all) {
  const t = vetoStats(all);
  const seasons = [...new Set(all.map(x => x.season))].sort((a, b) => b - a);
  const per = seasons.map(s => ({ s, st: vetoStats(all.filter(x => x.season === s)) }));
  const rated = per.filter(p => p.st.rounds);
  const lo = rated.reduce((a, b) => pctOf(b.st.used, b.st.rounds) < pctOf(a.st.used, a.st.rounds) ? b : a);
  const hi = rated.reduce((a, b) => pctOf(b.st.used, b.st.rounds) > pctOf(a.st.used, a.st.rounds) ? b : a);
  const lede = `Across ${seasonsText(all)} the veto was used in ${t.used} of ${t.rounds} rounds (${pctOf(t.used, t.rounds)}%), `
    + `from ${lo.st.used} of ${lo.st.rounds} in BB${lo.s} to ${hi.st.used} of ${hi.st.rounds} in BB${hi.s}. `
    + `A nominee won it ${pctOf(t.byNominee, t.rounds)}% of the time and the HOH ${pctOf(t.byHoh, t.rounds)}%. `
    + `When it was used, the replacement nominee went home ${pctOf(t.replaced, t.used)}% of the time: ${t.replaced}, ${t.backdoor} of them ${t.backdoor === 1 ? "a backdoor" : "backdoors"}.`
    + mostInSeason(t.top);
  const rows = per.map(({ s, st }) => {
    const best = st.top[0];
    return `<tr><td class="l"><a class="plink" href="#veto=${s}">BB${s}</a></td><td>${st.rounds}</td><td>${st.block || "–"}</td>`
      + `<td class="l">${stackBar(vetoParts(st), `BB${s}: what the veto did`)}</td><td>${pctCell(st.used, st.rounds)}</td>`
      + `<td>${pctCell(st.byHoh, st.rounds)}</td><td>${pctCell(st.byNominee, st.rounds)}</td><td>${pctCell(st.byOther, st.rounds)}</td>`
      + `<td>${pctCell(st.replaced, st.used)}</td>`
      + `<td class="l">${best ? `<div class="pl">${faceHtml(s, best.name)}<span>${plink(s, best.name)} <span class="muted">×${best.n}</span></span></div>` : ""}</td></tr>`;
  }).join("");
  const foot = `<tr><td class="l"><strong>All</strong></td><td>${t.rounds}</td><td></td><td class="l">${stackBar(vetoParts(t), "Every veto")}</td>`
    + `<td>${pctCell(t.used, t.rounds)}</td><td>${pctCell(t.byHoh, t.rounds)}</td><td>${pctCell(t.byNominee, t.rounds)}</td><td>${pctCell(t.byOther, t.rounds)}</td>`
    + `<td>${pctCell(t.replaced, t.used)}</td><td></td></tr>`;
  const weeks = byWeekNumber(all.filter(x => x.hasVeto)).map(({ week, xs }) => ({ week, xs, parts: vetoParts(vetoStats(xs)) }));
  const key = keyHtml(VETO_OUT.map(([, l, c]) => [l, c]));
  return `<p class="lede">${lede}</p>`
    + `<div class="stats">${statTile(`${pctOf(t.used, t.rounds)}%`, "Vetoes used", `${t.used} of ${t.rounds}`)}`
    + statTile(`${pctOf(t.byNominee, t.rounds)}%`, "Won by a nominee", `${t.self} saved themselves`)
    + statTile(`${pctOf(t.byHoh, t.rounds)}%`, "Won by the HOH", `${t.byHoh} of ${t.rounds}`)
    + statTile(`${pctOf(t.replaced, t.used)}%`, "Replacement went home", `${t.replaced} of ${t.used} used vetoes · ${plural(t.backdoor, "backdoor")}`) + `</div>`
    + `<h2>Season by season</h2><p class="note">One row per season. “On the block” is how many were nominated before the veto: seasons with a third nominee (and a twist that saves one) give the veto more to do.</p>`
    + key
    + `<div class="scroll"><table class="players"><thead><tr><th scope="col" class="l">Season</th><th scope="col">Vetoes</th><th scope="col"><abbr title="Nominees before the veto, most weeks">On the block</abbr></th>`
    + `<th scope="col" class="l">What it did</th><th scope="col">Used</th><th scope="col"><abbr title="Won by the HOH">By HOH</abbr></th><th scope="col"><abbr title="Won by one of the nominees">By a nominee</abbr></th>`
    + `<th scope="col"><abbr title="Won by someone neither HOH nor nominated">By anyone else</abbr></th><th scope="col"><abbr title="Of the used vetoes: the replacement nominee was evicted">Replacement went home</abbr></th>`
    + `<th scope="col" class="l">Most by one</th></tr></thead><tbody>${rows}${foot}</tbody></table></div>`
    + `<h2>Week by week</h2><p class="note">Every veto winner, colored by what they did with it. Hover for the details; click for the week.</p>`
    + key + trendBoard("veto", all)
    + `<h2>By week of the season</h2><p class="note">What the veto did in each week, all seasons together. The number on top is the share used.</p>`
    + key + weekChart(weeks, g => `${pctOf(g.xs.filter(x => x.v.used).length, g.xs.length)}%`)
    + trendLeaders("Most vetoes in a season", t.top, "veto", "vetoes", true)
    + `<p class="src">From Wikipedia’s voting tables: the veto’s use is read from the nominations before and after it. Competition names and types from the Big Brother Wiki.</p>`;
}

function vetoSeasonHtml(all, season) {
  const mine = all.filter(x => x.season === season);
  const st = vetoStats(mine), t = vetoStats(all);
  const vs = (tn, td) => td ? `all seasons: ${pctOf(tn, td)}%` : "";
  const lede = `In BB${season} the veto was used ${st.used} of ${st.rounds} times: `
    + `${plural(st.self, "nominee saved themselves", "nominees saved themselves")}, ${st.other} went to someone else and ${st.kept} ${st.kept === 1 ? "wasn’t" : "weren’t"} used.`
    + (st.used ? ` The replacement nominee went home ${st.replaced} of ${st.used} times${st.backdoor ? `, ${st.backdoor} of them ${st.backdoor === 1 ? "a backdoor" : "backdoors"}` : ""}.` : "");
  const roleTag = r => r === "hg" ? "" : `<span class="tag">${r === "hoh" ? "HOH" : "Nominee"}</span>`;
  const rows = mine.filter(x => x.hasVeto).map(x => {
    const c = x.vetoComp;
    return `<tr><td class="l"><a class="plink" href="${weekHash(season, x.label)}">${esc(x.key)}</a></td>`
      + `<td class="l">${x.r.veto_winners.map((n, i) => `<div class="pl">${faceHtml(season, n)}${plink(season, n)}${roleTag(x.vetoRoles[i])}</div>`).join("")}</td>`
      + `<td class="l">${c ? `“${esc(c.name)}”${c.format ? ` <span class="muted">(<a class="plink" href="${compHash(c.format)}">${esc(c.format)}</a>)</span>` : ""}${catTag(c)}` : `<span class="zero">–</span>`}</td>`
      + `<td class="l wrap">${swatch(outColor[x.vetoOutcome])}${vetoSentence(x)}${x.vetoDecided ? ` <span class="tag">Cast the sole vote</span>` : ""}</td>`
      + `<td class="l">${x.r.evicted ? `${plink(season, x.r.evicted)}${x.replaced ? ` <span class="tag">${x.backdoor ? "Backdoor" : "Replacement"}</span>` : ""}` : `<span class="zero">–</span>`}</td></tr>`;
  }).join("");
  return `<p class="lede">${lede}</p>`
    + `<div class="stats">${statTile(st.rounds ? `${pctOf(st.used, st.rounds)}%` : "–", "Vetoes used", vs(t.used, t.rounds))}`
    + statTile(st.rounds ? `${pctOf(st.byNominee, st.rounds)}%` : "–", "Won by a nominee", vs(t.byNominee, t.rounds))
    + statTile(st.rounds ? `${pctOf(st.byHoh, st.rounds)}%` : "–", "Won by the HOH", vs(t.byHoh, t.rounds))
    + statTile(st.used ? `${pctOf(st.replaced, st.used)}%` : "–", "Replacement went home", vs(t.replaced, t.used)) + `</div>`
    + trendLeaders(`Most vetoes in BB${season}`, st.top, "veto", "vetoes", false)
    + `<h2>Every veto</h2>` + keyHtml(VETO_OUT.map(([, l, c]) => [l, c]))
    + `<div class="scroll"><table class="players"><thead><tr><th scope="col" class="l">Week</th><th scope="col" class="l">Won by</th><th scope="col" class="l">Competition</th>`
    + `<th scope="col" class="l">What they did</th><th scope="col" class="l">Went home</th></tr></thead><tbody>${rows}</tbody></table></div>`
    + `<p class="src">“Replacement”: the houseguest named after the veto came off someone else went home. “Backdoor”: that replacement hadn’t played in the veto. Who played comes from the episode summaries, so some weeks can’t be told apart. <a class="plink" href="#veto=all">Compare every season ›</a></p>`;
}

// Hover or focus on anything with data-tip shows it in the grid's tooltip.
function wireTrendTips(panel) {
  const tip = $("tip");
  const show = (el, x, y) => {
    tip.innerHTML = el.dataset.tip;
    tip.style.display = "block";
    const r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    let left = x != null ? x + 12 : Math.min(Math.max(8, r.left), innerWidth - tw - 8);
    let top = y != null ? y + 12 : r.bottom + 6;
    if (left + tw > innerWidth - 8) left = Math.max(8, (x ?? r.right) - tw - 12);
    if (top + th > innerHeight - 8) top = Math.max(8, (y != null ? y : r.top) - th - 12);
    tip.style.left = left + "px"; tip.style.top = top + "px";
  };
  const hide = () => { tip.style.display = "none"; };
  panel.addEventListener("mousemove", e => {
    const el = e.target.closest("[data-tip]");
    el && $("drawer").hidden ? show(el, e.clientX, e.clientY) : hide();
  });
  panel.addEventListener("mouseleave", hide);
  panel.addEventListener("focusin", e => { const el = e.target.closest("[data-tip]"); if (el && $("drawer").hidden) show(el); });
  panel.addEventListener("focusout", hide);
  panel.addEventListener("click", hide);
}

// ---------- Endgame: the last few rounds, where one veto or one vote can decide the game ----------

const ENDGAME_STARTS = [6, 5, 4];
const ENDGAME_DEFAULT = 5;
let endgameStart = ENDGAME_DEFAULT;
const endgameHash = (season, start = endgameStart) => `#endgame=${season}${start !== ENDGAME_DEFAULT ? `/${start}` : ""}`;
const ordinal = n => `${n}${n % 100 >= 11 && n % 100 <= 13 ? "th" : ["th", "st", "nd", "rd"][n % 10] || "th"}`;
const placeText = n => n === 1 ? "Winner" : n === 2 ? "Runner-up" : `${ordinal(n)} place`;
// A finish in the endgame (1 the winner, 2 the runner-up, 3+ evicted, none still in)
// as a face's ring and a label.
const placeState = pl => pl === 1 ? "won" : pl === 2 ? "" : pl ? "out" : "live";
const placeLabel = pl => pl ? placeText(pl) : "Still in";
// "A", "A and B", "A, B and C", as player links.
const andList = (season, names) => {
  const xs = names.map(n => plink(season, n));
  return xs.length < 2 ? xs.join("") : `${xs.slice(0, -1).join(", ")} and ${xs[xs.length - 1]}`;
};

// A season's eviction rounds in order, each with how many houseguests were in the
// house for it. That's counted back from who's left: each later eviction adds one,
// as does a walk or expulsion on a later day. Also who decided each eviction:
// the sole voter, the HOH breaking a tie, or the voters in the majority.
function seasonRounds(season, d) {
  const people = seasonPlayers(d, season);
  const byName = new Map(people.map(p => [p.name, p]));
  const f = (d.finales || {})[season];
  const left = f && f.decided ? f.finalists.map(x => x.name) : people.filter(p => !p.result).map(p => p.name);
  const dayOf = p => { const m = p && p.result && p.result.match(/Day (\d+)/); return m ? +m[1] : null; };
  const rounds = [];
  for (const [key, label, i] of roundKeys(season)) {
    const r = weekRecord(season, label).rounds[i];
    if (!r || !r.evicted) continue;
    const wd = weekDetail(d, season, label) || null;
    const v = ((wd || {}).rounds || [])[i] || null;
    const votes = v ? v.votes : [];
    let how = null, deciders = [];
    if (r.tally && r.tally.type === "sole_vote") { how = "sole"; deciders = [r.tally.by]; }
    else if (votes.some(x => r.hoh.includes(x.voter))) { how = "tie"; deciders = votes.filter(x => r.hoh.includes(x.voter)).map(x => x.voter); }
    else if (votes.length) { how = "vote"; deciders = votes.filter(x => x.vote === r.evicted).map(x => x.voter); }
    rounds.push({ key, label, i, r, wd, v, votes, how, deciders, use: v && v.veto ? v.veto : vetoUse(r),
                  day: dayOf(byName.get(r.evicted)) });
  }
  const gone = new Set(rounds.map(x => x.r.evicted));
  const walked = people.filter(p => p.result && !gone.has(p.name) && !left.includes(p.name)).map(dayOf).filter(n => n != null);
  rounds.forEach((x, j) => {
    x.size = left.length + rounds.length - j + (x.day != null ? walked.filter(n => n > x.day).length : 0);
  });
  return { rounds, left, finale: f, people: byName };
}

// The rule that shaped a round, from how many were left and how many could vote.
function stageRule(x) {
  const voters = x.size - x.r.hoh.length - x.r.nominees_final.length;
  if (x.size === 3) return "No nominations and no veto: whoever wins the three-part final HOH evicts one of the other two and picks their partner for the final two.";
  if (x.size === 4) return "One vote: after the veto meeting, the only houseguest who’s neither HOH nor nominated evicts alone. Win the veto and that’s usually you.";
  if (voters === 2) return "Two votes, so a split hands the eviction to the HOH.";
  return `${plural(voters, "vote")}; the HOH breaks a tie.`;
}

// " in “Name”": the round's HOH or veto competition, if either source names it.
function compIn(x, kind) {
  const c = x.wd ? roundComp(x.wd, x.i + 1, kind) : null;
  return c && c.name ? ` in “${esc(c.name)}”` : "";
}

// One round in a few sentences.
function roundStory(season, x, parts) {
  const { r, use } = x;
  const L = names => andList(season, names);
  const out = [];
  if (x.size === 3) {
    const won = parts.filter(c => c.winners.length);
    out.push(`${L(r.hoh)} won the final HOH` + (won.length ? ` (${won.map(c => `${esc(c.part)}: ${L(c.winners)}`).join(", ")})` : "") + ".");
    const kept = r.nominees_final.filter(n => n !== r.evicted);
    out.push(`${L(r.hoh)} evicted ${plink(season, r.evicted)}` + (kept.length ? ` and took ${L(kept)} to the final two.` : "."));
    return out.join(" ");
  }
  if (r.hoh.length) out.push(`${L(r.hoh)} won HOH${compIn(x, "hoh")}` + (r.nominees_initial.length ? ` and nominated ${L(r.nominees_initial)}.` : "."));
  for (const [label, names] of Object.entries(r.extras || {})) if (names.length) out.push(`${L(names)} won the ${esc(extraLabel(label))}.`);
  if (r.veto_winners.length) {
    let s = `${L(r.veto_winners)} won the veto${compIn(x, "veto")}`;
    if (use && use.used) {
      const self = use.on.length === 1 && r.veto_winners.includes(use.on[0]);
      s += self ? " and used it on themselves" : ` and used it on ${L(use.on)}`;
      if (use.replacements.length) s += `; ${L(use.replacements)} went up in their place`;
    } else if (use) s += " and left the nominations as they were";
    out.push(s + ".");
  }
  const against = x.votes.filter(v => v.vote !== x.r.evicted);
  if (x.how === "sole") {
    out.push(`${plink(season, x.deciders[0])} cast the only vote and evicted ${plink(season, r.evicted)}.`);
  } else if (x.how === "tie") {
    const n = (x.votes.length - 1) / 2;
    out.push(`The vote tied ${n}–${n}, and ${L(x.deciders)} broke it by evicting ${plink(season, r.evicted)}.`);
  } else if (x.how === "vote") {
    out.push(`${plink(season, r.evicted)} was evicted ${x.deciders.length}–${against.length}`
      + (x.deciders.length ? `, by ${L(x.deciders)}` : "")
      + (against.length ? `; ${L(against.map(v => v.voter))} voted to evict ${L([...new Set(against.map(v => v.vote))])}` : "") + ".");
  } else {
    out.push(`${plink(season, r.evicted)} was evicted${r.tally ? ` (${esc(tallyText(r.tally))})` : ""}.`);
  }
  return out.join(" ");
}

// What someone did in a round, as small tags. HOH and the veto are icons (a key,
// a medal), explained by the legend above the table.
function roleTags(season, x, name, parts) {
  const { r, use } = x;
  const tags = [];
  const t = (cls, text) => tags.push(`<span class="t ${cls}">${esc(text)}</span>`);
  const power = (kind, text = "") => tags.push(`<span class="t ${kind}${text ? "" : " icon-only"}" title="${POWER[kind].label}">`
    + `${iconHtml(kind)}${text ? ` ${esc(text)}` : ""}<span class="sr">${POWER[kind].label}</span></span>`);
  if (x.size === 3) {
    parts.filter(c => c.winners.includes(name)).forEach(c => t("", `Won ${c.part}`));
    if (r.hoh.includes(name)) power("hoh", "Final");
  } else {
    if (r.hoh.includes(name)) power("hoh");
    for (const [label, names] of Object.entries(r.extras || {})) if (names.includes(name)) t("", extraLabel(label));
    if (r.veto_winners.includes(name)) power("veto");
    if (r.nominees_initial.includes(name)) t("nom", "Nominated");
    if (use && use.used && use.on.includes(name)) t("", r.veto_winners.includes(name) ? "Saved self" : "Vetoed off");
    if (use && use.replacements.includes(name)) t("nom", "Renominated");
  }
  if (r.evicted === name) t("out", "Evicted");
  else if (x.deciders.includes(name)) t("dec", x.how === "sole" || x.size === 3 ? "Sole vote" : x.how === "tie" ? "Tie-break" : "Deciding vote");
  else if (x.votes.some(v => v.voter === name)) t("", `Voted ${x.votes.find(v => v.voter === name).vote}`);
  if (x.size === 3 && r.nominees_final.includes(name) && r.evicted !== name) t("", "Taken to final 2");
  return tags.join("") || `<span class="zero">Safe</span>`;
}

async function showEndgame(season, start) {
  endgameStart = start;
  $("endgame-start-pick").innerHTML = ENDGAME_STARTS.map(n =>
    `<button aria-pressed="${n === start}" data-start="${n}">From final ${n}</button>`).join("");
  const d = await openView("endgame", season, "Loading the endgame…");
  if (!d || endgameStart !== start) return;
  const panel = $("endgame-panel");
  const S = seasonRounds(season, d);
  const f = S.finale, decided = !!(f && f.decided);
  const eg = S.rounds.filter(x => x.size <= start);
  if (!eg.length) {
    panel.innerHTML = `<div class="msg">BB${season} hasn’t reached the final ${start} yet.</div>`;
    return;
  }
  const parts = finalParts(d, f);
  // Everyone in the house when the endgame began, best finish first.
  const place = new Map();
  if (decided) { place.set(f.winner, 1); place.set(f.runner_up, 2); }
  eg.forEach(x => place.set(x.r.evicted, x.size));
  const cast = [...S.left, ...eg.map(x => x.r.evicted).reverse()]
    .sort((a, b) => (place.get(a) || 0) - (place.get(b) || 0));
  const ctx = { season, d, S, f, decided, eg, parts, place, cast, start };

  panel.innerHTML = `<div class="view-body fin eg">`
    + endgameCastHtml(ctx)
    + endgameNotesHtml(ctx)
    + `<h2>Round by round</h2><div class="eg-rounds">${eg.map(x => endgameRoundHtml(ctx, x)).join("")}</div>`
    + endgameLaterHtml(ctx)
    + powerGridHtml(ctx)
    + endgameTableHtml(ctx)
    + acrossSeasonsHtml(ctx)
    + `<p class="src">Rounds and votes from Wikipedia’s voting table; competition names and the final HOH’s parts from the Big Brother Wiki.`
    + (decided ? ` <a href="#finale=${season}">The jury vote is on the Finale tab ›</a>` : "") + `</p>`
    + `</div>`;
}

function endgameCastHtml({ season, S, cast, place, start, eg }) {
  const first = eg[0];
  const cards = cast.map(n => {
    const pl = place.get(n);
    return `<div class="fin-card${pl === 1 ? " win" : ""}">${faceHtml(season, n, placeState(pl), portraitOf(S.people.get(n)))}${plink(season, n)}`
      + roleHtml(placeLabel(pl)) + `</div>`;
  }).join("");
  return `<div class="eg-cast">${cards}</div>`
    + `<p class="fin-lede">From the final ${first.size}, ${plural(eg.length, "eviction")}${S.finale && S.finale.decided ? " and the jury vote decided the game" : " so far"}.</p>`;
}

// Endgame comp wins for one player: HOH, veto and final HOH parts. The final HOH
// counts as one win when the Big Brother Wiki doesn't list its parts.
function endgameWins(ctx, name) {
  const hoh = ctx.eg.filter(x => x.size > 3 && x.r.hoh.includes(name)).length;
  const veto = ctx.eg.filter(x => x.r.veto_winners.includes(name)).length;
  const f3 = ctx.eg.find(x => x.size === 3);
  const listed = f3 ? ctx.parts.filter(c => c.winners.length) : [];
  const parts = listed.filter(c => c.winners.includes(name)).length;
  const finalHoh = f3 && f3.r.hoh.includes(name) ? 1 : 0;
  return { hoh, veto, parts, finalHoh, total: hoh + veto + (listed.length ? parts : finalHoh) };
}

// How many HOH, veto and final HOH part competitions the endgame had.
function endgameComps(ctx) {
  return ctx.eg.reduce((n, x) => n + (x.size === 3 ? Math.max(ctx.parts.filter(c => c.winners.length).length, 1)
    : x.r.hoh.length + x.r.veto_winners.length), 0);
}

// Of these houseguests, whoever had the most HOH and veto wins all season (all of
// them on a tie) and that many wins.
function compLeaders(d, season, names) {
  const wins = names.map(n => { const p = findPlayer(d, season, n); return { n, wins: p ? p.hoh.length + p.veto.length : 0 }; });
  const best = Math.max(0, ...wins.map(x => x.wins));
  return { names: wins.filter(x => x.wins === best).map(x => x.n), wins: best };
}

function endgameNotesHtml(ctx) {
  const { season, S, f, decided, eg, cast, place } = ctx;
  const L = names => andList(season, names);
  const notes = [];
  const f4 = eg.find(x => x.size === 4), f3 = eg.find(x => x.size === 3);
  const comps = endgameComps(ctx);
  if (decided) {
    const w = endgameWins(ctx, f.winner);
    const noms = eg.filter(x => x.r.nominees_final.includes(f.winner) && x.size > 3).length;
    notes.push(`${plink(season, f.winner)} won ${w.total} of the endgame’s ${comps} competitions`
      + (noms ? ` and sat on the block at ${plural(noms, "eviction")}.` : " and was never on the block at an eviction."));
  }
  if (f4 && f4.how === "sole") {
    const voter = f4.deciders[0], out = plink(season, f4.r.evicted);
    const hohVeto = f4.r.veto_winners.filter(n => f4.r.hoh.includes(n));
    notes.push(`At the final four, `
      + (f4.r.veto_winners.includes(voter) ? `${plink(season, voter)} won the veto and cast the only vote, evicting ${out}.`
        : hohVeto.length ? `${L(hohVeto)} won both HOH and the veto, which left ${plink(season, voter)} to cast the only vote, evicting ${out}.`
        : `${plink(season, voter)} cast the only vote, evicting ${out}.`)
      + (decided ? (f.finalists.some(x => x.name === voter) ? ` ${plink(season, voter)} made the final two.` : ` ${plink(season, voter)} still didn’t make the final two.`) : ""));
  }
  if (f3) {
    const h = f3.r.hoh[0], took = f3.r.nominees_final.filter(n => n !== f3.r.evicted);
    let s = `${plink(season, h)} won the final HOH and took ${L(took)} over ${plink(season, f3.r.evicted)}`;
    if (decided) {
      const me = f.finalists.find(x => x.name === h), them = f.finalists.find(x => x.name !== h);
      if (me && them) s += me.name === f.winner ? `, then won the jury vote ${me.votes}–${them.votes}.` : `, then lost the jury vote ${me.votes}–${them.votes}.`;
      else s += ".";
    } else s += ".";
    notes.push(s);
  }
  // The season's comp leader, to set the endgame against the whole game.
  const lead = compLeaders(ctx.d, season, cast);
  if (lead.wins) {
    const top = lead.names;
    const pl = top.length === 1 ? place.get(top[0]) : null;
    notes.push(`Over the whole season, ${L(top)} had the most HOH and veto wins of the final ${eg[0].size} (${lead.wins})`
      + (pl ? ` and finished ${pl === 1 ? "as the winner" : pl === 2 ? "as runner-up" : ordinal(pl)}.` : "."));
  }
  // Who decided the most evictions.
  const count = new Map();
  eg.forEach(x => x.deciders.forEach(n => count.set(n, (count.get(n) || 0) + 1 / x.deciders.length)));
  const [who] = [...count.entries()].sort((a, b) => b[1] - a[1])[0] || [];
  if (who && eg.length > 1) {
    const alone = eg.filter(x => x.deciders.length === 1 && x.deciders[0] === who).length;
    if (alone > 1) notes.push(`${plink(season, who)} decided ${alone} of the ${eg.length} evictions alone.`);
  }
  if (!decided && S.left.length) notes.push(`${L(S.left)} ${S.left.length > 1 ? "are" : "is"} still in the game.`);
  return notes.length ? `<h2>What decided it</h2><ul class="eg-notes">${notes.map(x => `<li>${x}</li>`).join("")}</ul>` : "";
}

function endgameRoundHtml(ctx, x) {
  const { season } = ctx;
  const who = x.deciders.length && x.how
    ? `<div class="decider">Decided by ${x.deciders.map(n => `${faceHtml(season, n)}${plink(season, n)}`).join(" ")}`
      + ` <span class="muted">· ${x.how === "sole" ? "sole vote" : x.how === "tie" ? "tie-break" : "the majority"}</span></div>`
    : "";
  return `<article class="eg-round"><h3><span class="size">Final ${x.size}</span>`
    + `<span>${x.size === 3 ? "The final HOH" : `${plink(season, x.r.evicted)} evicted`}</span>`
    + `<a class="plink wk" href="${weekHash(season, x.label)}">${esc(x.key)}${x.day != null && !/Day/.test(x.key) ? ` · Day ${x.day}` : ""}</a></h3>`
    + `<p class="rule">${esc(stageRule(x))}</p>`
    + `<p class="story">${roundStory(season, x, ctx.parts)}</p>${who}</article>`;
}

// A season still airing: a round in the table that isn't modeled yet.
function endgameLaterHtml({ season, decided, eg }) {
  if (decided) return "";
  const last = eg[eg.length - 1];
  const weeks = DATA.weeks.filter(w => w.season === season);
  const at = weeks.findIndex(w => w.week_label === last.label);
  const next = weeks.slice(at).find(w => w.status !== "ok" && w.raw);
  return `<p class="muted mt-3">`
    + (next ? `Later rounds aren’t fully modeled yet: see <a class="plink" href="${weekHash(season, next.week_label)}">${esc(next.week_label)}</a>.`
      : `Later rounds aren’t in the table yet.`) + `</p>`;
}

// Who did what, round by round: one row per houseguest, one column per round.
function powerGridHtml(ctx) {
  const { season, eg, cast, place, decided, f, parts } = ctx;
  const head = eg.map(x => `<th scope="col">Final ${x.size}<small>${esc(x.key)}</small></th>`).join("")
    + (decided ? `<th scope="col">Jury vote<small>${esc(f.week)}</small></th>` : "");
  const rows = cast.map(n => {
    const pl = place.get(n);
    const cells = eg.map(x => x.size < (pl || 0) ? `<td class="gone"></td>` : `<td>${roleTags(season, x, n, parts)}</td>`).join("");
    let jury = "";
    if (decided) {
      const me = f.finalists.find(x => x.name === n), j = f.jury.find(x => x.name === n);
      jury = me ? `<td><span class="t ${me.name === f.winner ? "won" : ""}">${me.name === f.winner ? "Won" : "Lost"} ${me.votes}–${f.finalists.find(x => x.name !== n).votes}</span></td>`
        : `<td>${j && j.vote ? `<span class="t">Voted ${esc(j.vote)}</span>` : ZERO}</td>`;
    }
    return `<tr><td><div class="pl">${faceHtml(season, n, placeState(pl))}<span>${plink(season, n)}<small>${esc(placeLabel(pl))}</small></span></div></td>${cells}${jury}</tr>`;
  }).join("");
  return `<h2>Who held the power</h2>`
    + `<div class="t-legend"><span><span class="t hoh icon-only">${iconHtml("hoh")}</span> Head of Household</span><span><span class="t veto icon-only">${iconHtml("veto")}</span> won the veto</span>`
    + `<span><span class="t nom">Nominated</span> on the block</span><span><span class="t dec">Sole vote</span> decided the eviction</span><span><span class="t out">Evicted</span></span></div>`
    + `<div class="scroll"><table class="players power"><thead><tr><th scope="col">Houseguest</th>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

// Endgame numbers per houseguest, against their numbers before it.
function endgameTableHtml(ctx) {
  const { season, d, eg, cast, place } = ctx;
  const keys = new Set(eg.map(x => x.key));
  const hasParts = eg.some(x => x.size === 3) && ctx.parts.length;
  const rows = cast.map(n => {
    const p = findPlayer(d, season, n) || { hoh: [], veto: [] };
    const w = endgameWins(ctx, n);
    const before = { hoh: p.hoh.filter(k => !keys.has(k)).length, veto: p.veto.filter(k => !keys.has(k)).length };
    const block = eg.filter(x => x.size > 3 && x.r.nominees_final.includes(n)).length;
    const decided = eg.filter(x => x.deciders.includes(n)).length;
    const alone = eg.filter(x => x.deciders.length === 1 && x.deciders[0] === n).length;
    const pl = place.get(n);
    return `<tr><td><div class="pl">${faceHtml(season, n, placeState(pl))}<span>${plink(season, n)}</span></div></td>`
      + `<td class="result">${esc(placeLabel(pl))}</td>`
      + `<td class="gs">${num(before.hoh)}</td><td>${num(before.veto)}</td>`
      + `<td class="gs">${num(w.hoh + w.finalHoh)}</td><td>${num(w.veto)}</td>${hasParts ? `<td>${num(w.parts)}</td>` : ""}`
      + `<td class="gs">${num(block)}</td><td>${num(decided)}</td><td>${num(alone)}</td></tr>`;
  }).join("");
  return `<h2>Before the endgame and in it</h2><div class="scroll"><table class="players"><thead>`
    + `<tr class="grp"><th colspan="2"></th><th colspan="2" class="gs">Before</th><th colspan="${hasParts ? 3 : 2}" class="gs">Endgame comps</th><th colspan="3" class="gs">Endgame evictions</th></tr><tr>`
    + `<th scope="col">Houseguest</th><th scope="col" class="l">Finish</th>`
    + thIcon("hoh", "HOH wins before the endgame", "gs") + thIcon("veto", "Veto wins before the endgame")
    + thIcon("hoh", "HOH wins in the endgame, including the final HOH", "gs") + thIcon("veto", "Veto wins in the endgame") + (hasParts ? `<th scope="col"><abbr title="Parts of the three-part final HOH won">${iconHtml("hoh")} Final parts<span class="sr"> of the final HOH</span></abbr></th>` : "")
    + th("On the block", "Nominated at the eviction (not counting the final three)", "gs") + th("Had a say", "Evictions they voted with the majority on, broke a tie on or cast the sole vote for")
    + th("Alone", "Evictions they decided alone: a sole vote, a tie-break or the final HOH")
    + `</tr></thead><tbody>${rows}</tbody></table></div>`;
}

// Every finished season's endgame side by side, and how often the big powers paid off.
function acrossSeasonsHtml(ctx) {
  const { d, season: here, start } = ctx;
  const rows = [];
  for (const s of seasonList()) {
    const S = seasonRounds(s, d);
    if (!S.finale || !S.finale.decided) continue;
    const eg = S.rounds.filter(x => x.size <= start);
    const f4 = eg.find(x => x.size === 4), f3 = eg.find(x => x.size === 3);
    if (!f3) continue;
    const f = S.finale;
    const c = { season: s, d, eg, parts: finalParts(d, f) };
    const w = endgameWins(c, f.winner);
    const pool = [...S.left, ...eg.map(x => x.r.evicted)];
    const leaders = compLeaders(d, s, pool).names;
    const egBest = Math.max(...pool.map(n => endgameWins(c, n).total));
    rows.push({
      s, f, w, f4, f3,
      f4voter: f4 && f4.how === "sole" ? f4.deciders[0] : null,
      winnerNoms: eg.filter(x => x.size > 3 && x.r.nominees_final.includes(f.winner)).length,
      leaders, egTop: w.total === egBest,
    });
  }
  if (rows.length < 2) return "";
  const n = rows.length;
  const count = fn => rows.filter(fn).length;
  const tile = (k, text) => `<div class="stat"><b>${k}<small> of ${n}</small></b><span>${text}</span></div>`;
  const fin = r => r.f.finalists.map(x => x.name);
  const tiles = tile(count(r => r.f3.r.hoh[0] === r.f.winner), "final HOH winners went on to win the game")
    + tile(count(r => r.f4voter && fin(r).includes(r.f4voter)), "final-four evictors (the lone vote) made the final two")
    + tile(count(r => !r.winnerNoms), `winners were never on the block from the final ${start}`)
    + tile(count(r => r.egTop), `winners had the most endgame comp wins (or tied)`)
    + tile(count(r => r.leaders.length === 1 && r.leaders[0] === r.f.winner), `winners were their final ${start}’s season-long comp leader`);
  const L = (s, names) => andList(s, names);
  const body = rows.map(r => {
    const mine = r.s === here;
    const other = fin(r).find(x => x !== r.f.winner);
    const wv = r.f.finalists.find(x => x.name === r.f.winner).votes, lv = r.f.finalists.find(x => x.name === other).votes;
    return `<tr${mine ? ` class="here"` : ""}><td><a class="plink" href="${endgameHash(r.s)}">BB${r.s}</a></td>`
      + `<td>${plink(r.s, r.f.winner)} <span class="muted">${wv}–${lv} over</span> ${plink(r.s, other)}</td>`
      + `<td>${r.w.total} <span class="muted">(${[r.w.hoh && plural(r.w.hoh, "HOH"), r.w.veto && plural(r.w.veto, "veto", "vetoes"),
          r.w.parts && plural(r.w.parts, "final HOH part"), r.w.total > r.w.hoh + r.w.veto + r.w.parts && "the final HOH"].filter(Boolean).join(", ") || "none"})</span></td>`
      + `<td>${r.winnerNoms || `<span class="zero">0</span>`}</td>`
      + `<td>${r.f4 ? `${L(r.s, r.f4.r.veto_winners)}${r.f4voter && !r.f4.r.veto_winners.includes(r.f4voter) ? ` <span class="muted">(${plink(r.s, r.f4voter)} voted)</span>` : ""} <span class="muted">out:</span> ${plink(r.s, r.f4.r.evicted)}` : ZERO}</td>`
      + `<td>${plink(r.s, r.f3.r.hoh[0])} <span class="muted">out:</span> ${plink(r.s, r.f3.r.evicted)}</td>`
      + `<td>${L(r.s, r.leaders)}</td></tr>`;
  }).join("");
  return `<h2>Every season’s endgame</h2><div class="eg-tiles stats">${tiles}</div>`
    + `<div class="scroll"><table class="players across"><thead><tr><th scope="col">Season</th><th scope="col">Result</th>`
    + `<th scope="col"><abbr title="HOH, veto and final HOH part wins from the final ${start}">Winner’s endgame wins</abbr></th>`
    + `<th scope="col"><abbr title="Times the winner was nominated at an eviction from the final ${start}">Winner on the block</abbr></th>`
    + `<th scope="col">Final 4 veto</th><th scope="col">Final HOH</th>`
    + `<th scope="col"><abbr title="Most HOH and veto wins all season among the final ${start}">Season’s comp leader</abbr></th>`
    + `</tr></thead><tbody>${body}</tbody></table></div>`;
}


// ---------- America’s Favorite HouseGuest: the viewers’ vote, every season ----------

// "Won", "Top 3" or "Runner-up" for a houseguest in their season's vote, else null.
function afhPlace(d, p) {
  const a = ((d || {}).afh || {})[p.season];
  if (!a) return null;
  if (a.winner === p.name) return `Won${a.prize ? ` (${a.prize})` : ""}`;
  return a.others.includes(p.name) ? (a.others_label === "Top 3" ? "Top 3" : "Runner-up in the vote") : null;
}
function afhTagHtml(d, p) {
  const place = afhPlace(d, p);
  if (!place) return "";
  const won = place.startsWith("Won");
  return ` <span class="tag${won ? " afh" : ""}" title="America’s Favorite HouseGuest${won ? "" : `: ${esc(place)}`}">${won ? "AFH" : `AFH ${esc(place.toLowerCase())}`}</span>`;
}

// Where the favorite's game ended: won, runner-up, a juror, or out before the jury.
function afhStanding(d, season, name) {
  const p = findPlayer(d, season, name);
  const f = (d.finales || {})[season];
  const juror = f ? f.jury.findIndex(j => j.name === name) : -1;
  if (!p) return { text: "", jury: false };
  if (/^winner/i.test(p.result || "")) return { text: "Also won the season", kind: "winner" };
  if (/^runner/i.test(p.result || "")) return { text: "Runner-up in the jury vote", kind: "final" };
  if (juror >= 0) return { text: `${p.result || "Evicted"} · Juror ${juror + 1} of ${f.jury.length}`, kind: "juror" };
  return { text: `${p.result || "Evicted"} · before the jury`, kind: "pre" };
}

// Who else placed: the whole top three, or the vote's runner-up.
function afhOthersHtml(season, a) {
  if (!a.others.length) return "";
  const top = a.others_label === "Top 3";
  const names = (top ? [a.winner, ...a.others] : a.others).filter(Boolean);
  return `<p class="voters">${top ? "Top 3 in the vote" : "Runner-up in the vote"}: ${names.map(n => plink(season, n)).join(", ")}</p>`;
}

const afhNoteHtml = n => quoteHtml(n.text, `${n.where} · Wikipedia`);

function afhCardHtml(d, season, a) {
  const p = findPlayer(d, season, a.winner);
  const full = p ? playerBio(p).full_name : a.winner_text;
  const st = a.winner ? afhStanding(d, season, a.winner) : { text: "" };
  const name = a.winner ? plink(season, a.winner) : esc(a.winner_text);
  const face = a.winner ? faceHtml(season, a.winner, p ? faceState(p) : "", portraitOf(p)) : "";
  const others = afhOthersHtml(season, a);
  const notes = a.notes.map(afhNoteHtml).join("");
  return `<article class="afh-card won"><h2><a class="plink" href="#finale=${season}">BB${season}</a>${a.prize ? `<span class="n">${esc(a.prize)}</span>` : ""}</h2>`
    + `<div class="afh-who">${face}<span>${name}${full && full !== a.winner ? `<small>${esc(full)}</small>` : ""}${st.text ? `<small>${esc(st.text)}</small>` : ""}</span></div>`
    + others + notes + `</article>`;
}

// Patterns across the seasons: how far the favorites got.
function afhFactsHtml(d, seasons) {
  const st = seasons.map(s => afhStanding(d, s, d.afh[s].winner));
  const count = kind => st.filter(x => x.kind === kind).length;
  const bits = [
    plural(seasons.length, "season"),
    count("winner") && `${plural(count("winner"), "favorite")} also won the season`,
    count("final") && `${plural(count("final"), "favorite")} finished runner-up`,
    count("juror") && `${count("juror")} made the jury`,
    count("pre") && `${count("pre")} left before the jury`,
  ].filter(Boolean);
  const prizes = [...new Set(seasons.map(s => d.afh[s].prize).filter(Boolean).map(x => (x.match(/\$[\d,]+/) || [x])[0]))];
  return `<p class="season-info afh-facts">${esc(bits.join(" · "))}${prizes.length ? ` · prize ${esc(prizes.reverse().join(", then "))}` : ""}</p>`;
}

async function showAfh() {
