</main>
<div id="tip" role="tooltip"></div>
<div id="scrim" hidden></div>
<aside id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
  <div class="drawer-head">
    <div class="grow"><h2 id="drawer-title"></h2><div class="status" id="drawer-status"></div></div>
    <button id="drawer-close" aria-label="Close details">×</button>
  </div>
  <div id="drawer-body"></div>
</aside>
<script>
const params = new URLSearchParams(location.search);
if (params.has("embed")) document.documentElement.classList.add("embed");
// ?theme=dark or ?theme=light pins the look, e.g. to match a host page.
if (["dark", "light"].includes(params.get("theme"))) document.documentElement.dataset.theme = params.get("theme");
// ?simple=1 is the stream view: bigger, with less on screen (the Simple view button toggles it).
let simple = params.has("simple") && params.get("simple") !== "0";
document.documentElement.classList.toggle("simple", simple);
// ?seasons=26-28 (or 21,26 or 21-23,28) shows only those seasons, e.g. to keep an embed short.
function seasonFilter(text) {
  if (!text) return null;
  const want = new Set();
  for (const part of text.split(",")) {
    const m = part.trim().match(/^(\d+)(?:-(\d+))?$/);
    if (m) for (let n = +m[1]; n <= +(m[2] || m[1]); n++) want.add(n);
  }
  return want.size ? want : null;
}
function onlySeasons(data, want) {
  if (!want) return data;
  const keep = s => want.has(+s);
  return { ...data,
    weeks: data.weeks.filter(w => keep(w.season)),
    sources: (data.sources || []).filter(s => keep(s.season)),
    photos: Object.fromEntries(Object.entries(data.photos || {}).filter(([s]) => keep(s))) };
}

const FIELDS = [
  ["hoh", "HOH"],
  ["nominees_initial", "Noms"],
  ["veto_winners", "Veto"],
  ["nominees_final", "Final noms"],
];

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// "9–3": votes to evict against votes to keep.
function tallyText(t) {
  if (!t) return "";
  if (t.type === "vote") return `${t.votes_to_evict}–${t.votes_cast - t.votes_to_evict}`;
  if (t.type === "sole_vote") return `${t.by}’s choice to evict`;
  return "";
}

const nkey = s => String(s).replace(/\s+/g, " ").trim().toLowerCase();

// ---------- Houseguest photos: the Big Brother Wiki's headshots (weeks.json "photos") ----------

const initials = name => String(name).split(/\s+/).map(w => (w.match(/[A-Za-z]/) || [""])[0]).join("").slice(0, 2).toUpperCase();
// The wiki resizes on request: .../revision/latest/scale-to-width-down/80?cb=...
const sized = (url, w) => url.replace(/\/revision\/latest(?=\?|$)/, `/revision/latest/scale-to-width-down/${w}`);
const photoOf = (season, name) => (((DATA && DATA.photos) || {})[season] || {})[name] || null;

// How far to zoom a season's large portraits toward the head. Most seasons' are
// waist-up and need none; BB28's are full-length, so the face would be tiny.
const PORTRAIT_ZOOM = { 28: 2.1 };

// An <img> of a houseguest's headshot, or their initials when there's none. The
// name always sits next to it, so the picture itself is decorative (alt="").
// large: a bigger portrait to try first, falling back to the headshot.
function faceHtml(season, name, cls = "", large = null) {
  const small = photoOf(season, name);
  const ini = esc(initials(name));
  if (!small && !large) return `<span class="face ${cls}" aria-hidden="true">${ini}</span>`;
  const src = large ? sized(large, large && PORTRAIT_ZOOM[season] ? 480 : 240) : sized(small, 80);
  const fallback = large && small ? ` data-fallback="${esc(sized(small, 80))}"` : "";
  const img = cl => `<img class="${cl}" src="${esc(src)}"${fallback} alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" data-ini="${ini}">`;
  // A zoomed portrait is an <img> inside the .face box, which clips it.
  return large && PORTRAIT_ZOOM[season]
    ? `<span class="face zoom ${cls}" style="--zoom:${PORTRAIT_ZOOM[season]}" aria-hidden="true">${img("")}</span>`
    : img(`face ${cls}`);
}

// A picture that fails to load becomes the next one down, then initials.
document.addEventListener("error", e => {
  const img = e.target;
  if (!(img instanceof HTMLImageElement)) return;
  const box = img.classList.contains("face") ? img : img.closest(".face.zoom");
  if (!box) return;
  if (img.dataset.fallback) {
    // The headshot is already framed on the face, so it isn't zoomed.
    if (box !== img) box.style.setProperty("--zoom", 1);
    img.src = img.dataset.fallback; delete img.dataset.fallback; return;
  }
  const span = document.createElement("span");
  span.className = box.className.replace(/\bzoom\b/, "");
  span.setAttribute("aria-hidden", "true");
  span.textContent = img.dataset.ini || "";
  box.replaceWith(span);
}, true);

// Out of the game: grey. Still playing: an accent ring. The winner: a gold ring.
const faceState = p => !p.result ? "live" : /^winner/i.test(p.result) ? "won" : /^runner/i.test(p.result) ? "" : "out";

// What the veto did, from the nominations before and after it (like details.py's veto_use).
function vetoUse(r) {
  if (!r.veto_winners.length || !r.nominees_initial.length || !r.nominees_final.length) return null;
  const finals = new Set(r.nominees_final.map(nkey)), initial = new Set(r.nominees_initial.map(nkey));
  const twist = new Set(Object.values(r.extras || {}).flat().map(nkey));
  const removed = r.nominees_initial.filter(n => !finals.has(nkey(n)));
  const on = removed.filter(n => !twist.has(nkey(n)));
  return { used: on.length > 0, on, replacements: r.nominees_final.filter(n => !initial.has(nkey(n))) };
}

// Whether a houseguest played in the round's veto: true, false, or null when the
// sources don't name every player (details.json veto.players).
function vetoPlayed(v, name) {
  const pl = v && v.players;
  if (!pl || !name) return null;
  return pl.players.includes(name) ? true : pl.complete ? false : null;
}

// "used" or "not used"; the Veto section has the details.
function vetoBrief(r) {
  const u = vetoUse(r);
  return u ? (u.used ? "used" : "not used") : "";
}

// Twist row labels without Wikipedia's " winner": "Block Buster", "AI Arena".
const extraLabel = label => label.replace(/\s+winners?$/i, "");

function roundHtml(r, label) {
  const row = (name, names, extra) => `<dt>${esc(name)}</dt><dd>${esc(names.join(", "))}${extra || ""}</dd>`;
  const rows = [];
  for (const [k, name] of FIELDS) {
    // Twist rows (AI Arena, Block Buster, …) go before Final noms: they can take someone off the block.
    if (k === "nominees_final") for (const [label, v] of Object.entries(r.extras || {})) rows.push(row(extraLabel(label), v));
    const brief = k === "veto_winners" ? vetoBrief(r) : "";
    if (r[k] && r[k].length) rows.push(row(name, r[k], brief ? ` <span class="muted">· ${esc(brief)}</span>` : ""));
  }
  if (r.evicted) rows.push(`<dt class="result">Evicted</dt><dd class="result"><strong>${esc(r.evicted)}</strong>${r.tally ? ` <span class="muted">${esc(tallyText(r.tally))}</span>` : ""}</dd>`);
  return `<div class="round">${label ? `<h4>${esc(label)}</h4>` : ""}<dl>${rows.join("")}</dl></div>`;
}

const roundLabel = (w, i) => w.rounds.length > 1
  ? `Round ${i + 1}${w.rounds[i].sub_label ? " · " + w.rounds[i].sub_label : ""}${w.rounds[i].double_eviction ? " · Double eviction" : ""}` : "";

function rawHtml(raw) {
  if (!raw) return "";
  const head = raw.columns.length > 1 ? `<tr><td></td>${raw.columns.map(c => `<td><strong>${esc(c)}</strong></td>`).join("")}</tr>` : "";
  const body = raw.rows.map(r => `<tr><td>${esc(r.label)}</td>${r.cells.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("");
  return `<div class="raw"><h4>Table text for this week</h4><table>${head}${body}</table></div>`;
}

function tipHtml(w) {
  const status = statusText(w);
  return `<h3>BB${w.season} · ${esc(w.week_label)}</h3>`
    + (status ? `<div class="status">${esc(status)}</div>` : "")
    + w.rounds.map((r, i) => roundHtml(r, roundLabel(w, i))).join("")
    + (w.status !== "ok" ? rawHtml(w.raw) : "");
}

function cellLabel(w) {
  const names = w.rounds.map(r => r.evicted).filter(Boolean);
  const hohs = w.rounds.map(r => r.hoh.join(" & ")).filter(Boolean);
  return `BB${w.season} ${w.week_label}: `
    + (gridMode === "hoh" ? (hohs.length ? `HOH ${hohs.join(", then ")}` : "no modeled HOH")
       : (names.length ? `evicted ${names.join(" and ")}` : "no modeled eviction"))
    + (w.status !== "ok" ? `, ${w.status}` : "");
}

// What each grid cell shows: who was evicted (default) or whose HOH week it was.
let gridMode = "evicted";
try { if (localStorage.getItem("gridMode") === "hoh") gridMode = "hoh"; } catch (e) {}
// ?mode=hoh or ?mode=evicted picks it in the address, e.g. for a stream overlay.
if (["hoh", "evicted"].includes(params.get("mode"))) gridMode = params.get("mode");

// Grid cells show a face above each name unless photos are switched off. ?photos=0 or
// ?photos=1 sets it in the address, for a stream overlay with no buttons; the simple
// view is text only, like the stream's other boards, unless it says ?photos=1.
function defaultFaces() {
  if (["0", "1"].includes(params.get("photos"))) return params.get("photos") === "1";
  if (simple) return false;
  try { return localStorage.getItem("faces") !== "off"; } catch (e) { return true; }
}
let showFaces = defaultFaces();

function partHtml(r, season) {
  const text = gridMode === "hoh" ? r.hoh.join(" & ") : r.evicted;
  const names = gridMode === "hoh" ? r.hoh : (r.evicted ? [r.evicted] : []);
  // Co-HOHs wrap onto two lines rather than being cut off.
  const wrap = gridMode === "hoh" && r.hoh.length > 1 ? " wrap" : "";
  if (showFaces && names.length) {
    return `<span class="part faces${wrap}"><span class="who">${names.map(n => faceHtml(season, n)).join("")}</span>`
      + `<span class="nm">${esc(text)}</span></span>`;
  }
  return `<span class="part${wrap}">` + esc(text || "—") + `</span>`;
}

function render(data) {
  renderGrid(data);
  renderFooter(data);
  wireTooltip();
}

function renderGrid(data) {
  const weeks = data.weeks;
  // Newest season first, so the season currently airing is on top.
  const seasons = [...new Set(weeks.map(w => w.season))].sort((a, b) => b - a);
  // Columns keyed by week label as Wikipedia shows it; numbered weeks first, in order.
  const labels = [];
  for (const w of [...weeks].sort((a, b) => (a.week ?? 1e9) - (b.week ?? 1e9))) {
    if (!labels.includes(w.week_label)) labels.push(w.week_label);
  }
  const bySeason = new Map(seasons.map(s => [s, new Map()]));
  weeks.forEach(w => bySeason.get(w.season).set(w.week_label, w));
  const source = new Map((data.sources || []).map(s => [s.season, s]));
  // The newest season's latest week is the one "now" airing.
  const latest = weeks.filter(w => w.season === seasons[0]).reduce((a, w) => (w.week ?? -1) > (a.week ?? -1) ? w : a);
  const nowLabel = latest.week_label;
  const now = l => l === nowLabel ? ` class="now"` : "";
  NOW = { first: seasons[seasons.length - 1], season: seasons[0], label: nowLabel };
  renderHeader();

  let html = `<table class="grid"><thead><tr><th scope="col">Season</th>${labels.map(l => `<th scope="col"${now(l)}>${esc(l.replace(/^Week\s*/i, "Wk "))}</th>`).join("")}</tr></thead><tbody>`;
  for (const s of seasons) {
    const src = source.get(s);
    html += `<tr><th scope="row">${src ? `<a href="${esc(src.url)}" target="_blank" rel="noopener">BB${s}</a>` : `BB${s}`}</th>`;
    for (const l of labels) {
      const w = bySeason.get(s).get(l);
      if (!w) { html += `<td${now(l)}></td>`; continue; }
      const idx = weeks.indexOf(w);
      const parts = w.rounds.length
        ? w.rounds.map(r => partHtml(r, s)).join("")
        : `<span class="part empty">—</span>`;
      const badge = w.status === "ok" ? "" : `<i class="flag ${w.status}" aria-hidden="true"></i>`;
      html += `<td${now(l)}><button class="cell${w.rounds.length > 1 ? " multi" : ""}" data-i="${idx}" aria-label="${esc(cellLabel(w))}">${parts}${badge}</button></td>`;
    }
    html += "</tr>";
  }
  html += "</tbody></table>";
  document.getElementById("panel").innerHTML = html;
  document.getElementById("legend-error").hidden = !weeks.some(w => w.status === "error");
  document.querySelectorAll("#grid-mode button").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === gridMode));
  $("faces-btn").setAttribute("aria-pressed", showFaces);
  $("simple-btn").setAttribute("aria-pressed", simple);
  fitGrid();
}

// The page header. On the simple view's grid it reads like the stream's boards:
// "Season 28", then what the grid shows, then the week that's airing.
let NOW = null;
let BOARD_HEAD = null;  // { kicker, title } while a week board is showing
function renderHeader() {
  if (!NOW) return;
  $("now-pill").hidden = currentView === "board";
  if (currentView === "board" && BOARD_HEAD) {
    $("kicker").textContent = BOARD_HEAD.kicker;
    $("view-title").textContent = BOARD_HEAD.title;
    return;
  }
  const board = simple && currentView === "weeks";
  $("kicker").textContent = board ? `Season ${NOW.season}` : `Big Brother US · Seasons ${NOW.first}–${NOW.season}`;
  $("view-title").textContent = board ? (gridMode === "hoh" ? "HOH reigns" : "Evictions") : VIEWS[currentView].title;
  $("now-pill").textContent = board ? NOW.label : `BB${NOW.season} · ${NOW.label}`;
}

// Simple view: step down any name too wide for its column, then scroll the grid so the
// week that's airing is in sight at the right edge. Needs the grid on screen to measure.
function fitGrid() {
  const panel = $("panel");
  if (!simple || panel.offsetParent === null) return;
  const over = p => p.scrollWidth > p.clientWidth + 1;
  panel.querySelectorAll(".cell .part").forEach(p => {
    p.classList.remove("fit", "fit-2");
    if (over(p)) p.classList.add("fit");
    if (over(p)) p.classList.add("fit-2");
  });
  const th = panel.querySelector("thead th.now");
  if (!th) return;
  const past = th.getBoundingClientRect().right - panel.getBoundingClientRect().right;
  if (past > 0) panel.scrollLeft += past + 8;
}

function renderFooter(data) {
  // Sources: each season's article on both wikis, linked to the revision used.
  const missing = (data.sources || []).filter(s => s.error).map(s => `BB${s.season} (${esc(s.error)})`);
  const links = (list, pick) => [...list].sort((a, b) => a.season - b.season)
    .map(s => `<a href="${esc(pick(s))}" title="BB${s.season}">${s.season}</a>`).join(" ");
  const sources = data.sources || [];
  document.getElementById("footer").innerHTML =
    `<p>Wikipedia, seasons ${links(sources.filter(s => !s.error), s => s.permalink || s.url)} `
    + `· <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a></p>`
    + `<p><a href="https://bigbrother.fandom.com/">Big Brother Wiki</a>, seasons ${links(sources.filter(s => s.fandom), s => s.fandom.permalink || s.fandom.url) || "(not fetched yet)"} `
    + `· <a href="https://creativecommons.org/licenses/by-sa/3.0/">CC BY-SA 3.0</a></p>`
    + (data.photos ? `<p>Houseguest photos: CBS, via the Big Brother Wiki</p>` : "")
    + `<p>Rearranged and summarized from these pages; this page’s data is CC BY-SA 4.0. `
    + `Not affiliated with CBS or the makers of Big Brother.</p>`
    + `<p>Updated ${esc((data.generated_at || "").slice(0, 10))}${missing.length ? ` · Missing: ${missing.join(", ")}` : ""}</p>`;
}

// Reads DATA.weeks at the time of the event, so it keeps working after a refresh.
function wireTooltip() {
  const tip = document.getElementById("tip");
  const show = (btn, x, y) => {
    tip.innerHTML = tipHtml(DATA.weeks[+btn.dataset.i]);
    tip.style.display = "block";
    const r = btn.getBoundingClientRect();
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let left, top;
    if (x != null) {
      // Mouse: follow the pointer, flipping left/up at the viewport edges.
      left = x + 12; top = y + 12;
      if (left + tw > innerWidth - 8) left = Math.max(8, x - tw - 12);
      if (top + th > innerHeight - 8) top = Math.max(8, innerHeight - th - 8);
    } else {
      // Keyboard focus: sit below the cell (above if no room) so it stays visible.
      left = Math.min(Math.max(8, r.left), innerWidth - tw - 8);
      top = r.bottom + 6;
      if (top + th > innerHeight - 8) top = r.top - th - 6;
      if (top < 8) top = Math.max(8, innerHeight - th - 8);
    }
    tip.style.left = left + "px"; tip.style.top = top + "px";
  };
  const hide = () => { tip.style.display = "none"; };
  const panel = document.getElementById("panel");
  const drawerOpen = () => !document.getElementById("drawer").hidden;
  panel.addEventListener("mousemove", e => {
    const btn = e.target.closest(".cell");
    btn && !drawerOpen() ? show(btn, e.clientX, e.clientY) : hide();
  });
  panel.addEventListener("mouseleave", hide);
  panel.addEventListener("focusin", e => { const btn = e.target.closest(".cell"); if (btn && !drawerOpen()) show(btn); });
  panel.addEventListener("focusout", hide);
  // Clicking or tapping a week opens its details (the hover card stays a summary).
  panel.addEventListener("click", e => {
    const btn = e.target.closest(".cell");
    if (!btn) return;
    hide();
    const w = DATA.weeks[+btn.dataset.i];
    location.hash = weekHash(w.season, w.week_label);
  });
}

// ---------- Detail views (loaded on demand from details.json) ----------

let DATA = null, DETAILS = null, detailsPromise = null, CATEGORY_NAMES = [];
function loadDetails() {
  if (!detailsPromise) {
    detailsPromise = fetch("details.json")
      .then(r => { if (!r.ok) throw new Error(r.status + " " + r.statusText); return r.json(); })
      .then(d => { CATEGORY_NAMES = (d.categories || []).map(c => c.name); return (DETAILS = d); })
      .catch(err => { detailsPromise = null; throw err; });
  }
  return detailsPromise;
}

const weekHash = (season, label) => `#week=${season}/${encodeURIComponent(label)}`;
const playerHash = (season, name) => `#player=${season}/${encodeURIComponent(name)}`;
// True while the address still shows this view. Compared decoded, since a shared
// link may encode characters ("Da%27Vonne") that encodeURIComponent leaves as is.
const decodeHash = h => { try { return decodeURIComponent(h); } catch (err) { return h; } };
const isCurrent = hash => decodeHash(location.hash) === decodeHash(hash);
const plink = (season, name) => `<a class="plink" href="${playerHash(season, name)}">${esc(name)}</a>`;
const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + "s")}`;
const ZERO = `<span class="zero">–</span>`;
const num = n => n ? n : `<span class="zero">0</span>`;
// A column header; title explains an abbreviation on hover.
// Icons for the two powers: the HOH room's key and the veto medal. Drawn in
// currentColor, so they take the color of the chip or text around them.
const POWER = {
  hoh: { label: "HOH", svg: `<circle cx="7.5" cy="12" r="4.5"/><path d="M12 12h10M18.5 12v4M22 12v3"/>` },
  veto: { label: "Veto", svg: `<path d="M7.5 2.5 12 9.5l4.5-7"/><circle cx="12" cy="15.5" r="6"/><path d="M12 12.5v6"/>` },
};
const iconHtml = kind => `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${POWER[kind].svg}</svg>`;
// A table head that's an icon: the title says what the column counts.
const thIcon = (kind, title, cls) => `<th scope="col"${cls ? ` class="${cls}"` : ""}><abbr title="${esc(title)}">${iconHtml(kind)}<span class="sr">${POWER[kind].label === "HOH" ? "HOHs" : "Vetoes"}</span></abbr></th>`;
// A placing or state under a portrait. The non-breaking hyphen keeps "Runner-up" on one line.
const roleHtml = text => `<span class="role">${esc(text).replace(/-/g, "\u2011")}</span>`;
const th = (text, title, cls) => `<th scope="col"${cls ? ` class="${cls}"` : ""}>${title ? `<abbr title="${esc(title)}">${esc(text)}</abbr>` : esc(text)}</th>`;
// "Jul 17, 2024" from "2024-07-17"; month "long" gives "July 17, 2024".
const dateText = (iso, month = "short") => new Date(iso + "T12:00:00Z").toLocaleDateString(undefined, { month, day: "numeric", year: "numeric", timeZone: "UTC" });
const quoteHtml = (text, cite) => `<blockquote class="wnote">${esc(text)}${cite ? `<cite>${esc(cite)}</cite>` : ""}</blockquote>`;

// Lookups in details.json.
const seasonPlayers = (d, season) => d.players.filter(p => p.season === season);
const findPlayer = (d, season, name) => d.players.find(p => p.season === season && p.name === name);
const weekDetail = (d, season, label) => d.weeks[`${season}|${label}`];
const fandomComps = wd => (wd && wd.fandom && wd.fandom.comps) || [];
// The Big Brother Wiki's portrait, larger than the headshot in weeks.json.
const portraitOf = p => ((p || {}).fandom || {}).portrait || null;

const $ = id => document.getElementById(id);
let lastFocus = null;

function openDrawer(title, status, body) {
  if ($("drawer").hidden) lastFocus = document.activeElement;
  $("drawer-title").textContent = title;
  $("drawer-status").textContent = status || "";
  $("drawer-body").innerHTML = body;
  $("drawer-body").scrollTop = 0;
  $("drawer").hidden = false;
  $("scrim").hidden = false;
  $("drawer-close").focus();
}

function hideDrawer() {
  $("drawer").hidden = true;
  $("scrim").hidden = true;
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
  lastFocus = null;
}

// Closing returns to the current view's own address.
// A tab's address as it's showing now: Comps stays on Major comps once picked.
const viewHash = (view, season) => view === "comps" && compsScope === "major" ? "#comps=major" : VIEWS[view].hash(season);

function closeDrawer() {
  location.hash = viewHash(currentView, currentSeason);
}

function errorHtml(err) {
  return `<p class="muted">Couldn’t load details.json (${esc(err.message)}). Run <code>python -m bbgrid build</code> to create it.</p>`;
}

function weekRecord(season, label) {
  return DATA.weeks.find(w => w.season === season && w.week_label === label);
}

// The line under a week's title, in plain words. weeks.json's "note" is written
// for the report ("Finale; Two evictions", "Round 1 (Day 1): Non-standard
// outcome: David Evicted by competition"); the folded corner already says the
// week isn't fully modeled, so this just says what kind of week it was.
function statusText(w) {
  const text = [...new Set((w.note || "").split("; ").filter(Boolean).map(notePhrase))].join(" · ");
  const line = text.charAt(0).toUpperCase() + text.slice(1);
  return w.status === "error" ? `Failed a check${line ? `: ${line}` : ""}` : line;
}
function notePhrase(note) {
  let m;
  if (note === "Finale") return "finale week";
  if ((m = note.match(/^Round \d+ \([^)]*\): (.+)$/))) return notePhrase(m[1]);
  // Rounds named by day are just two rounds; named columns say what they were.
  if ((m = note.match(/^Two rounds: (.+) \/ (.+)$/)))
    return /^Day \d/.test(m[1]) ? "two rounds" : `two rounds: ${m[1].toLowerCase()} and ${m[2].toLowerCase()}`;
  if ((m = note.match(/^Non-standard outcome: (.+)$/))) {
    const out = m[1];
    if ((m = out.match(/^(.+?) (\S+(?: \S+)?)'s choice to (\w+)$/))) return `${m[2]} chose to ${m[3]} ${m[1]}`;
    if ((m = out.match(/^(.+?) (Evicted|Eliminated|Won)\b(.*)$/))) return `${m[1]} ${m[2].toLowerCase()}${m[3].replace(/ into game$/, " into the game")}`;
    return out.toLowerCase();
  }
  if (/sub-columns \(not modeled\)/.test(note)) return "not fully modeled";
  return note.charAt(0).toLowerCase() + note.slice(1);
}

async function showWeek(season, label) {
  const w = weekRecord(season, label);
  if (!w) return closeDrawer();
  const title = `BB${season} · ${label}`;
  openDrawer(title, statusText(w), `<p class="muted">Loading…</p>`);
  let d;
  try { d = weekDetail(await loadDetails(), season, label); }
  catch (err) { return openDrawer(title, statusText(w), errorHtml(err)); }
  if (!isCurrent(weekHash(season, label))) return;  // moved on while loading
  const summary = w.rounds.length
    ? w.rounds.map((r, i) => roundHtml(r, roundLabel(w, i))).join("")
    : `<p class="muted">No round was modeled this week. See “What was different”.</p>`;
  const different = specialHtml(d);
  const fin = (DETAILS.finales || {})[season];
  openDrawer(title, statusText(w),
    pagerHtml(season, label)
    + `<h3>Summary</h3>${summary}`
    + (fin && fin.week === label ? `<p><a class="plink" href="#finale=${season}">The final HOH and the jury vote ›</a>`
      + ((DETAILS.afh || {})[season] ? ` · <a class="plink" href="#afh">America’s Favorite HouseGuest ›</a>` : "") + `</p>` : "")
    + (seasonRounds(season, DETAILS).rounds.some(x => x.label === label && x.size <= ENDGAME_DEFAULT) ? `<p><a class="plink" href="${endgameHash(season, ENDGAME_DEFAULT)}">How the final ${ENDGAME_DEFAULT} played out ›</a></p>` : "")
    + (different ? `<h3>What was different</h3>${different}` : "")
    + `<h3>Competitions</h3>${compsHtml(w, d)}`
    + `<h3>Veto</h3>${vetoHtml(w, d)}`
    + `<h3>Votes to evict</h3>${votesHtml(w, d)}`
    + (d.fandom && d.fandom.have_nots.length ? `<h3>Have-Nots</h3>${haveNotsHtml(w, d)}` : "")
    + checksHtml(w, d)
    + `<h3>Episodes</h3>${episodesHtml(d)}`);
}

// The weeks before and after this one in the same season, in table order.
function weekNeighbors(season, label) {
  const list = DATA.weeks.filter(w => w.season === season);
  const i = list.findIndex(w => w.week_label === label);
  return { prev: list[i - 1] || null, next: list[i + 1] || null };
}

function pagerHtml(season, label) {
  const { prev, next } = weekNeighbors(season, label);
  const link = (w, text, rel) => w ? `<a href="${weekHash(season, w.week_label)}" rel="${rel}">${text}</a>` : `<span aria-hidden="true">${text}</span>`;
  return `<nav class="pager" aria-label="Weeks">${link(prev, `‹ ${esc(prev ? prev.week_label : "")}`, "prev")}`
    + `${link(next, `${esc(next ? next.week_label : "")} ›`, "next")}</nav>`;
}

function votesHtml(w, d) {
  if (!d || !d.rounds.length) return `<p class="muted">No vote to show.</p>`;
  const multi = d.rounds.length > 1;
  return d.rounds.map((v, i) => {
    const r = w.rounds[i];
    let html = multi ? `<h4>${esc(roundLabel(w, i))}</h4>` : "";
    if (r.tally && r.tally.type === "sole_vote") {
      html += `<p>${plink(w.season, r.tally.by)} cast the sole vote to evict.</p>`;
    }
    // One line per nominee: who voted to evict them (the count is in the summary's tally).
    html += `<dl class="votes">` + v.by_nominee.map(n =>
      `<dt>${faceHtml(w.season, n.nominee, n.nominee === r.evicted ? "out" : "")}${plink(w.season, n.nominee)}${n.nominee === r.evicted ? `<span class="tag">Evicted</span>` : ""}</dt>`
      + `<dd>${n.voters.length ? [...n.voters].sort((a, b) => a.localeCompare(b)).map(x => plink(w.season, x)).join(", ") : `<span class="muted">No votes</span>`}</dd>`).join("") + `</dl>`;
    return html;
  }).join("");
}

const compHash = format => `#comp=${encodeURIComponent(format)}`;
const catTag = c => c && c.category ? ` <span class="cat">${esc(c.category)}</span>` : "";

// The competition that decided a round's HOH or veto: the Big Brother Wiki's
// Competition History first, then a name found in Wikipedia's episode summaries.
function roundComp(d, round, kind) {
  const f = d.fandom && d.fandom.comps.find(c => c.kind === kind && c.round === round && c.name);
  if (f) return { name: f.name, format: f.format, category: f.category, winner: f.winners[0], fandom: true };
  const e = d.comps.find(c => c.winner && c.kind === kind && c.round === round);
  return e ? { name: e.name, winner: e.winner } : null;
}

function compsHtml(w, d) {
  const others = d.comps.filter(c => !c.winner);
  const kindName = { hoh: "HOH", veto: "Veto" };
  const fmt = c => (c.format ? ` <span class="muted">(<a class="plink" href="${compHash(c.format)}">${esc(c.format)}</a>)</span>` : "") + catTag(c);
  let html = "";
  w.rounds.forEach((r, i) => {
    const line = kind => {
      const c = roundComp(d, i + 1, kind);
      const winners = kind === "hoh" ? r.hoh : r.veto_winners;
      if (!winners.length) return "";
      // The winner is already in the summary above, so only the competition is named here.
      return `<dt>${kindName[kind]}</dt><dd>${c ? `“${esc(c.name)}”${fmt(c)}`
        : `Won by ${winners.map(x => plink(w.season, x)).join(", ")} <span class="muted">(competition not named)</span>`}</dd>`;
    };
    const title = roundLabel(w, i);
    html += `${title ? `<h4>${esc(title)}</h4>` : ""}<dl>${line("hoh")}${line("veto")}</dl>`;
  });
  // Everything else the Big Brother Wiki lists this week: twist comps, final HOH parts, unmodeled rounds.
  const shown = new Set(w.rounds.flatMap((_, i) => ["hoh", "veto"].map(k => roundComp(d, i + 1, k)))
    .filter(c => c && c.fandom).map(c => c.name));
  const extra = d.fandom ? d.fandom.comps.filter(c => !shown.has(c.name)) : [];
  // Twist rows the summary already shows (Block Buster, AI Arena) don't repeat their winner.
  const inSummary = new Set(w.rounds.flatMap(r => Object.keys(r.extras || {}).map(k => nkey(extraLabel(k)))));
  if (extra.length) {
    html += `<h4>${w.rounds.length ? "Other competitions this week" : "Competitions this week"}</h4><dl>`
      + extra.map(c => {
        const who = inSummary.has(nkey(c.type)) ? ""
          : c.winners.length ? `${c.winners.map(x => plink(w.season, x)).join(" & ")} ${esc(c.outcome)}` : esc(c.outcome);
        return `<dt>${esc(c.type)}</dt><dd>${c.name ? `“${esc(c.name)}”` : ""}${c.name && who ? ": " : ""}${who}`
          + prizeHtml(c.prize) + `${c.day ? ` <span class="muted">(Day ${esc(c.day)})</span>` : ""}</dd>`;
      }).join("") + `</dl>`;
  }
  if (d.fandom && d.fandom.comps.length) {
    html += `<p class="src">Source: Big Brother Wiki</p>`;
  } else if (others.length) {
    html += `<p class="src">Also mentioned in this week’s episodes: `
      + others.map(c => `“${esc(c.name)}” (${kindName[c.kind]})`).join(", ") + `</p>`;
  }
  if (!w.rounds.some((_, i) => roundComp(d, i + 1, "hoh") || roundComp(d, i + 1, "veto")) && !others.length && !extra.length) {
    html += `<p class="muted">Neither source names this week’s competitions.</p>`;
  }
  return html;
}

// "the “Diamond Power of Veto” power", from a twist's summary line.
const prizeHtml = p => p ? ` — the “${esc(p.name)}” ${esc(p.kind)}` : "";

function vetoHtml(w, d) {
  if (!d.rounds.length) return `<p class="muted">No veto to show.</p>`;
  let html = d.rounds.map((v, i) => {
    const r = w.rounds[i], u = v.veto;
    const title = roundLabel(w, i);
    let body;
    if (!u) body = `<p class="muted">No veto recorded.</p>`;
    else {
      const holder = r.veto_winners.map(x => plink(w.season, x)).join(" and ");
      const names = xs => xs.map(x => plink(w.season, x)).join(", ");
      const lines = [];
      if (!u.used) lines.push(`${holder} didn’t use the veto: the nominations stayed the same.`);
      else {
        const self = u.on.length === 1 && r.veto_winners.includes(u.on[0]);
        lines.push(`${holder} used the veto on ${self ? "themselves" : names(u.on)}.`);
        if (u.replacements.length) lines.push(`${names(u.replacements)} ${u.replacements.length > 1 ? "were" : "was"} named as the replacement${u.replacements.length > 1 ? "s" : ""}.`);
        const played = vetoPlayed(u, r.evicted);
        if (r.evicted && u.replacements.includes(r.evicted) && played != null) {
          lines.push(played ? `${plink(w.season, r.evicted)} went home, but had played in the veto, so it wasn’t a backdoor.`
            : `${plink(w.season, r.evicted)} went home without having played in the veto: a backdoor.`);
        }
      }
      if (u.twist_saved.length) {
        const label = extraLabel(Object.keys(r.extras || {})[0] || "a twist");
        lines.push(`${names(u.twist_saved)} came off the block through the twist (${esc(label)}).`);
      }
      const pl = u.players;
      body = `<p class="tight">${lines.join(" ")}</p>`
        + (pl && pl.players.length > r.hoh.length + r.nominees_initial.length
          ? `<p class="voters">${pl.complete ? "Played in the veto" : "Played in the veto, among others"}: ${names(pl.players)}</p>` : "");
    }
    return (title ? `<h4>${esc(title)}</h4>` : "") + body;
  }).join("");
  if (d.veto_notes.length) {
    html += `<details class="ep"><summary>From the episode summaries</summary>`
      + d.veto_notes.map(x => quoteHtml(x)).join("") + `</details>`;
  }
  return html;
}

function haveNotsHtml(w, d) {
  return `<ul class="plain">` + d.fandom.have_nots.map(h => `<li>${plink(w.season, h.name)}`
    + (h.chosen_by ? ` <span class="muted">(made a Have-Not by ${esc(h.chosen_by)})</span>` : "") + `</li>`).join("")
    + `</ul><p class="src">Source: Big Brother Wiki</p>`;
}

// Where the Big Brother Wiki's Game History table disagrees with Wikipedia.
function checksHtml(w, d) {
  const checks = d.fandom ? d.fandom.checks : [];
  if (!checks.length) return "";
  const multi = w.rounds.length > 1;
  return `<h3>Sources disagree</h3><dl>` + checks.map(c => `<dt>${multi ? `Round ${c.round} · ` : ""}${esc(c.field)}</dt>`
    + `<dd>Wikipedia: ${esc(c.wikipedia.join(", "))}<br>Big Brother Wiki: ${esc(c.fandom.join(", "))}</dd>`).join("")
    + `</dl><p class="src">The grid follows Wikipedia.</p>`;
}

// "" when nothing was different. A Block Buster alone is routine for its seasons, so it doesn't count.
function specialHtml(d) {
  if (!d) return "";
  let items = d.special.items, notes = d.special.notes;
  const bb = x => /Block Buster/i.test(x);
  if (items.every(bb) && notes.every(n => bb(n.text))) items = notes = [];
  notes = notes.map(n => quoteHtml(n.text, "Wikipedia")).join("");
  if (!items.length && !notes) return "";
  return (items.length ? `<ul class="plain">${items.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "") + notes;
}

function fmtDate(ep) {
  if (!ep.air_date) return ep.air_date_text || "";
  return dateText(ep.air_date);
}

function episodesHtml(d) {
  if (!d || !d.episodes.length) return `<p class="muted">No episodes listed for this week.</p>`;
  return d.episodes.map(ep => {
    const meta = [ep.days, fmtDate(ep), ep.viewers_millions != null ? `${ep.viewers_millions}M viewers` : ""].filter(Boolean).join(" · ");
    const head = `<strong>${esc(ep.title)}</strong> <span class="ep-meta">${esc(meta)}</span>`;
    const paras = (ep.summary || "").split(/\n+/).map(x => x.trim()).filter(Boolean);
    return paras.length
      ? `<details class="ep"><summary>${head}</summary>${paras.map(x => `<p>${esc(x)}</p>`).join("")}</details>`
      : `<div class="ep">${head}</div>`;
  }).join("");
}

// ---------- Tabs ----------

let currentView = "weeks", currentSeason = null;

// A button per season while they fit on one line; a drop-down once there are more.
const SEASON_BUTTONS_MAX = 10;
function seasonPickerHtml(season) {
  const list = seasonList();
  if (list.length <= SEASON_BUTTONS_MAX) {
    return list.map(s => `<button aria-pressed="${s === season}" data-season="${s}">BB${s}</button>`).join("");
  }
  return `<select aria-label="Season">${list.map(s =>
    `<option value="${s}"${s === season ? " selected" : ""}>BB${s}</option>`).join("")}</select>`;
}
function wireSeasonPicker(id, hashFor) {
  $(id).addEventListener("click", e => {
    const b = e.target.closest("button[data-season]");
    if (b) location.hash = hashFor(b.dataset.season);
  });
  $(id).addEventListener("change", e => { location.hash = hashFor(e.target.value); });
}

function seasonList() {
  return [...new Set(DATA.weeks.map(w => w.season))].sort((a, b) => b - a);
}

// Each tab: its heading, its address for a season, and what renders it from the
// address (the part after the season, if any). A drawer closes back to its tab's address.
const VIEWS = {
  weeks: { title: "Week by week", sub: "Who was evicted each week, or who was HOH. Click or tap a week for the full story.",
           hash: () => "" },
  players: { title: "Players", sub: "Every houseguest’s season in numbers. Click or tap a name for their week-by-week timeline.",
             hash: s => `#players=${s}`, show: s => showPlayers(s) },
  comps: { title: "Competitions", sub: "Every HOH and veto competition of a season, or the major comps and double evictions of every season. Click or tap a format to see each time it was played.",
           hash: s => `#comps=${s}`, show: s => showComps(s), picker: s => compsPickerHtml(s) },
  endgame: { title: "Endgame", sub: "The last few rounds, where a single veto or vote can decide the game. Who held the power, who decided each eviction, and how it compares across seasons.",
             hash: s => endgameHash(s), show: (s, rest) => showEndgame(s, ENDGAME_STARTS.includes(+rest) ? +rest : ENDGAME_DEFAULT) },
  finale: { title: "Finale", sub: "How each season’s winner was decided: the final HOH, the last eviction and every juror’s vote.",
            hash: s => `#finale=${s}`, show: s => showFinale(s) },
  afh: { title: "America’s Favorite HouseGuest", sub: "The viewers’ vote for their favorite houseguest, announced at each finale, and how that houseguest’s game went.",
         hash: () => "#afh" },
  // HOH and Veto show every season ("all") or one; their address keeps whichever is showing.
  hoh: { title: "Head of Household", sub: "Who won HOH, in what kind of competition, and whether their nominee went home. Every season, one season, or week by week.",
         hash: () => `#hoh=${currentScope}` },
  // A week board has no tab: it's opened from the grid or a link (#week=26/11 in the simple view, #weekall=11).
  board: { title: "Week", sub: "One week’s story: who held the power, who went home, and how it compares with the same week in other seasons.",
           hash: () => "" },
  veto: { title: "Power of Veto", sub: "Who won the veto, what they did with it, and who went home because of it. Every season, one season, or week by week.",
          hash: () => `#veto=${currentScope}` },
  analytics: { title: "Analytics", sub: "Patterns across every season: comp beasts, first HOHs, week-one nominees, who stays off the block, and what the endgame asks of you.",
               hash: () => "#analytics" },
};
// The tabs with a season picker.
const SEASON_VIEWS = Object.keys(VIEWS).filter(v => VIEWS[v].show);

function setView(view) {
  currentView = view;
  $("view-sub").textContent = VIEWS[view].sub;
  renderHeader();
  for (const v of Object.keys(VIEWS)) {
    $(`${v}-view`).hidden = view !== v;
    if ($(`tab-${v}`)) $(`tab-${v}`).setAttribute("aria-selected", view === v);
  }
  if (view === "weeks") fitGrid();
  // On a phone the tabs scroll sideways; keep the selected one in sight.
  const tab = $(`tab-${view}`), tabs = tab && tab.parentElement;
  if (tab && tabs.scrollWidth > tabs.clientWidth) {
    const r = tab.getBoundingClientRect(), box = tabs.getBoundingClientRect();
    if (r.right > box.right) tabs.scrollLeft += r.right - box.right + 4;
    else if (r.left < box.left) tabs.scrollLeft -= box.left - r.left + 4;
  }
}

// Switch to a tab (and season, for a tab with a season picker), then wait for
// details.json. Returns it, or null if it failed to load (the panel says so) or
// the reader moved on while it loaded.
async function openView(view, season, loading) {
  setView(view);
  if (season != null) {
    currentSeason = season;
    $(`${view}-season-pick`).innerHTML = (VIEWS[view].picker || seasonPickerHtml)(season);
  }
  const panel = $(`${view}-panel`);
  if (!DETAILS) panel.innerHTML = `<div class="msg">${loading}</div>`;
  let d;
  try { d = await loadDetails(); } catch (err) { panel.innerHTML = `<div class="msg">${errorHtml(err)}</div>`; return null; }
  return currentView === view && (season == null || currentSeason === season) ? d : null;
}

// ---------- Players ----------

// Twist rows a season runs every week get their own column.
const ARENA_RE = /AI Arena|Block Buster/i;
const MONEY_RE = /\$/;
const weekOf = key => key.replace(/ \((?:Day \d+|Inside|Outside|[^)]*)\)$/, "");

function arenaLabel(season) {
  for (const w of DATA.weeks) {
    if (w.season !== season) continue;
    for (const r of w.rounds) for (const k of Object.keys(r.extras || {})) {
      const m = k.match(ARENA_RE);
      if (m) return m[0];
    }
  }
  return null;
}

// Twists: powers, safety and other twist wins. The Big Brother Wiki's twist
// wins first (without money prizes), then any Wikipedia twist row in a week the
// wiki has none for. AI Arena / Block Buster wins are counted on their own.
function playerTwists(p) {
  const f = p.fandom || {};
  const wiki = (f.twist_wins || []).filter(t => !ARENA_RE.test(t.type) && !MONEY_RE.test(t.outcome || "") && !/luxury/i.test(t.type)
      && !/punish|downgrad/i.test(t.outcome || ""))
    .map(t => ({ week: t.week, label: t.type + (t.name ? ` (“${t.name}”)` : ""), outcome: t.outcome }));
  const weeks = new Set(wiki.map(t => t.week));
  const table = p.twist.filter(t => !ARENA_RE.test(t.label) && !weeks.has(weekOf(t.week)))
    .map(t => ({ week: weekOf(t.week), label: t.label.replace(/ winner$/i, "") }));
  return [...wiki, ...table];
}

function playerStats(p) {
  const against = p.votes_against.reduce((n, x) => n + x.voters.length, 0);
  const withHouse = p.votes_cast.filter(v => v.with_house).length;
  return { hoh: p.hoh.length, veto: p.veto.length, noms: new Set([...p.nominated, ...p.on_block]).size, block: p.on_block.length,
           against, cast: p.votes_cast.length, withHouse,
           arena: p.twist.filter(t => ARENA_RE.test(t.label)).length, twists: playerTwists(p).length };
}

// Age, hometown and occupation: Wikipedia's cast table, else the Big Brother Wiki.
function playerBio(p) {
  const b = p.bio || {}, f = p.fandom || {};
  return {
    full_name: f.full_name || b.full_name,
    age: b.age != null ? b.age : f.age,
    hometown: b.hometown || (f.hometown || []).join(" / ") || null,
    occupation: b.occupation || f.occupation || null,
  };
}

const pct = (n, d) => d ? `${Math.round(100 * n / d)}%` : "";

async function showPlayers(season) {
  const d = await openView("players", season, "Loading players…");
  if (!d) return;
  const rows = seasonPlayers(d, season);
  const hasBio = rows.some(p => p.bio || p.fandom);
  const hasHaveNots = rows.some(p => p.fandom);
  const arena = arenaLabel(season);
  const info = (d.seasons || {})[season];
  // Column groups: who they are, then comps, nominations and votes.
  const groups = [["", 2], ...(hasBio ? [["", 3]] : []), ["Comps", arena ? 4 : 3], ["Nominations", 2], ["Votes", 3],
                  ...(hasHaveNots ? [["", 1]] : [])];
  const grp = groups.map(([label, n], i) => `<th colspan="${n}"${i > (hasBio ? 1 : 0) ? ` class="gs"` : ""}>${esc(label)}</th>`).join("");
  $("players-panel").innerHTML = (info ? seasonInfoHtml(info) : "") + leadersHtml(season, rows) + `<table class="players"><thead>
    <tr class="grp">${grp}</tr><tr>
      <th scope="col">Player</th><th scope="col" class="l">Result</th>
      ${hasBio ? th("Age", "", "bio num") + th("Hometown", "", "bio") + th("Occupation", "", "bio") : ""}
      ${th("HOHs", "", "gs")}${th("Vetoes")}${arena ? th(arena, `${arena} wins`) : ""}${th("Twists", "Powers, safety and other twist wins")}
      ${th("Noms", "Weeks nominated, at the ceremony or as a replacement", "gs")}${th("Final noms", "On the block at the vote")}
      ${th("VTE", "Votes to evict them", "gs")}${th("Cast", "Votes cast")}${th("With house", "Votes cast with the majority")}
      ${hasHaveNots ? th("Have-Not wks", "", "gs") : ""}
    </tr></thead><tbody>` + rows.map(p => {
      const s = playerStats(p);
      const b = playerBio(p);
      const full = b.full_name && b.full_name !== p.name ? `<small>${esc(b.full_name)}</small>` : "";
      return `<tr><td><div class="pl">${faceHtml(season, p.name, faceState(p))}<span>${plink(season, p.name)}${full}</span></div></td><td class="result">${esc(p.result || "In the game")}${afhTagHtml(d, p)}</td>`
        + (hasBio ? `<td class="bio num">${b.age != null ? b.age : ZERO}</td><td class="bio">${b.hometown ? esc(b.hometown) : ZERO}</td><td class="bio">${b.occupation ? esc(b.occupation) : ZERO}</td>` : "")
        + `<td class="gs">${num(s.hoh)}</td><td>${num(s.veto)}</td>${arena ? `<td>${num(s.arena)}</td>` : ""}<td>${num(s.twists)}</td>`
        + `<td class="gs">${num(s.noms)}</td><td>${num(s.block)}</td>`
        + `<td class="gs">${num(s.against)}</td><td>${num(s.cast)}</td><td>${s.cast ? pct(s.withHouse, s.cast) : ZERO}</td>`
        + (hasHaveNots ? `<td class="gs">${num(((p.fandom || {}).have_not || []).length)}</td>` : "") + `</tr>`;
    }).join("") + `</tbody></table>`;
}

// The season's top five by HOH and veto wins, like the broadcast board's "highest rated" strip.
function leadersHtml(season, rows) {
  const top = rows.map((p, i) => ({ p, i, s: playerStats(p) }))
    .map(x => ({ ...x, wins: x.s.hoh + x.s.veto }))
    .filter(x => x.wins > 0)
    .sort((a, b) => b.wins - a.wins || b.s.hoh - a.s.hoh || a.i - b.i)
    .slice(0, 5);
  if (top.length < 3) return "";
  return `<section class="leaders" aria-labelledby="leaders-h"><h2 id="leaders-h">Most competition wins</h2><ol>`
    + top.map(({ p, s, wins }, i) => `<li><span class="rank" aria-label="Rank ${i + 1}">${i + 1}</span>`
      + faceHtml(season, p.name, faceState(p))
      + `<span class="who">${plink(season, p.name)}<span>${plural(s.hoh, "HOH")} · ${plural(s.veto, "veto", "vetoes")}</span></span>`
      + `<span class="n" title="HOH and veto wins">${wins}</span></li>`).join("")
    + `</ol></section>`;
}

function seasonInfoHtml(info) {
  const date = iso => iso ? dateText(iso) : "";
  const bits = [
    info.premiere && `Premiered ${date(info.premiere)}`,
    info.finale && (info.finale <= new Date().toISOString().slice(0, 10) ? `finale ${date(info.finale)}` : `finale due ${date(info.finale)}`),
    info.days && `${info.days} days`,
    info.houseguests && `${info.houseguests} houseguests`,
    info.prize && `${info.prize} prize`,
    info.host && `hosted by ${info.host}`,
  ].filter(Boolean);
  return `<p class="season-info">${esc(bits.join(" · "))}${info.url ? ` · <a href="${esc(info.url)}" target="_blank" rel="noopener">Big Brother Wiki</a>` : ""}</p>`;
}

// Week keys in season order, e.g. "Week 10 (Day 67)" for a round of a two-round week.
function roundKeys(season) {
  const keys = [];
  DATA.weeks.filter(w => w.season === season).forEach(w => {
    const multi = w.rounds.length > 1;
    if (!w.rounds.length) keys.push([w.week_label, w.week_label, 0]);
    w.rounds.forEach((r, i) => keys.push([multi && r.sub_label ? `${w.week_label} (${r.sub_label})` : w.week_label, w.week_label, i]));
  });
  return keys;
}

async function showPlayer(season, name) {
  const title = name;
  const status = `BB${season}`;
  openDrawer(title, status, `<p class="muted">Loading…</p>`);
  let d;
  try { d = await loadDetails(); } catch (err) { return openDrawer(title, status, errorHtml(err)); }
  if (!isCurrent(playerHash(season, name))) return;
  const p = findPlayer(d, season, name);
  if (!p) return openDrawer(title, status, `<p class="muted">No player by that name in BB${season}.</p>`);
  const s = playerStats(p);
  const f = p.fandom || {};
  const events = new Map();
  const add = (week, html) => { if (!events.has(week)) events.set(week, []); events.get(week).push(html); };
  // Look up a round's details from its timeline key, e.g. "Week 10 (Day 67)".
  const keys = new Map(roundKeys(season).map(([k, label, i]) => [k, { label, i }]));
  const roundInfo = k => {
    const at = keys.get(k); if (!at) return {};
    const wd = weekDetail(d, season, at.label);
    return wd ? { comp: kind => roundComp(wd, at.i + 1, kind), veto: (wd.rounds[at.i] || {}).veto } : {};
  };
  const wins = Object.fromEntries(CATEGORY_NAMES.map(c => [c, 0]));
  const compName = (k, kind) => {
    const info = roundInfo(k), c = info.comp && info.comp(kind);
    if (c && c.category) wins[c.category]++;
    return c ? ` <span class="muted">(“${esc(c.name)}”${c.format ? `, <a class="plink" href="${compHash(c.format)}">${esc(c.format)}</a>` : ""})</span>${catTag(c)}` : "";
  };
  p.hoh.forEach(w => add(w, "Won HOH" + compName(w, "hoh")));
  p.veto.forEach(w => add(w, "Won the veto" + compName(w, "veto")));
  p.twist.forEach(t => add(t.week, esc(extraLabel(t.label))));
  p.nominated.forEach(w => {
    if (p.on_block.includes(w)) return add(w, "Nominated");
    const v = roundInfo(w).veto;
    const how = v && v.on.includes(name) ? " by the veto" : v && v.twist_saved.includes(name) ? " by a twist" : "";
    add(w, `Nominated, then saved${how}`);
  });
  p.on_block.filter(w => !p.nominated.includes(w)).forEach(w => add(w, "Put on the block as a replacement nominee"));
  p.votes_against.forEach(v => add(v.week, `${plural(v.voters.length, "vote")} to evict them (${v.voters.map(x => plink(season, x)).join(", ")})`));
  p.votes_cast.forEach(v => add(v.week, `Voted to evict ${plink(season, v.vote)}${v.with_house ? "" : " <span class=\"tag\">against the house</span>"}`));
  if (p.evicted) add(p.evicted, "<strong>Evicted</strong>");
  // Have-Not weeks and twist wins are per week, so they go on the week's first round.
  const firstKey = new Map();
  roundKeys(season).forEach(([k, label]) => { if (!firstKey.has(label)) firstKey.set(label, k); });
  (f.have_not || []).forEach(label => firstKey.has(label) && add(firstKey.get(label), "Have-Not"));
  const wikiTwistWeeks = new Set(p.twist.map(t => keys.has(t.week) ? keys.get(t.week).label : t.week));
  (f.twist_wins || []).filter(t => !wikiTwistWeeks.has(t.week)).forEach(t =>
    firstKey.has(t.week) && add(firstKey.get(t.week), `${esc(t.type)}: ${esc(t.outcome || "won")}${prizeHtml(t.prize)}${t.name ? ` <span class="muted">(“${esc(t.name)}”)</span>` : ""}`));
  const byCat = CATEGORY_NAMES.filter(c => wins[c]).map(c => `${c} ${wins[c]}`);
  const timeline = roundKeys(season).filter(([k]) => events.has(k)).map(([k, label]) =>
    `<li><a class="plink" href="${weekHash(season, label)}">${esc(k)}</a><div>${events.get(k).join("<br>")}</div></li>`).join("");
  openDrawer(title, `BB${season} · ${p.result || "In the game"}`,
    bioHtml(p, season)
    + `<div class="stats">
       <div class="stat"><b>${s.hoh}</b><span>HOHs</span></div>
       <div class="stat"><b>${s.veto}</b><span>Vetoes</span></div>
       <div class="stat"><b>${s.noms}</b><span>Noms</span></div>
       <div class="stat"><b>${s.against}</b><span>Votes against</span></div>
     </div>
     <p class="voters mt-2">Final noms ${plural(s.block, "time")} · voted ${plural(s.cast, "time")}${s.cast ? `, ${pct(s.withHouse, s.cast)} with the house` : ""}${s.arena ? ` · ${s.arena} ${esc(arenaLabel(season) || "")}` : ""}${s.twists ? ` · ${plural(s.twists, "twist")}` : ""}</p>
     ${byCat.length ? `<p class="voters">Comp wins by type: ${esc(byCat.join(" · "))}</p>` : ""}
     <h3>Week by week</h3>
     ${timeline ? `<ul class="timeline">${timeline}</ul>` : `<p class="muted">Nothing recorded in the modeled weeks.</p>`}
     <p class="src">Twist weeks the grid doesn’t model aren’t counted.</p>`);
}

function bioHtml(p, season) {
  const f = p.fandom || {}, b = playerBio(p);
  const rows = [
    ["Full name", b.full_name],
    ["Age", b.age != null ? String(b.age) : null],
    ["Hometown", b.hometown],
    ["Occupation", b.occupation],
    ["Days", f.days],
    ["Alliances", (f.alliances || []).join(", ")],
    ["Other seasons", (f.seasons || []).filter(x => x !== `Big Brother ${season} (US)`).join(", ")],
    ["America’s Favorite", afhPlace(DETAILS, p)],
  ].filter(([, v]) => v);
  const face = faceHtml(season, p.name, faceState(p), portraitOf(p));
  if (!rows.length) return `<div class="bio-head">${face}</div>`;
  return `<div class="bio-head">${face}<dl class="bio">${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl></div>`
    + (f.url ? `<p class="src"><a href="${esc(f.url)}" target="_blank" rel="noopener">Profile on the Big Brother Wiki</a></p>` : "");
}

// ---------- Comps: every HOH and veto competition, and a page per format ----------

// A competition's Name, Format, Type and Won by cells.
function compCells(season, c) {
  return `<td>${c.name ? `“${esc(c.name)}”` : ZERO}</td>`
    + `<td>${c.format ? `<a class="plink" href="${compHash(c.format)}">${esc(c.format)}</a>` : ZERO}</td>`
    + `<td>${c.category ? `<span class="cat">${esc(c.category)}</span>` : ZERO}</td>`
    + `<td>${c.winners.map(x => plink(season, x)).join(" & ") || ZERO}</td>`;
}

async function showComps(season) {

async function showFormat(format) {
  openDrawer(format, "Competition format", `<p class="muted">Loading…</p>`);
  let d;
  try { d = await loadDetails(); } catch (err) { return openDrawer(format, "", errorHtml(err)); }
  if (!isCurrent(compHash(format))) return;
  const f = (d.formats || {})[format];
  if (!f) return openDrawer(format, "Competition format", `<p class="muted">No competition by that format in these seasons.</p>`);
  const help = Object.fromEntries((d.categories || []).map(c => [c.name, c.help]));
  const about = f.about;
  const kinds = [...new Set(f.plays.map(x => x.kind === "hoh" ? "HOH" : "Veto"))].join(" and ");
  const winners = new Map();
  f.plays.forEach(x => x.winners.forEach(n => { const k = `${x.season}|${n}`; winners.set(k, (winners.get(k) || 0) + 1); }));
  const repeat = [...winners].filter(([, n]) => n > 1).map(([k, n]) => { const [season, name] = k.split("|"); return `${plink(+season, name)} (BB${season}) ×${n}`; });
  openDrawer(format, `${plural(f.plays.length, "play")} · ${kinds}${f.category ? ` · ${f.category}` : ""}`,
    (f.description ? `<p class="lead">${esc(f.description)}</p>` : "")
    + (f.category ? `<p><span class="cat">${esc(f.category)}</span> <span class="muted">${esc(help[f.category] || "")}</span></p>` : "")
    + (about ? `<h3>${f.description ? "On the show" : "How it works"}</h3>${quoteHtml(about.text, `BB${about.season} ${about.week} · Wikipedia`)}` : "")
    // One row per play, newest season first, so it skims like a table.
    + `<h3>Every play</h3><table class="plays"><thead><tr><th scope="col">Season</th><th scope="col">Wk</th>`
    + `<th scope="col">Comp</th><th scope="col">Name</th><th scope="col">Won by</th></tr></thead><tbody>`
    + [...f.plays].reverse().map(x => `<tr><td><a class="plink" href="${weekHash(x.season, x.week)}">BB${x.season}</a></td>`
      + `<td class="n">${esc(x.week.replace(/^Week\s*/i, ""))}</td><td>${x.kind === "hoh" ? "HOH" : "Veto"}</td>`
      + `<td>${x.name ? esc(x.name) : ZERO}</td>`
      + `<td>${x.winners.map(n => plink(x.season, n)).join(" & ") || ZERO}</td></tr>`).join("")
    + `</tbody></table>` + (repeat.length ? `<p class="voters mt-2">Won more than once: ${repeat.join(", ")}</p>` : "")
    + `<p class="src"><a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(format)} on the Big Brother Wiki</a></p>`);
}

// ---------- Comps · Major comps: the ones played every season, and double evictions ----------

// The competitions the show brings back every season. format: the Big Brother
// Wiki's format page, when it has one (BB Comics has none, so it's matched by name).
const MAJOR_COMPS = [
  { label: "The Wall", format: "The Wall" },
  { label: "OTEV", format: "OTEV" },
  { label: "BB Comics", name: "BB Comics" },
  { label: "Knockout", format: "Knockout" },
  { label: "Jury statements", format: "Jury Statements" },
];
let compsScope = null;  // "major" while Major comps is showing, else null (a season)

function compsPickerHtml(scope) {
  return `<button aria-pressed="${scope === "major"}" data-season="major">Major comps</button>` + seasonPickerHtml(scope);
}

// Every HOH and veto play of a major comp, by season: [{ season, week, c }].
function majorPlays(d, m) {
  const out = [];
  DATA.weeks.forEach(w => fandomComps(weekDetail(d, w.season, w.week_label)).forEach(c => {
    if (c.kind === "twist" || !(m.format ? c.format === m.format : c.name === m.name)) return;
    out.push({ season: w.season, week: w.week_label, c });
  }));
  return out;
}

// A winner with their face, and a line under the name.
function winnerHtml(season, name, sub, people) {
  const p = people.get(`${season}|${name}`);
  return `<div class="pl">${faceHtml(season, name, p ? faceState(p) : "")}<span>${plink(season, name)}${sub ? `<small>${sub}</small>` : ""}</span></div>`;
}

async function showMajorComps() {
  setView("comps");
  compsScope = "major";
  $("comps-season-pick").innerHTML = compsPickerHtml("major");
  const panel = $("comps-panel");
  if (!DETAILS) panel.innerHTML = `<div class="msg">Loading competitions…</div>`;
  let d;
  try { d = await loadDetails(); } catch (err) { panel.innerHTML = `<div class="msg">${errorHtml(err)}</div>`; return; }
  if (currentView !== "comps" || compsScope !== "major") return;
  const people = new Map(d.players.map(p => [`${p.season}|${p.name}`, p]));
  const seasons = seasonList();
  const kindWord = c => c.kind === "hoh" ? "HOH" : "Veto";
  const where = (season, week, c) => `<a class="plink" href="${weekHash(season, week)}">${esc(week)}</a> · ${kindWord(c)}`;
  const comps = MAJOR_COMPS.map(m => ({ ...m, plays: majorPlays(d, m) })).filter(m => m.plays.length);

  // Wins by the season's eventual winner, in finished seasons.
  let wins = 0, byWinner = 0;
  comps.forEach(m => m.plays.forEach(({ season, c }) => c.winners.forEach(n => {
    const p = people.get(`${season}|${n}`);
    if (!p || !p.result || !d.players.some(q => q.season === season && /^winner/i.test(q.result || ""))) return;
    wins++;
    if (/^winner/i.test(p.result)) byWinner++;
  })));

  // Double evictions: the HOH, nominations, veto and vote all in one live show.
  const doubles = [];
  DATA.weeks.forEach(w => w.rounds.forEach((r, i) => { if (r.double_eviction) doubles.push({ w, r, i }); }));
  doubles.sort((a, b) => b.w.season - a.w.season || b.w.week - a.w.week);
  const outNext = doubles.filter(({ w, r }) => {
    const keys = roundKeys(w.season), at = keys.findIndex(([, label, j]) => label === w.week_label && w.rounds[j] === r);
    const prev = at > 0 ? weekRecord(w.season, keys[at - 1][1]).rounds[keys[at - 1][2]] : null;
    return prev && prev.hoh.includes(r.evicted);
  }).length;

  const head = comps.map(m => `<th scope="col" class="l">${m.format && (d.formats || {})[m.format]
    ? `<a class="plink" href="${compHash(m.format)}">${esc(m.label)}</a>` : esc(m.label)}</th>`).join("");
  const rows = seasons.map(s => `<tr><td class="l"><a class="plink" href="#comps=${s}">BB${s}</a></td>`
    + comps.map(m => {
      const ps = m.plays.filter(x => x.season === s);
      return `<td class="l wrap">${ps.flatMap(({ week, c }) => c.winners.map(n => winnerHtml(s, n, where(s, week, c), people))).join("")
        || `<span class="zero" title="Not played, or not yet">–</span>`}</td>`;
    }).join("") + `</tr>`).join("");

  // What each comp is: the format page's one line, else how the show described it.
  const about = m => {
    const f = m.format && (d.formats || {})[m.format];
    if (f && f.description) return f.description;
    const last = [...m.plays].reverse().find(x => x.c.about);
    return last ? last.c.about : "";
  };
  const kinds = m => [...new Set(m.plays.map(x => kindWord(x.c)))].join(" and ");
  const guide = comps.map(m => {
    const cat = m.plays.map(x => x.c.category).find(Boolean);
    const n = new Set(m.plays.map(x => x.season)).size;
    return `<li><b>${m.format && (d.formats || {})[m.format] ? `<a class="plink" href="${compHash(m.format)}">${esc(m.label)}</a>` : esc(m.label)}</b>`
      + `${cat ? ` <span class="cat">${swatch(catVar(cat))}${esc(cat)}</span>` : ""}`
      + ` <span class="muted">${esc(kinds(m))} · ${plural(n, "season")}</span>`
      + `${about(m) ? `<p>${esc(about(m))}</p>` : ""}</li>`;
  }).join("");

  const dRows = doubles.map(({ w, r, i }) => {
    const wd = weekDetail(d, w.season, w.week_label) || { comps: [] };
    const hc = roundComp(wd, i + 1, "hoh"), vc = roundComp(wd, i + 1, "veto");
    const compLine = c => c && c.name ? `“${esc(c.name)}”` : "";
    const who = (names, c) => names.map(n => winnerHtml(w.season, n, compLine(c), people)).join("") || ZERO;
    const saved = (vetoUse(r) || { on: [] }).on;
    return `<tr><td class="l"><a class="plink" href="${weekHash(w.season, w.week_label)}">BB${w.season} · ${esc(w.week_label)}</a>`
      + `${r.sub_label ? `<small class="muted"> · ${esc(r.sub_label)}</small>` : ""}</td>`
      + `<td class="l">${who(r.hoh, hc)}</td><td class="l">${who(r.veto_winners, vc)}</td>`
      + `<td class="l wrap">${saved.length ? saved.map(n => plink(w.season, n)).join(", ") : `<span class="muted">Not used</span>`}</td>`
      + `<td class="l wrap">${r.nominees_final.map(n => plink(w.season, n)).join(", ") || ZERO}</td>`
      + `<td class="l">${r.evicted ? winnerHtml(w.season, r.evicted, esc(tallyText(r.tally)), people) : ZERO}</td></tr>`;
  }).join("");

  const plays = comps.reduce((n, m) => n + m.plays.length, 0);
  panel.innerHTML = `<div class="view-body trend">`
    + `<p class="lede">The competitions Big Brother brings back every season, and every double eviction, across ${seasonsText(seasons.map(season => ({ season })))}.</p>`
    + `<div class="stats">${statTile(plays, "Major comps played", `${comps.length} comps, HOH and veto`)}`
    + statTile(wins ? `${pctOf(byWinner, wins)}%` : "–", "Won by the eventual winner", `${byWinner} of ${wins}, finished seasons`)
    + statTile(doubles.length, "Double evictions", `in ${new Set(doubles.map(x => x.w.season)).size} seasons`)
    + statTile(doubles.length ? outNext : "–", "Last week’s HOH evicted", `of ${doubles.length} double evictions`) + `</div>`
    + `<h2>Who won them</h2><p class="note">One row per season, newest first. Click or tap a comp for every time it was played, or a week for the full story.</p>`
    + `<div class="scroll"><table class="players major"><thead><tr><th scope="col" class="l">Season</th>${head}</tr></thead><tbody>${rows}</tbody></table></div>`
    + `<h2>The comps</h2><p class="note">What each one is. Jury statements is the third part of the final HOH.</p>`
    + `<ul class="major-guide">${guide}</ul>`
    + `<h2>Double evictions</h2><p class="note">A whole week in one live hour: a new HOH, nominations, a veto and a vote, right after the first eviction. Newest first.</p>`
    + (doubles.length
      ? `<div class="scroll"><table class="players major"><thead><tr><th scope="col" class="l">Week</th><th scope="col" class="l">HOH</th><th scope="col" class="l">Veto</th>`
        + `<th scope="col" class="l">Veto used on</th><th scope="col" class="l">Final noms</th><th scope="col" class="l">Evicted</th></tr></thead><tbody>${dRows}</tbody></table></div>`
      : `<p class="muted">No double evictions in these seasons yet.</p>`)
    + `<p class="src">Competitions from the Big Brother Wiki’s competition history; double evictions and votes from Wikipedia’s voting tables.</p></div>`;
}

// ---------- Finale: the final HOH, the last eviction and the jury vote ----------

const dayNum = day => parseInt(String(day || "").split("-")[0], 10) || 0;
// The finalists, most jury votes first.
const byVotes = f => f.finalists.slice().sort((x, y) => y.votes - x.votes);

// The final HOH's parts in order, from the finale week's Big Brother Wiki comps,
// each with "part": "Part 1".
function finalParts(d, f) {
  return fandomComps(f ? weekDetail(d, f.season, f.week) : null).filter(c => /final hoh/i.test(c.outcome || ""))
    .sort((a, b) => dayNum(a.day) - dayNum(b.day))
    .map(c => ({ ...c, part: ((c.outcome.match(/part\s*\d+/i) || ["Part"])[0]).replace(/^p/, "P") }));
}

// What each finalist had to do with a juror's eviction: HOH that round, holding
// the veto, or a vote to evict them. Null when the round isn't modeled.
function jurorRound(season, p, finalists) {
  if (!p || !p.evicted) return null;
  const at = roundKeys(season).find(([k]) => k === p.evicted);
  if (!at) return null;
  const [, label, i] = at;
  const r = weekRecord(season, label).rounds[i];
  if (!r) return null;
  const v = ((weekDetail(DETAILS, season, label) || {}).rounds || [])[i] || { votes: [] };
  const roles = new Map(finalists.map(n => [n, []]));
  for (const n of finalists) {
    if (r.hoh.includes(n)) roles.get(n).push("HOH");
    if (r.veto_winners.includes(n)) roles.get(n).push("held the veto");
    if (r.tally && r.tally.type === "sole_vote" && r.tally.by === n) roles.get(n).push("cast the sole vote");
    else if (v.votes.some(x => x.voter === n && x.vote === p.name)) roles.get(n).push("voted to evict");
  }
  return { label, r, roles };
}

async function showFinale(season) {
  const d = await openView("finale", season, "Loading the finale…");
  if (!d) return;
  const panel = $("finale-panel");
  const f = (d.finales || {})[season];
  if (!f) { panel.innerHTML = `<div class="msg">The voting table for BB${season} has no Finale column yet.</div>`; return; }
  const w = weekRecord(season, f.week);
  const wd = weekDetail(d, season, f.week);
  const info = (d.seasons || {})[season] || {};
  const people = new Map(seasonPlayers(d, season).map(p => [p.name, p]));
  const names = f.finalists.map(x => x.name);
  const jury = f.jury.map((j, i) => ({ ...j, n: i + 1, round: jurorRound(season, people.get(j.name), names) }));
  // The last round decided by one vote is the final HOH's eviction.
  const last = w ? [...w.rounds].reverse().find(r => r.tally && r.tally.type === "sole_vote") : null;
  const parts = finalParts(d, f);

  panel.innerHTML = `<div class="view-body fin">`
    + finaleHeadHtml(season, f, info, last, people)
    + finalHohHtml(season, f, parts, last)
    + juryBoardHtml(season, f, jury)
    + juryTableHtml(season, f, jury)
    + (f.decided ? duelHtml(season, f, jury, parts, people) : "")
    + finaleAfhHtml(season, d, people)
    + (wd && wd.episodes.length ? `<h2>Finale week’s episodes</h2>${episodesHtml(wd)}` : "")
    + `<p><a class="plink" href="${endgameHash(season, ENDGAME_DEFAULT)}">How the final ${ENDGAME_DEFAULT} got here ›</a></p>`
    + `<p class="src">Votes from Wikipedia’s voting table (<a href="${weekHash(season, f.week)}">${esc(f.week)}</a>); final HOH parts from the Big Brother Wiki.</p>`
    + `</div>`;
}

function finaleHeadHtml(season, f, info, last, people) {
  const portrait = n => portraitOf(people.get(n));
  if (!f.decided) {
    const left = [...people.values()].filter(p => !p.result).map(p => p.name);
    const due = info.finale ? dateText(info.finale, "long") : "";
    return `<div class="fin-head">${left.map(n => `<div class="fin-card">${faceHtml(season, n, "live", portrait(n))}${plink(season, n)}${roleHtml("Still in the game")}</div>`).join("")}</div>`
      + `<p class="fin-lede">The finale hasn’t aired yet${due ? ` (due ${esc(due)})` : ""}. `
      + `${plural(f.jury.length, "juror")} so far; the rest of the jury is decided by the evictions still to come.</p>`;
  }
  const [a, b] = byVotes(f);
  const card = (x, role) => `<div class="fin-card${role === "Winner" ? " win" : ""}">`
    + faceHtml(season, x.name, role === "Winner" ? "won" : "", portrait(x.name)) + plink(season, x.name) + roleHtml(role) + `</div>`;
  const third = last ? last.evicted : null;
  const lede = `${plink(season, a.name)} beat ${plink(season, b.name)} ${a.votes}–${b.votes}`
    + (b.votes === 0 ? ", a unanimous jury vote" : "")
    + (info.prize ? `, and won ${esc(info.prize)}` : "") + "."
    + (third ? ` ${plink(season, third)} finished third, evicted by ${plink(season, last.hoh[0])} at the final three.` : "");
  return `<div class="fin-head">${card(a, "Winner")}<div class="fin-score" aria-label="${a.votes} votes to ${b.votes}">${a.votes}–${b.votes}</div>${card(b, "Runner-up")}</div>`
    + `<p class="fin-lede">${lede}</p>`;
}

function finalHohHtml(season, f, parts, last) {
  let html = `<h2>The final Head of Household</h2>`;
  if (!parts.length) {
    html += `<p class="muted">${f.decided ? "The Big Brother Wiki doesn’t list the final HOH’s parts." : "Not played yet."}</p>`;
  } else {
    html += `<div class="scroll"><table class="players comps"><thead><tr><th scope="col">Part</th><th scope="col" class="day">Day</th><th scope="col">Name</th>`
      + `<th scope="col">Format</th><th scope="col">Type</th><th scope="col">Won by</th></tr></thead><tbody>`
      + parts.map(c => `<tr><td>${esc(c.part)}</td><td class="day">${esc(c.day || "")}</td>${compCells(season, c)}</tr>`).join("")
      + `</tbody></table></div>`;
  }
  if (last && f.decided) {
    const kept = last.nominees_final.filter(n => n !== last.evicted);
    html += `<p>${plink(season, last.hoh[0])} won the final HOH and cast the sole vote to evict ${plink(season, last.evicted)}`
      + (kept.length ? `, taking ${kept.map(n => plink(season, n)).join(" and ")} to the final two` : "") + `.`
      + ` ${plink(season, last.evicted)} became the last juror.</p>`;
  }
  return html;
}

function juryBoardHtml(season, f, jury) {
  const chip = j => `<li>${faceHtml(season, j.name)}${plink(season, j.name)}<small>#${j.n}</small></li>`;
  if (!f.decided) {
    return `<h2>The jury so far</h2><div class="board"><div class="board-col"><ul>${jury.map(chip).join("") || `<li class="none">No jurors yet.</li>`}</ul></div></div>`;
  }
  const cols = byVotes(f).map((x, i) => {
    const mine = jury.filter(j => j.vote === x.name);
    return `<div class="board-col${i === 0 ? " win" : ""}"><h3>${faceHtml(season, x.name)}${plink(season, x.name)}<span class="n">${x.votes}</span></h3>`
      + (mine.length ? `<ul>${mine.map(chip).join("")}</ul>` : `<p class="none">No jury votes.</p>`) + `</div>`;
  });
  return `<h2>The jury vote</h2><div class="board">${cols.join("")}</div>`;
}

function juryTableHtml(season, f, jury) {
  if (!jury.length) return "";
  const names = f.finalists.map(x => x.name);
  const rows = jury.map(j => {
    const at = j.round;
    const left = `${esc(j.left || "Left")}${j.day != null ? ` Day ${j.day}` : ""}`
      + (at ? ` · <a class="plink" href="${weekHash(season, at.label)}">${esc(at.label)}</a>` : "");
    const by = at ? `${at.r.hoh.map(n => plink(season, n)).join(" & ")}` : ZERO;
    const part = at ? names.map(n => at.roles.get(n).length
        ? `${plink(season, n)}: ${at.roles.get(n).map(x => `<span class="tag">${esc(x)}</span>`).join("")}` : "").filter(Boolean).join("<br>")
      : "";
    return `<tr><td><div class="pl">${faceHtml(season, j.name, "out")}<span>${plink(season, j.name)}<small>Juror ${j.n}</small></span></div></td>`
      + `<td>${left}</td><td>${by}</td>`
      + (f.decided ? `<td class="why">${part || ZERO}</td>`
        + `<td>${j.vote ? `<strong>${plink(season, j.vote)}</strong>` : ZERO}</td>` : "") + `</tr>`;
  }).join("");
  return `<h2>Who the jurors were</h2><div class="scroll"><table class="players jury"><thead><tr><th scope="col">Juror</th><th scope="col">Left the game</th>`
    + `<th scope="col">HOH that week</th>`
    + (f.decided ? `<th scope="col">The finalists’ part in it</th><th scope="col">Voted for</th>` : "") + `</tr></thead><tbody>${rows}</tbody></table></div>`
    + (f.decided ? `<p class="src">From each juror’s eviction round: which of the final two was HOH, held the veto or voted them out.</p>` : "");
}

// The final two's games side by side.
function duelHtml(season, f, jury, parts, people) {
  const list = byVotes(f);
  const stats = list.map(x => {
    const p = people.get(x.name);
    const s = p ? playerStats(p) : {};
    return { ...s, parts: parts.filter(c => c.winners.includes(x.name)).length,
             hand: jury.filter(j => j.round && j.round.roles.get(x.name).some(r => r !== "held the veto")).length,
             votes: x.votes };
  });
  const row = (label, key) => `<tr><th scope="row">${esc(label)}</th>${stats.map(s => `<td>${s[key] != null ? s[key] : ZERO}</td>`).join("")}</tr>`;
  return `<h2>The final two’s games</h2><div class="scroll"><table class="players duel"><thead><tr><th scope="col"></th>`
    + list.map(x => `<th scope="col">${plink(season, x.name)}</th>`).join("") + `</tr></thead><tbody>`
    + row("Jury votes", "votes") + row("HOH wins", "hoh") + row("Veto wins", "veto") + row("Final HOH parts won", "parts")
    + row("Times nominated", "noms") + row("On the block at the vote", "block") + row("Votes to evict them", "against")
    + row("Jurors they helped evict (HOH or vote)", "hand")
    + `</tbody></table></div>`;
}

// ---------- HOH and Veto: every round's HOH and veto, across seasons, in one season, and by week ----------

// "all", or a season number.
let currentScope = "all";
let TREND_ROUNDS = null;

// One record per modeled round, in season order, with what came of its HOH and veto.
function trendRounds(d) {
  if (TREND_ROUNDS) return TREND_ROUNDS;
  const people = new Map(d.players.map(p => [`${p.season}|${p.name}`, p]));
  // How far a houseguest got: "won", "live" (still playing) or "out".
  const finish = (season, name) => {
    const p = people.get(`${season}|${name}`);
    return !p ? null : !p.result ? "live" : /^winner/i.test(p.result) ? "won" : "out";
  };
  const rounds = [];
  for (const w of DATA.weeks) {
    const wd = d.weeks[`${w.season}|${w.week_label}`] || { rounds: [], comps: [] };
    w.rounds.forEach((r, i) => {
      const v = ((wd.rounds || [])[i] || {}).veto || null;
      const multi = w.rounds.length > 1;
      const x = { season: w.season, week: w.week, label: w.week_label, i, r, v,
        key: multi && r.sub_label ? `${w.week_label} (${r.sub_label})` : w.week_label,
        hohComp: roundComp(wd, i + 1, "hoh"), vetoComp: roundComp(wd, i + 1, "veto"),
        finish: n => finish(w.season, n), done: !!((d.finales || {})[w.season] || {}).decided };
      // The final HOH evicts one of the other two directly: no nominations, no veto.
      x.final = !r.nominees_initial.length && !!r.tally && r.tally.type === "sole_vote";
      // A replacement nominee who didn't play in the veto had no way to save
      // themselves: that's a backdoor. One who played (or whose veto players
      // aren't recorded) is only a replacement.
      x.vetoPlayed = v ? vetoPlayed(v, r.evicted) : null;
      x.hohOutcome = x.final ? "final" : !r.evicted || !r.nominees_initial.length ? null
        : r.nominees_initial.includes(r.evicted) ? "theirs" : x.vetoPlayed === false ? "backdoor" : "renom";
      x.hasVeto = r.veto_winners.length > 0 && !!v;
      if (x.hasVeto) {
        const winners = new Set(r.veto_winners);
        x.vetoOutcome = !v.used ? "kept" : v.on.some(n => winners.has(n)) ? "self" : "other";
        x.vetoRoles = r.veto_winners.map(n => r.hoh.includes(n) ? "hoh" : r.nominees_initial.includes(n) ? "nominee" : "hg");
        x.replaced = v.used && !!r.evicted && v.replacements.includes(r.evicted);
        x.backdoor = x.replaced && x.vetoPlayed === false;
        x.vetoDecided = !!r.tally && r.tally.type === "sole_vote" && winners.has(r.tally.by);
      }
      rounds.push(x);
    });
  }
  rounds.forEach((x, k) => {
    const n = rounds[k + 1];
    x.next = n && n.season === x.season ? n : null;
    if (x.next && !x.final && x.r.hoh.length) {
      const nr = x.next.r;
      // A next round still airing has no eviction to count yet.
      if (nr.evicted) x.exEvicted = x.r.hoh.includes(nr.evicted);
      x.exNominated = x.r.hoh.some(h => nr.nominees_initial.includes(h) || nr.nominees_final.includes(h));
    }
  });
  return (TREND_ROUNDS = rounds);
}

const TREND = { hoh: { title: "HOH", word: "HOH", words: "HOHs" }, veto: { title: "Veto", word: "veto", words: "vetoes" } };
const catVar = c => `var(--cat-${CATEGORY_NAMES.includes(c) ? c.toLowerCase() : "none"})`;
const VETO_OUT = [
  ["self", "A nominee saved themselves", "var(--out-self)"],
  ["other", "Used on someone else", "var(--out-other)"],
  ["kept", "Not used", "var(--out-kept)"],
];
const outColor = Object.fromEntries(VETO_OUT.map(([k, , c]) => [k, c]));
const pctOf = (n, d) => d ? Math.round(100 * n / d) : null;
const pctCell = (n, d) => d ? `<span class="pct">${pctOf(n, d)}%<small>${n}/${d}</small></span>` : `<span class="zero">–</span>`;
const seasonsText = rounds => { const s = [...new Set(rounds.map(x => x.season))].sort((a, b) => a - b); return s.length > 1 ? `BB${s[0]}–BB${s[s.length - 1]}` : `BB${s[0]}`; };
const tipAttr = html => ` data-tip="${esc(html)}" tabindex="0"`;
const swatch = color => `<i class="tipkey" style="background:${color}"></i>`;

// Totals for a set of rounds (a season, or every season).
function hohStats(rounds) {
  const hr = rounds.filter(x => x.r.hoh.length);
  const wins = new Map();
  hr.forEach(x => x.r.hoh.forEach(n => { const k = `${x.season}|${n}`; wins.set(k, (wins.get(k) || 0) + 1); }));
  const names = hr.flatMap(x => x.r.hoh.map(n => ({ x, n })));
  // Who won the season is only known once it's over.
  const done = names.filter(({ x }) => x.done);
  const decided = hr.filter(x => ["theirs", "backdoor", "renom"].includes(x.hohOutcome));
  const after = hr.filter(x => x.exEvicted != null);
  const withVeto = hr.filter(x => x.hasVeto);
  const cats = Object.fromEntries([...CATEGORY_NAMES, ""].map(c => [c, 0]));
  hr.forEach(x => { const c = x.hohComp && x.hohComp.category; cats[CATEGORY_NAMES.includes(c) ? c : ""]++; });
  return {
    rounds: hr.length, wins: names.length, people: wins.size, top: topOf(wins), doneWins: done.length,
    byWinner: done.filter(({ x, n }) => x.finish(n) === "won").length,
    theirs: decided.filter(x => x.hohOutcome === "theirs").length, decided: decided.length,
    backdoor: decided.filter(x => x.hohOutcome === "backdoor").length,
    exEvicted: after.filter(x => x.exEvicted).length, exNominated: after.filter(x => x.exNominated).length, after: after.length,
    alsoVeto: withVeto.filter(x => x.r.hoh.some(n => x.r.veto_winners.includes(n))).length, withVeto: withVeto.length,
    cats,
  };
}

function vetoStats(rounds) {
  const vr = rounds.filter(x => x.hasVeto);
  const wins = new Map();
  vr.forEach(x => x.r.veto_winners.forEach(n => { const k = `${x.season}|${n}`; wins.set(k, (wins.get(k) || 0) + 1); }));
  const count = k => vr.filter(x => x.vetoOutcome === k).length;
  const used = vr.filter(x => x.v.used);
  // The usual number on the block before the veto (most common, ties to the larger).
  const blocks = new Map();
  vr.forEach(x => { const n = x.r.nominees_initial.length; if (n) blocks.set(n, (blocks.get(n) || 0) + 1); });
  const block = [...blocks].sort((a, b) => b[1] - a[1] || b[0] - a[0]).map(([n]) => n)[0] || 0;
  return {
    rounds: vr.length, people: wins.size, top: topOf(wins),
    self: count("self"), other: count("other"), kept: count("kept"), used: used.length,
    byHoh: vr.filter(x => x.vetoRoles.includes("hoh")).length,
    byNominee: vr.filter(x => x.vetoRoles.includes("nominee")).length,
    byOther: vr.filter(x => x.vetoRoles.every(r => r === "hg")).length,
    replaced: used.filter(x => x.replaced).length,
    backdoor: used.filter(x => x.backdoor).length,
    twist: vr.filter(x => x.v.twist_saved.length).length,
    block,
  };
}

// The most wins by one houseguest in a season: [{season, name, n}], best first.
function topOf(wins) {
  return [...wins].map(([k, n]) => { const [season, name] = k.split("|"); return { season: +season, name, n }; })
    .sort((a, b) => b.n - a.n || b.season - a.season);
}

// " The most in one season: 4, by Vince (BB27) and Chelsie (BB26)."
function mostInSeason(top) {
  if (!top.length) return "";
  const best = top.filter(t => t.n === top[0].n);
  const who = best.map(t => `${plink(t.season, t.name)} (BB${t.season})`);
  return ` The most in one season: ${top[0].n}, by ${who.length > 1 ? who.slice(0, -1).join(", ") + " and " + who[who.length - 1] : who[0]}.`;
}

function statTile(big, label, sub) {
  return `<div class="stat"><b>${big}</b><span>${label}</span>${sub ? `<small>${sub}</small>` : ""}</div>`;
}

function keyHtml(items) {
