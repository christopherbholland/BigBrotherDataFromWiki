// ---------- Finale: the final HOH, the last eviction and the jury vote ----------

const dayNum = day => parseInt(String(day || "").split("-")[0], 10) || 0;

// What each finalist had to do with a juror's eviction: HOH that round, holding
// the veto, or a vote to evict them. Null when the round isn't modeled.
function jurorRound(season, p, finalists) {
  if (!p || !p.evicted) return null;
  const at = roundKeys(season).find(([k]) => k === p.evicted);
  if (!at) return null;
  const [, label, i] = at;
  const r = weekRecord(season, label).rounds[i];
  if (!r) return null;
  const v = ((DETAILS.weeks[`${season}|${label}`] || {}).rounds || [])[i] || { votes: [] };
  const roles = new Map(finalists.map(n => [n, []]));
  for (const n of finalists) {
    if (r.hoh.includes(n)) roles.get(n).push("HOH");
    if (r.veto_winners.includes(n)) roles.get(n).push("held the veto");
    if (r.tally && r.tally.type === "sole_vote" && r.tally.by === n) roles.get(n).push("cast the sole vote");
    else if (v.votes.some(x => x.voter === n && x.vote === p.name)) roles.get(n).push("voted to evict");
  }
  return { label, r, roles };
}

async function showFinale(season) {
  setView("finale");
  currentSeason = season;
  $("finale-season-pick").innerHTML = seasonPickerHtml(season);
  const panel = $("finale-panel");
  if (!DETAILS) panel.innerHTML = `<div class="msg">Loading the finale…</div>`;
  let d;
  try { d = await loadDetails(); } catch (err) { panel.innerHTML = `<div class="msg">${errorHtml(err)}</div>`; return; }
  if (currentSeason !== season || currentView !== "finale") return;
  const f = (d.finales || {})[season];
  if (!f) { panel.innerHTML = `<div class="msg">The voting table for BB${season} has no Finale column yet.</div>`; return; }
  const w = weekRecord(season, f.week);
  const wd = d.weeks[`${season}|${f.week}`];
  const info = (d.seasons || {})[season] || {};
  const people = new Map(d.players.filter(p => p.season === season).map(p => [p.name, p]));
  const names = f.finalists.map(x => x.name);
  const jury = f.jury.map((j, i) => ({ ...j, n: i + 1, round: jurorRound(season, people.get(j.name), names) }));
  // The last round decided by one vote is the final HOH's eviction.
  const last = w ? [...w.rounds].reverse().find(r => r.tally && r.tally.type === "sole_vote") : null;
  const parts = ((wd && wd.fandom && wd.fandom.comps) || []).filter(c => /final hoh/i.test(c.outcome || ""))
    .sort((a, b) => dayNum(a.day) - dayNum(b.day));

  panel.innerHTML = `<div class="fin">`
    + finaleHeadHtml(season, f, info, last, people)
    + finalHohHtml(season, f, parts, last)
    + juryBoardHtml(season, f, jury)
    + juryTableHtml(season, f, jury)
    + (f.decided ? duelHtml(season, f, jury, parts, people) : "")
    + finaleAfhHtml(season, d, people)
    + (wd && wd.episodes.length ? `<h2>Finale week’s episodes</h2>${episodesHtml(wd)}` : "")
    + `<p class="src">Votes from Wikipedia’s voting table (<a href="${weekHash(season, f.week)}">${esc(f.week)}</a>); final HOH parts from the Big Brother Wiki.</p>`
    + `</div>`;
}

function finaleHeadHtml(season, f, info, last, people) {
  const portrait = n => ((people.get(n) || {}).fandom || {}).portrait || null;
  if (!f.decided) {
    const left = [...people.values()].filter(p => !p.result).map(p => p.name);
    const due = info.finale ? new Date(info.finale + "T12:00:00Z").toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric", timeZone: "UTC" }) : "";
    return `<div class="fin-head">${left.map(n => `<div class="fin-card">${faceHtml(season, n, "live", portrait(n))}${plink(season, n)}<span class="role">Still in the game</span></div>`).join("")}</div>`
      + `<p class="fin-lede">The finale hasn’t aired yet${due ? ` (due ${esc(due)})` : ""}. `
      + `${plural(f.jury.length, "juror")} so far; the rest of the jury is decided by the evictions still to come.</p>`;
  }
  const [a, b] = f.finalists.slice().sort((x, y) => y.votes - x.votes);
  const card = (x, role) => `<div class="fin-card${role === "Winner" ? " win" : ""}">`
    + faceHtml(season, x.name, role === "Winner" ? "won" : "", portrait(x.name)) + plink(season, x.name) + `<span class="role">${role}</span></div>`;
  const third = last ? last.evicted : null;
  const lede = `${plink(season, a.name)} beat ${plink(season, b.name)} ${a.votes}–${b.votes}`
    + (b.votes === 0 ? ", a unanimous jury vote" : "")
    + (info.prize ? `, and won ${esc(info.prize)}` : "") + "."
    + (third ? ` ${plink(season, third)} finished third, evicted by ${plink(season, last.hoh[0])} at the final three.` : "");
  return `<div class="fin-head">${card(a, "Winner")}<div class="fin-score" aria-label="${a.votes} votes to ${b.votes}">${a.votes}–${b.votes}</div>${card(b, "Runner-up")}</div>`
    + `<p class="fin-lede">${lede}</p>`;
}

function finalHohHtml(season, f, parts, last) {
  let html = `<h2>The final Head of Household</h2>`;
  if (!parts.length) {
    html += `<p class="muted">${f.decided ? "The Big Brother Wiki doesn’t list the final HOH’s parts." : "Not played yet."}</p>`;
  } else {
    html += `<div class="scroll"><table class="players comps"><thead><tr><th scope="col">Part</th><th scope="col" class="day">Day</th><th scope="col">Name</th>`
      + `<th scope="col">Format</th><th scope="col">Type</th><th scope="col">Won by</th></tr></thead><tbody>`
      + parts.map(c => `<tr><td>${esc((c.outcome.match(/part\s*\d+/i) || [c.type])[0].replace(/^p/, "P"))}</td><td class="day">${esc(c.day || "")}</td>`
        + `<td>${c.name ? `“${esc(c.name)}”` : `<span class="zero">–</span>`}</td>`
        + `<td>${c.format ? `<a class="plink" href="${compHash(c.format)}">${esc(c.format)}</a>` : `<span class="zero">–</span>`}</td>`
        + `<td>${c.category ? `<span class="cat">${esc(c.category)}</span>` : `<span class="zero">–</span>`}</td>`
        + `<td>${c.winners.map(x => plink(season, x)).join(" & ") || `<span class="zero">–</span>`}</td></tr>`).join("")
      + `</tbody></table></div>`;
  }
  if (last && f.decided) {
    const kept = last.nominees_final.filter(n => n !== last.evicted);
    html += `<p>${plink(season, last.hoh[0])} won the final HOH and cast the sole vote to evict ${plink(season, last.evicted)}`
      + (kept.length ? `, taking ${kept.map(n => plink(season, n)).join(" and ")} to the final two` : "") + `.`
      + ` ${plink(season, last.evicted)} became the last juror.</p>`;
  }
  return html;
}

function juryBoardHtml(season, f, jury) {
  const chip = j => `<li>${faceHtml(season, j.name)}${plink(season, j.name)}<small>#${j.n}</small></li>`;
  if (!f.decided) {
    return `<h2>The jury so far</h2><div class="board"><div class="board-col"><ul>${jury.map(chip).join("") || `<li class="none">No jurors yet.</li>`}</ul></div></div>`;
  }
  const cols = f.finalists.slice().sort((x, y) => y.votes - x.votes).map((x, i) => {
    const mine = jury.filter(j => j.vote === x.name);
    return `<div class="board-col${i === 0 ? " win" : ""}"><h3>${faceHtml(season, x.name)}${plink(season, x.name)}<span class="n">${x.votes}</span></h3>`
      + (mine.length ? `<ul>${mine.map(chip).join("")}</ul>` : `<p class="none">No jury votes.</p>`) + `</div>`;
  });
  return `<h2>The jury vote</h2><div class="board">${cols.join("")}</div>`;
}

function juryTableHtml(season, f, jury) {
  if (!jury.length) return "";
  const names = f.finalists.map(x => x.name);
  const rows = jury.map(j => {
    const at = j.round;
    const left = `${esc(j.left || "Left")}${j.day != null ? ` Day ${j.day}` : ""}`
      + (at ? ` · <a class="plink" href="${weekHash(season, at.label)}">${esc(at.label)}</a>` : "");
    const by = at ? `${at.r.hoh.map(n => plink(season, n)).join(" & ")}` : `<span class="zero">–</span>`;
    const part = at ? names.map(n => at.roles.get(n).length
        ? `${plink(season, n)}: ${at.roles.get(n).map(x => `<span class="tag">${esc(x)}</span>`).join("")}` : "").filter(Boolean).join("<br>")
      : "";
    return `<tr><td><div class="pl">${faceHtml(season, j.name, "out")}<span>${plink(season, j.name)}<small>Juror ${j.n}</small></span></div></td>`
      + `<td>${left}</td><td>${by}</td>`
      + (f.decided ? `<td class="why">${part || `<span class="zero">–</span>`}</td>`
        + `<td>${j.vote ? `<strong>${plink(season, j.vote)}</strong>` : `<span class="zero">–</span>`}</td>` : "") + `</tr>`;
  }).join("");
  return `<h2>Who the jurors were</h2><div class="scroll"><table class="players jury"><thead><tr><th scope="col">Juror</th><th scope="col">Left the game</th>`
    + `<th scope="col">HOH that week</th>`
    + (f.decided ? `<th scope="col">The finalists’ part in it</th><th scope="col">Voted for</th>` : "") + `</tr></thead><tbody>${rows}</tbody></table></div>`
    + (f.decided ? `<p class="src">From each juror’s eviction round: which of the final two was HOH, held the veto or voted them out.</p>` : "");
}

// The final two's games side by side.
function duelHtml(season, f, jury, parts, people) {
  const list = f.finalists.slice().sort((x, y) => y.votes - x.votes);
  const stats = list.map(x => {
    const p = people.get(x.name);
    const s = p ? playerStats(p) : {};
    return { ...s, parts: parts.filter(c => c.winners.includes(x.name)).length,
             hand: jury.filter(j => j.round && j.round.roles.get(x.name).some(r => r !== "held the veto")).length,
             votes: x.votes };
  });
  const row = (label, key) => `<tr><th scope="row">${esc(label)}</th>${stats.map(s => `<td>${s[key] != null ? s[key] : `<span class="zero">–</span>`}</td>`).join("")}</tr>`;
  return `<h2>The final two’s games</h2><div class="scroll"><table class="players duel"><thead><tr><th scope="col"></th>`
    + list.map(x => `<th scope="col">${plink(season, x.name)}</th>`).join("") + `</tr></thead><tbody>`
    + row("Jury votes", "votes") + row("HOH wins", "hoh") + row("Veto wins", "veto") + row("Final HOH parts won", "parts")
    + row("Times nominated", "noms") + row("On the block at the vote", "block") + row("Votes to evict them", "against")
    + row("Jurors they helped evict (HOH or vote)", "hand")
    + `</tbody></table></div>`;
}

// ---------- America’s Favorite HouseGuest: the viewers’ vote, every season ----------

// "Won", "Top 3" or "Runner-up" for a houseguest in their season's vote, else null.
function afhPlace(d, p) {
  const a = ((d || {}).afh || {})[p.season];
  if (!a) return null;
  if (a.winner === p.name) return `Won${a.prize ? ` (${a.prize})` : ""}`;
  return a.others.includes(p.name) ? (a.others_label === "Top 3" ? "Top 3" : "Runner-up in the vote") : null;
}
function afhTagHtml(d, p) {
  const place = afhPlace(d, p);
  if (!place) return "";
  const won = place.startsWith("Won");
  return ` <span class="tag${won ? " afh" : ""}" title="America’s Favorite HouseGuest${won ? "" : `: ${esc(place)}`}">${won ? "AFH" : `AFH ${esc(place.toLowerCase())}`}</span>`;
}

// Where the favorite's game ended: won, runner-up, a juror, or out before the jury.
function afhStanding(d, season, name) {
  const p = d.players.find(x => x.season === season && x.name === name);
  const f = (d.finales || {})[season];
  const juror = f ? f.jury.findIndex(j => j.name === name) : -1;
  if (!p) return { text: "", jury: false };
  if (/^winner/i.test(p.result || "")) return { text: "Also won the season", kind: "winner" };
  if (/^runner/i.test(p.result || "")) return { text: "Runner-up in the jury vote", kind: "final" };
  if (juror >= 0) return { text: `${p.result || "Evicted"} · Juror ${juror + 1} of ${f.jury.length}`, kind: "juror" };
  return { text: `${p.result || "Evicted"} · before the jury`, kind: "pre" };
}

// Who else placed: the whole top three, or the vote's runner-up.
function afhOthersHtml(season, a) {
  if (!a.others.length) return "";
  const top = a.others_label === "Top 3";
  const names = (top ? [a.winner, ...a.others] : a.others).filter(Boolean);
  return `<p class="voters">${top ? "Top 3 in the vote" : "Runner-up in the vote"}: ${names.map(n => plink(season, n)).join(", ")}</p>`;
}

function afhCardHtml(d, season, a) {
  const people = new Map(d.players.filter(p => p.season === season).map(p => [p.name, p]));
  const p = people.get(a.winner);
  const full = p ? playerBio(p).full_name : a.winner_text;
  const st = a.winner ? afhStanding(d, season, a.winner) : { text: "" };
  const name = a.winner ? plink(season, a.winner) : esc(a.winner_text);
  const face = a.winner ? faceHtml(season, a.winner, p ? faceState(p) : "", ((p || {}).fandom || {}).portrait || null) : "";
  const others = afhOthersHtml(season, a);
  const notes = a.notes.map(n => `<blockquote class="wnote">${esc(n.text)}<cite>${esc(n.where)} · Wikipedia</cite></blockquote>`).join("");
  return `<article class="afh-card won"><h2><a class="plink" href="#finale=${season}">BB${season}</a>${a.prize ? `<span class="n">${esc(a.prize)}</span>` : ""}</h2>`
    + `<div class="afh-who">${face}<span>${name}${full && full !== a.winner ? `<small>${esc(full)}</small>` : ""}${st.text ? `<small>${esc(st.text)}</small>` : ""}</span></div>`
    + others + notes + `</article>`;
}

// Patterns across the seasons: how far the favorites got.
function afhFactsHtml(d, seasons) {
  const st = seasons.map(s => afhStanding(d, s, d.afh[s].winner));
  const count = kind => st.filter(x => x.kind === kind).length;
  const bits = [
    plural(seasons.length, "season"),
    count("winner") && `${plural(count("winner"), "favorite")} also won the season`,
    count("final") && `${plural(count("final"), "favorite")} finished runner-up`,
    count("juror") && `${count("juror")} made the jury`,
    count("pre") && `${count("pre")} left before the jury`,
  ].filter(Boolean);
  const prizes = [...new Set(seasons.map(s => d.afh[s].prize).filter(Boolean).map(x => (x.match(/\$[\d,]+/) || [x])[0]))];
  return `<p class="season-info afh-facts">${esc(bits.join(" · "))}${prizes.length ? ` · prize ${esc(prizes.reverse().join(", then "))}` : ""}</p>`;
}

async function showAfh() {
  setView("afh");
  const panel = $("afh-panel");
  if (!DETAILS) panel.innerHTML = `<div class="msg">Loading…</div>`;
  let d;
  try { d = await loadDetails(); } catch (err) { panel.innerHTML = `<div class="msg">${errorHtml(err)}</div>`; return; }
  if (currentView !== "afh") return;
  const all = seasonList();
  const done = all.filter(s => (d.afh || {})[s]);
  const pending = all.filter(s => !(d.afh || {})[s]);
  panel.innerHTML = (done.length ? afhFactsHtml(d, done) : "")
    + `<div class="afh-list">`
    + pending.map(s => `<article class="afh-card"><h2><a class="plink" href="#finale=${s}">BB${s}</a></h2>`
      + `<p class="none">Not named yet: the favorite is announced at the finale.</p></article>`).join("")
    + done.map(s => afhCardHtml(d, s, d.afh[s])).join("")
    + `</div><p class="src" style="padding:0 16px 16px">The favorite from each season’s Wikipedia infobox, and the article’s own sentences about the vote; the prize from the Big Brother Wiki.</p>`;
}

// The Finale view's closing section: the viewers' own vote.
function finaleAfhHtml(season, d, people) {
  const a = (d.afh || {})[season];
  if (!a) return "";
  const st = a.winner ? afhStanding(d, season, a.winner) : { text: "" };
  const p = people.get(a.winner);
  return `<h2>America’s Favorite HouseGuest</h2>`
    + `<div class="afh-who">${a.winner ? faceHtml(season, a.winner, p ? faceState(p) : "") : ""}<span>${a.winner ? plink(season, a.winner) : esc(a.winner_text)}`
    + `<small>${esc([st.text, a.prize].filter(Boolean).join(" · "))}</small></span></div>`
    + afhOthersHtml(season, a)
    + (a.notes[0] ? `<blockquote class="wnote">${esc(a.notes[a.notes.length - 1].text)}<cite>${esc(a.notes[a.notes.length - 1].where)} · Wikipedia</cite></blockquote>` : "")
    + `<p><a class="plink" href="#afh">Every season’s favorite ›</a></p>`;
}

// ---------- Routing: #week=26/Week%2010 · #players=26 · #player=26/Angela · #comps=26 · #comp=The%20Wall · #finale=26 · #afh ----------

function route() {
  if (!DATA) return;
  const newest = seasonList()[0];
  const fm = location.hash.match(/^#comp=(.+)$/);
  if (fm) {
    if (currentView === "weeks" && !currentSeason) currentSeason = newest;
    return showFormat(decodeURIComponent(fm[1]));
  }
  if (location.hash === "#afh") { hideDrawer(); return showAfh(); }
  const m = location.hash.match(/^#(week|players|player|comps|finale)=(\d+)(?:\/(.*))?$/);
  if (!m) { setView("weeks"); hideDrawer(); return; }
  const kind = m[1], season = +m[2], rest = m[3] ? decodeURIComponent(m[3]) : null;
  if (kind === "week") {
    if (currentView === "weeks") setView("weeks");
    showWeek(season, rest);
  } else if (kind === "comps") {
    hideDrawer();
    showComps(season || newest);
  } else if (kind === "finale") {
    hideDrawer();
    showFinale(season || newest);
  } else if (kind === "players") {
    hideDrawer();
    showPlayers(season || newest);
  } else {
    // A player opened from the Comps, Finale or Fan favorite view keeps that view behind the drawer.
    if (!(["players", "comps", "finale"].includes(currentView) && currentSeason === season) && currentView !== "afh") showPlayers(season);
    showPlayer(season, rest);
  }
}

$("tab-weeks").addEventListener("click", () => { location.hash = ""; });
$("tab-players").addEventListener("click", () => { location.hash = `#players=${currentSeason || seasonList()[0]}`; });
$("tab-comps").addEventListener("click", () => { location.hash = `#comps=${currentSeason || seasonList()[0]}`; });
$("tab-finale").addEventListener("click", () => { location.hash = `#finale=${currentSeason || seasonList()[0]}`; });
$("tab-afh").addEventListener("click", () => { location.hash = "#afh"; });
wireSeasonPicker("season-pick", s => `#players=${s}`);
wireSeasonPicker("comps-season-pick", s => `#comps=${s}`);
wireSeasonPicker("finale-season-pick", s => `#finale=${s}`);
$("grid-mode").addEventListener("click", e => {
  const b = e.target.closest("button[data-mode]");
  if (!b || !DATA) return;
  gridMode = b.dataset.mode;
  try { localStorage.setItem("gridMode", gridMode); } catch (err) {}
  renderGrid(DATA);
});
$("faces-btn").addEventListener("click", () => {
  if (!DATA) return;
  showFaces = !showFaces;
  try { localStorage.setItem("faces", showFaces ? "on" : "off"); } catch (err) {}
  renderGrid(DATA);
});
$("drawer-close").addEventListener("click", closeDrawer);
$("scrim").addEventListener("click", closeDrawer);
document.addEventListener("keydown", e => {
  if ($("drawer").hidden) return;
  if (e.key === "Escape") closeDrawer();
  // ← / → step through a season's weeks while a week is open.
  const m = location.hash.match(/^#week=(\d+)\/(.*)$/);
  if (m && (e.key === "ArrowLeft" || e.key === "ArrowRight") && !e.altKey && !e.metaKey && !e.ctrlKey) {
    const n = weekNeighbors(+m[1], decodeURIComponent(m[2]))[e.key === "ArrowLeft" ? "prev" : "next"];
    if (n) { e.preventDefault(); location.hash = weekHash(n.season, n.week_label); }
  }
});
addEventListener("hashchange", route);

fetch("weeks.json")
  .then(r => { if (!r.ok) throw new Error(r.status + " " + r.statusText); return r.json(); })
  .then(data => {
    DATA = onlySeasons(data, seasonFilter(params.get("seasons")));
    if (!DATA.weeks.length) {
      document.getElementById("panel").innerHTML =
        `<div class="msg">No seasons match <code>?seasons=${esc(params.get("seasons"))}</code>. Try e.g. <code>?seasons=26-28</code>.</div>`;
      return;
    }
    render(DATA); route();
  })
  .catch(err => {
    document.getElementById("panel").innerHTML =
      `<div class="msg">Couldn’t load weeks.json (${esc(err.message)}). Run <code>python -m bbgrid build</code>, then serve this folder, e.g. <code>python -m http.server -d web</code>.</div>`;
  });
</script>
