<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big Brother Weeks</title>
<meta name="theme-color" content="#050a1a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eef1f7" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-title" content="BB Weeks">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root {
  color-scheme: light;
  --surface-0: #eef1f7;
  --surface-1: #ffffff;
  --cell: #e3e8f2;
  --cell-hover: #d2d9e8;
  --line: #d3d9e6;
  --text-primary: #0a1024;
  --text-secondary: #4b5572;
  --text-muted: #7a839c;
  --accent: #2563eb;
  --accent-text: #ffffff;
  --now: #0a1024;
  --warning: #fab219;
  --critical: #d03b3b;
  --tip-bg: #ffffff;
  --tip-shadow: 0 6px 24px rgba(10,16,36,.14);
  --good: #17784f;
  --gold: #f5b82e;
  --silver: #c9ced8;
  --bronze: #f08a24;
}
/* Dark: the navy "stock watch" board look. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface-0: #050a1a;
    --surface-1: #0a1128;
    --cell: #0e1733;
    --cell-hover: #1a2750;
    --line: #1c2748;
    --text-primary: #ffffff;
    --text-secondary: #a9b3cf;
    --text-muted: #6e7a9c;
    --accent: #2f6bff;
    --now: #8a96b8;
    --tip-bg: #101a38;
    --tip-shadow: 0 8px 32px rgba(0,0,0,.6);
    --good: #0f5c45;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-0: #050a1a;
  --surface-1: #0a1128;
  --cell: #0e1733;
  --cell-hover: #1a2750;
  --line: #1c2748;
  --text-primary: #ffffff;
  --text-secondary: #a9b3cf;
  --text-muted: #6e7a9c;
  --accent: #2f6bff;
  --now: #8a96b8;
  --tip-bg: #101a38;
  --tip-shadow: 0 8px 32px rgba(0,0,0,.6);
  --good: #0f5c45;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--surface-0); color: var(--text-primary);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
}
main { max-width: 1400px; margin: 0 auto; padding: 24px 16px 48px; }
.kicker { margin: 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); }
h1 { font-size: 22px; font-weight: 600; margin: 2px 0 6px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pill { font-size: 11px; font-weight: 700; line-height: 1; padding: 5px 8px; border-radius: 4px; background: var(--accent); color: var(--accent-text, #fff); letter-spacing: .02em; }
.sub { color: var(--text-secondary); margin: 0 0 16px; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; margin-bottom: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--text-secondary); font-size: 12px; }
.legend > span { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 18px; height: 14px; border-radius: 2px; background: var(--cell); border: 1px solid var(--line); display: inline-grid; }
.swatch.split { grid-template-rows: 1fr 1fr; gap: 1px; background: var(--line); }
.swatch.split i { background: var(--cell); }
.panel { background: var(--surface-1); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; }
table.grid { border-collapse: collapse; margin: 8px; width: calc(100% - 16px); }
.grid th { font-weight: 700; color: var(--text-secondary); font-size: 11px; padding: 8px 6px; white-space: nowrap; text-transform: uppercase; letter-spacing: .1em; }
.grid thead th { text-align: center; border-bottom: 1px solid var(--line); }
.grid thead th:first-child { text-align: left; padding-left: 12px; }
.grid tbody th { text-align: left; font-size: 13px; letter-spacing: .02em; color: var(--text-primary); padding: 0 12px; position: sticky; left: 0; background: var(--surface-1); z-index: 1; }
.grid thead th:first-child { position: sticky; left: 0; background: var(--surface-1); z-index: 1; }
.grid tbody tr + tr > * { border-top: 1px solid var(--line); }
.grid td + td, .grid th + td { border-left: 1px solid var(--line); }
.grid tbody th a { color: inherit; text-decoration: none; }
.grid tbody th a:hover { text-decoration: underline; }
.grid td { padding: 0; height: 1px; }
.grid td > .cell { height: 100%; }
/* The week currently airing gets an outlined column, like the broadcast board. */
.grid .now { position: relative; }
.grid thead th.now { color: var(--text-primary); }
.grid .now::after { content: ""; position: absolute; inset: 0; pointer-events: none; border: solid var(--now); border-width: 0 1px; }
.grid thead th.now::after { border-top-width: 1px; }
.grid tbody tr:last-child .now::after { border-bottom-width: 1px; }
.cell {
  display: grid; gap: 1px; width: 100%; min-width: 86px; min-height: 48px; padding: 0; border: 0;
  background: none; color: inherit; font: inherit; cursor: pointer; position: relative; text-align: center;
  -webkit-tap-highlight-color: transparent;
}
.cell .part {
  background: var(--cell); padding: 3px 6px; font-size: 13px; font-weight: 600;
  display: flex; align-items: center; justify-content: center; min-height: 23px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}
.cell.multi .part { font-size: 12px; }
.cell .part.wrap { white-space: normal; font-size: 12px; line-height: 1.15; }
.cell:not(.multi) .part { min-height: 48px; }
.cell:hover .part, .cell:focus-visible .part { background: var(--cell-hover); }
.cell:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.cell .empty { color: var(--text-muted); font-weight: 400; }
/* A folded corner marks a week that isn't fully modeled (note) or failed a check (error). */
.flag { position: absolute; top: 0; right: 0; width: 0; height: 0; border-style: solid; border-width: 0 10px 10px 0; border-color: transparent var(--warning) transparent transparent; }
.flag.error { border-right-color: var(--critical); }
.legend .flag-swatch { position: relative; width: 18px; height: 14px; border-radius: 2px; background: var(--cell); border: 1px solid var(--line); overflow: hidden; display: inline-block; }
.legend .flag-swatch .flag { border-width: 0 8px 8px 0; }
#tip {
  position: fixed; z-index: 10; max-width: min(380px, calc(100vw - 32px)); pointer-events: none;
  background: var(--tip-bg); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--tip-shadow);
  padding: 10px 12px; font-size: 13px; display: none;
}
#tip h3 { margin: 0 0 2px; font-size: 14px; }
#tip .status { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
#tip .round + .round { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 8px; }
#tip .round h4 { margin: 0 0 4px; font-size: 12px; font-weight: 600; color: var(--text-secondary); }
#tip dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; }
#tip dt { color: var(--text-secondary); }
#tip dd { margin: 0; }
#tip dt.result, #tip dd.result { margin-top: 6px; }
#tip .raw { margin-top: 8px; font-size: 12px; max-height: 260px; overflow: auto; }
#tip .raw table { border-collapse: collapse; }
#tip .raw td { border-top: 1px solid var(--line); padding: 2px 6px 2px 0; vertical-align: top; white-space: pre-line; }
#tip .raw td:first-child { color: var(--text-secondary); }
#tip .fn { margin-top: 6px; color: var(--text-muted); font-size: 12px; }
.msg { padding: 24px; color: var(--text-secondary); }
footer { margin-top: 16px; color: var(--text-muted); font-size: 12px; line-height: 1.7; }
footer p { margin: 0; }
footer a { color: var(--text-secondary); white-space: nowrap; }
/* ?embed=1: drop the page's own title and intro so a host page can supply its own. */
.embed main { padding-top: 8px; }
.embed .kicker, .embed h1, .embed .sub { display: none; }
/* View tabs */
.toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.tabs { display: inline-flex; gap: 2px; padding: 3px; background: var(--cell); border: 1px solid var(--line); border-radius: 8px; }
.tabs button {
  border: 0; background: none; color: var(--text-secondary); font: inherit; font-weight: 600;
  padding: 6px 14px; border-radius: 6px; cursor: pointer;
}
/* Phones: the tabs scroll sideways rather than overflow the page. */
@media (max-width: 480px) { .tabs { max-width: 100%; overflow-x: auto; } .tabs button { flex: none; } }
.tabs button:hover { color: var(--text-primary); }
.tabs button[aria-selected="true"] { background: var(--accent); color: #fff; }
.tabs button:focus-visible, #drawer-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
/* Details drawer: a side panel, or a bottom sheet on phones */
#scrim { position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 20; }
#drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100vw); z-index: 21;
  display: flex; flex-direction: column; background: var(--surface-1);
  border-left: 1px solid var(--line); box-shadow: -8px 0 32px rgba(0,0,0,.18);
}
@media (max-width: 640px) {
  #drawer { top: auto; left: 0; width: auto; height: 88vh; border-left: 0; border-top: 1px solid var(--line); border-radius: 14px 14px 0 0; }
}
[hidden] { display: none !important; }
.drawer-head { display: flex; align-items: flex-start; gap: 8px; padding: 16px 16px 10px; border-bottom: 1px solid var(--line); }
.drawer-head h2 { margin: 0; font-size: 18px; flex: 1; }
.drawer-head .status { color: var(--text-secondary); font-size: 13px; font-weight: 400; margin-top: 2px; }
#drawer-close { flex: none; border: 0; background: var(--cell); color: var(--text-primary); width: 32px; height: 32px; border-radius: 8px; font-size: 18px; cursor: pointer; }
#drawer-body { overflow: auto; padding: 4px 16px 32px; font-size: 14px; }
#drawer-body h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-primary); margin: 20px 0 8px; padding-top: 14px; border-top: 1px solid var(--line); }
#drawer-body h4 { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin: 12px 0 4px; }
#drawer-body dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; }
#drawer-body dt { color: var(--text-secondary); }
#drawer-body dd { margin: 0; }
#drawer-body dt.result, #drawer-body dd.result { margin-top: 8px; }
.round + .round { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 10px; }
.muted { color: var(--text-muted); }
a.plink { color: inherit; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 2px; }
a.plink:hover { text-decoration-color: currentColor; }
dl.votes { grid-template-columns: minmax(90px, max-content) 1fr !important; row-gap: 6px !important; }
dl.votes dt { color: var(--text-primary) !important; }
.voters { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.src { font-size: 12px; color: var(--text-muted); margin: 8px 0 0; }
.src a { color: inherit; }
.tag { display: inline-block; font-size: 11px; line-height: 16px; border: 1px solid var(--line); border-radius: 8px; padding: 0 6px; margin-left: 6px; color: var(--text-secondary); font-weight: 400; }
ul.plain { margin: 0; padding-left: 18px; }
ul.plain li { margin: 3px 0; }
blockquote.wnote { margin: 8px 0; padding: 8px 10px; border-left: 3px solid var(--line); background: var(--surface-0); border-radius: 0 6px 6px 0; font-size: 13px; }
blockquote.wnote cite { display: block; font-style: normal; color: var(--text-muted); font-size: 11px; margin-top: 4px; }
.ep { border-top: 1px solid var(--line); padding: 8px 0; }
h3 + .ep { border-top: 0; padding-top: 0; }
.ep summary { cursor: pointer; }
.ep-meta { color: var(--text-secondary); font-size: 12px; }
.ep p { margin: 8px 0 0; font-size: 13px; line-height: 1.5; }
.ep p + p { margin-top: 10px; }
/* Players view */
table.players { border-collapse: collapse; font-size: 13px; min-width: 100%; }
table.players th, table.players td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
table.players th { color: var(--text-secondary); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
table.players th:first-child, table.players td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface-1); }
table.players td.result { text-align: left; color: var(--text-secondary); }
table.players tr:last-child td { border-bottom: 0; }
table.players .grp th { font-size: 10px; font-weight: 600; color: var(--text-muted); padding-bottom: 0; border-bottom: 0; text-align: center; }
table.players .gs { border-left: 1px solid var(--line); }
/* Who they are (age, hometown, job) reads apart from the game stats. */
table.players td.bio { color: var(--text-secondary); text-align: left; }
table.players td.bio.num { text-align: right; }
table.players th.bio { text-align: left; }
table.players th abbr { text-decoration: none; cursor: help; }
table.comps th, table.comps td, table.jury th, table.jury td { text-align: left; }
table.comps th.day, table.comps td.day { text-align: right; color: var(--text-secondary); }
.cat { font-size: 11px; border-radius: 8px; padding: 1px 7px; background: var(--cell); color: var(--text-secondary); white-space: nowrap; }
.cat-bar { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 10px 12px 4px; font-size: 13px; color: var(--text-secondary); }
.cat-bar b { color: var(--text-primary); font-variant-numeric: tabular-nums; }
table.plays { border-collapse: collapse; width: 100%; font-size: 13px; }
table.plays th { text-align: left; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); padding: 4px 8px 4px 0; border-bottom: 1px solid var(--line); }
table.plays td { padding: 5px 8px 5px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
table.plays td.n { font-variant-numeric: tabular-nums; color: var(--text-secondary); }
table.plays tr:last-child td { border-bottom: 0; }
.pager { display: flex; justify-content: space-between; gap: 8px; margin: 12px 0 4px; }
.pager a, .pager span { font-size: 13px; font-weight: 600; padding: 5px 10px; border-radius: 6px; background: var(--cell); color: var(--text-primary); text-decoration: none; }
.pager a:hover { background: var(--cell-hover); }
.pager a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.pager span { visibility: hidden; }
.seg { display: inline-flex; gap: 2px; padding: 2px; max-width: 100%; overflow-x: auto; background: var(--cell); border: 1px solid var(--line); border-radius: 7px; font-size: 13px; }
.seg button { flex: none; border: 0; background: none; color: var(--text-secondary); font: inherit; font-weight: 600; padding: 4px 12px; border-radius: 5px; cursor: pointer; }
.seg button:hover { color: var(--text-primary); }
.seg button[aria-pressed="true"] { background: var(--surface-1); color: var(--text-primary); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.seg select { border: 0; background: var(--surface-1); color: var(--text-primary); font: inherit; font-weight: 600; padding: 4px 8px; border-radius: 5px; cursor: pointer; }
.seg select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.zero { color: var(--text-muted); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
.stat { background: var(--surface-0); border-radius: 8px; padding: 8px 10px; }
.stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--text-secondary); }
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { display: grid; grid-template-columns: 116px 1fr; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); }
.timeline li > a, .timeline li > span:first-child { color: var(--text-secondary); font-size: 12px; padding-top: 1px; }
.season-info { margin: 10px 12px 4px; color: var(--text-secondary); font-size: 13px; }
.season-info a { color: inherit; }
dl.bio { margin-top: 12px !important; }
.voters a { color: var(--text-secondary); }
/* Houseguest photos: the Big Brother Wiki's 4:5 headshots. Initials stand in when there's none. */
.face {
  flex: none; display: inline-grid; place-items: center; width: 36px; aspect-ratio: 4 / 5; border-radius: 6px;
  object-fit: cover; object-position: 50% 15%; background: var(--cell-hover); color: var(--text-secondary);
  font-size: 12px; font-weight: 700; line-height: 1; overflow: hidden; vertical-align: middle;
}
.face.out { filter: grayscale(1); opacity: .75; }
.face.live { box-shadow: 0 0 0 2px var(--accent); }
.face.won { box-shadow: 0 0 0 2px var(--gold); }
.cell .part.faces { flex-direction: column; gap: 4px; padding: 6px 4px; }
.cell .part .who { display: flex; gap: 3px; justify-content: center; }
.cell .part .face { width: 34px; }
.cell .part.wrap .who .face { width: 28px; }
.cell .part .nm { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.cell.multi .part.faces { flex-direction: row; gap: 5px; padding: 3px 5px; justify-content: flex-start; }
.cell:has(.faces) { min-width: 92px; }
.cell.multi .part .face, .cell.multi .part.wrap .who .face { width: 20px; border-radius: 4px; }
.cell .part.faces.wrap .nm { white-space: normal; }
.pl { display: flex; align-items: center; gap: 10px; }
.pl .face { width: 32px; }
.pl small { display: block; color: var(--text-muted); font-size: 11px; }
.leaders { margin: 12px 12px 4px; }
.leaders h2 { margin: 0 0 8px; text-align: center; font-size: 11px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--text-secondary); }
.leaders ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(150px, 1fr)); gap: 10px; }
.leaders li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-0); }
.leaders li:nth-child(1) { border-color: var(--gold); }
.leaders li:nth-child(2) { border-color: var(--silver); }
.leaders li:nth-child(3) { border-color: var(--bronze); }
.leaders .rank { flex: none; width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-size: 12px; font-weight: 800; background: var(--cell); color: var(--text-secondary); }
.leaders li:nth-child(1) .rank { background: var(--gold); color: #1a1200; }
.leaders li:nth-child(2) .rank { background: var(--silver); color: #111; }
.leaders li:nth-child(3) .rank { background: var(--bronze); color: #1a0c00; }
.leaders .face { width: 36px; }
.leaders .who { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
.leaders .who > * { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.leaders .who a { font-weight: 700; }
.leaders .who span { font-size: 11px; color: var(--text-secondary); }
.leaders .n { flex: none; font-size: 17px; font-weight: 800; padding: 4px 9px; border-radius: 6px; background: var(--good); color: #fff; font-variant-numeric: tabular-nums; }
@media (max-width: 900px) { .leaders ol { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 230px; overflow-x: auto; padding-bottom: 4px; } }
/* Phones: the pinned name column stays narrow enough to leave room for the numbers. */
@media (max-width: 640px) { .pl small { display: none; } .pl { gap: 8px; } .pl .face { width: 26px; } }
.bio-head { display: flex; gap: 16px; align-items: flex-start; margin-top: 12px; }
.bio-head > .face { width: 104px; border-radius: 10px; font-size: 28px; }
.bio-head dl.bio { margin-top: 0 !important; flex: 1; min-width: 0; }
@media (max-width: 400px) { .bio-head > .face { width: 84px; } }
dl.votes dt { display: flex; align-items: center; gap: 8px; }
dl.votes dt .face { width: 24px; border-radius: 4px; font-size: 10px; }
/* Finale view */
.fin { padding: 4px 16px 20px; }
.fin h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin: 22px 0 10px; padding-top: 14px; border-top: 1px solid var(--line); }
.fin-head { display: flex; align-items: center; justify-content: center; gap: 12px 32px; flex-wrap: wrap; padding: 18px 0 4px; }
.fin-card { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; min-width: 120px; }
.fin-card .face { width: 96px; border-radius: 10px; font-size: 26px; }
.fin-card a { font-size: 16px; font-weight: 700; }
.fin-card .role { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--text-muted); }
.fin-card.win .role { color: var(--text-primary); }
.fin-score { font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; }
.fin-lede { text-align: center; color: var(--text-secondary); margin: 8px auto 0; font-size: 15px; max-width: 640px; }
.board { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.board-col { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 12px; background: var(--surface-0); }
.board-col.win { border-color: var(--gold); }
.board-col h3 { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; font-size: 15px; }
.board-col h3 .face { width: 32px; }
.board-col h3 .n { margin-left: auto; font-size: 17px; font-weight: 800; padding: 3px 9px; border-radius: 6px; background: var(--cell); font-variant-numeric: tabular-nums; }
.board-col.win h3 .n { background: var(--good); color: #fff; }
.board-col ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.board-col li { display: flex; align-items: center; gap: 6px; font-size: 13px; background: var(--surface-1); border: 1px solid var(--line); border-radius: 8px; padding: 4px 9px 4px 4px; }
.board-col li .face { width: 26px; border-radius: 4px; font-size: 10px; }
.board-col li small { color: var(--text-muted); font-size: 11px; }
.board-col .none { color: var(--text-muted); font-size: 13px; }
table.jury td { vertical-align: middle; }
table.jury td.why { white-space: normal; min-width: 180px; }
table.jury .tag { margin: 0 4px 0 0; }
table.duel th[scope="row"] { text-align: left; font-size: 13px; font-weight: 400; color: var(--text-secondary); text-transform: none; letter-spacing: 0; position: sticky; left: 0; background: var(--surface-1); }
table.duel tr:last-child th { border-bottom: 0; }
.fin .scroll { overflow-x: auto; }
@media (max-width: 640px) {
  .fin { padding: 4px 12px 16px; }
  .fin-head { flex-wrap: nowrap; gap: 12px; }
  .fin-card { min-width: 0; }
  .fin-card .face { width: 72px; }
  .fin-score { font-size: 30px; }
}
table.duel thead th { text-align: right; font-size: 13px; color: var(--text-primary); text-transform: none; letter-spacing: 0; }
/* America's Favorite HouseGuest */
.tag.afh { border-color: var(--gold); color: var(--text-primary); }
.afh-facts { margin: 4px 16px 0; }
.afh-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; padding: 12px 16px 20px; }
.afh-card { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px 14px; background: var(--surface-0); min-width: 0; }
.afh-card.won { border-color: var(--gold); }
.afh-card h2 { display: flex; align-items: baseline; gap: 8px; margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
.afh-card h2 .n { margin-left: auto; font-size: 13px; letter-spacing: 0; text-transform: none; font-weight: 700; }
.afh-who { display: flex; gap: 12px; align-items: center; }
.afh-who .face { width: 72px; border-radius: 10px; font-size: 22px; flex: none; align-content: center; }
.afh-who > span:not(.face) { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.afh-who a { font-size: 17px; font-weight: 700; }
.afh-who small { color: var(--text-secondary); font-size: 12px; }
.afh-card .voters { margin-top: 10px; }
.afh-card blockquote.wnote { margin-top: 10px; background: var(--surface-1); }
.afh-card .none { color: var(--text-muted); font-size: 14px; margin: 0; }
@media (max-width: 640px) { .afh-list { padding: 10px 12px 16px; grid-template-columns: none; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<main>
  <p class="kicker" id="kicker">Big Brother US</p>
  <h1><span id="view-title">Week by week</span> <span class="pill" id="now-pill" hidden></span></h1>
  <p class="sub" id="view-sub">Who was evicted each week, or who was HOH. Click or tap a week for the full story.</p>
  <div class="toolbar">
    <div class="tabs" role="tablist" aria-label="View">
      <button role="tab" id="tab-weeks" aria-selected="true" aria-controls="weeks-view">Weeks</button>
      <button role="tab" id="tab-players" aria-selected="false" aria-controls="players-view">Players</button>
      <button role="tab" id="tab-comps" aria-selected="false" aria-controls="comps-view">Comps</button>
      <button role="tab" id="tab-finale" aria-selected="false" aria-controls="finale-view">Finale</button>
      <button role="tab" id="tab-afh" aria-selected="false" aria-controls="afh-view" title="America’s Favorite HouseGuest">Favorite</button>
    </div>
  </div>
  <section id="weeks-view" role="tabpanel" aria-labelledby="tab-weeks">
  <div class="controls">
    <span class="seg" role="group" aria-label="Show in each week" id="grid-mode">
      <button data-mode="evicted" aria-pressed="true">Evicted</button>
      <button data-mode="hoh" aria-pressed="false">HOH</button>
    </span>
    <span class="seg" role="group" aria-label="Photos"><button id="faces-btn" aria-pressed="true">Photos</button></span>
    <span class="legend" aria-hidden="true">
      <span><i class="swatch split"><i></i><i></i></i> Two rounds</span>
      <span><i class="flag-swatch"><i class="flag"></i></i> Twist week (not fully modeled)</span>
      <span id="legend-error" hidden><i class="flag-swatch"><i class="flag error"></i></i> Failed a check</span>
    </span>
  </div>
  <div class="panel" id="panel"><div class="msg">Loading weeks.json…</div></div>
  </section>
  <section id="players-view" role="tabpanel" aria-labelledby="tab-players" hidden>
    <div class="controls"><span class="seg" id="season-pick" role="group" aria-label="Season"></span></div>
    <div class="panel" id="players-panel"></div>
  </section>
  <section id="comps-view" role="tabpanel" aria-labelledby="tab-comps" hidden>
    <div class="controls"><span class="seg" id="comps-season-pick" role="group" aria-label="Season"></span></div>
    <div class="panel" id="comps-panel"></div>
  </section>
  <section id="finale-view" role="tabpanel" aria-labelledby="tab-finale" hidden>
    <div class="controls"><span class="seg" id="finale-season-pick" role="group" aria-label="Season"></span></div>
    <div class="panel" id="finale-panel"></div>
  </section>
  <section id="afh-view" role="tabpanel" aria-labelledby="tab-afh" hidden>
    <div class="panel" id="afh-panel"></div>
  </section>
  <footer id="footer"></footer>
</main>
<div id="tip" role="tooltip"></div>
<div id="scrim" hidden></div>
<aside id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
  <div class="drawer-head">
    <div style="flex:1"><h2 id="drawer-title"></h2><div class="status" id="drawer-status"></div></div>
    <button id="drawer-close" aria-label="Close details">×</button>
  </div>
  <div id="drawer-body"></div>
</aside>
<script>
const params = new URLSearchParams(location.search);
if (params.has("embed")) document.documentElement.classList.add("embed");
// ?theme=dark or ?theme=light pins the look, e.g. to match a host page.
if (["dark", "light"].includes(params.get("theme"))) document.documentElement.dataset.theme = params.get("theme");
// ?seasons=26-28 (or 21,26 or 21-23,28) shows only those seasons, e.g. to keep an embed short.
function seasonFilter(text) {
  if (!text) return null;
  const want = new Set();
  for (const part of text.split(",")) {
    const m = part.trim().match(/^(\d+)(?:-(\d+))?$/);
    if (m) for (let n = +m[1]; n <= +(m[2] || m[1]); n++) want.add(n);
  }
  return want.size ? want : null;
}
function onlySeasons(data, want) {
  if (!want) return data;
  const keep = s => want.has(+s);
  return { ...data,
    weeks: data.weeks.filter(w => keep(w.season)),
    sources: (data.sources || []).filter(s => keep(s.season)),
    photos: Object.fromEntries(Object.entries(data.photos || {}).filter(([s]) => keep(s))) };
}

const FIELDS = [
  ["hoh", "HOH"],
  ["nominees_initial", "Noms"],
  ["veto_winners", "Veto"],
  ["nominees_final", "Final noms"],
];

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// "9–3": votes to evict against votes to keep.
function tallyText(t) {
  if (!t) return "";
  if (t.type === "vote") return `${t.votes_to_evict}–${t.votes_cast - t.votes_to_evict}`;
  if (t.type === "sole_vote") return `${t.by}’s choice to evict`;
  return "";
}

const nkey = s => String(s).replace(/\s+/g, " ").trim().toLowerCase();

// ---------- Houseguest photos: the Big Brother Wiki's headshots (weeks.json "photos") ----------

const initials = name => String(name).split(/\s+/).map(w => (w.match(/[A-Za-z]/) || [""])[0]).join("").slice(0, 2).toUpperCase();
// The wiki resizes on request: .../revision/latest/scale-to-width-down/80?cb=...
const sized = (url, w) => url.replace(/\/revision\/latest(?=\?|$)/, `/revision/latest/scale-to-width-down/${w}`);
const photoOf = (season, name) => (((DATA && DATA.photos) || {})[season] || {})[name] || null;

// An <img> of a houseguest's headshot, or their initials when there's none. The
// name always sits next to it, so the picture itself is decorative (alt="").
// large: a bigger portrait to try first, falling back to the headshot.
function faceHtml(season, name, cls = "", large = null) {
  const small = photoOf(season, name);
  const ini = esc(initials(name));
  if (!small && !large) return `<span class="face ${cls}" aria-hidden="true">${ini}</span>`;
  const src = large ? sized(large, 240) : sized(small, 80);
  const fallback = large && small ? ` data-fallback="${esc(sized(small, 80))}"` : "";
  return `<img class="face ${cls}" src="${esc(src)}"${fallback} alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" data-ini="${ini}">`;
}

// A picture that fails to load becomes the next one down, then initials.
document.addEventListener("error", e => {
  const img = e.target;
  if (!(img instanceof HTMLImageElement) || !img.classList.contains("face")) return;
  if (img.dataset.fallback) { img.src = img.dataset.fallback; delete img.dataset.fallback; return; }
  const span = document.createElement("span");
  span.className = img.className;
  span.setAttribute("aria-hidden", "true");
  span.textContent = img.dataset.ini || "";
  img.replaceWith(span);
}, true);

// Out of the game: grey. Still playing: an accent ring. The winner: a gold ring.
const faceState = p => !p.result ? "live" : /^winner/i.test(p.result) ? "won" : /^runner/i.test(p.result) ? "" : "out";

// What the veto did, from the nominations before and after it (like details.py's veto_use).
function vetoUse(r) {
  if (!r.veto_winners.length || !r.nominees_initial.length || !r.nominees_final.length) return null;
  const finals = new Set(r.nominees_final.map(nkey)), initial = new Set(r.nominees_initial.map(nkey));
  const twist = new Set(Object.values(r.extras || {}).flat().map(nkey));
  const removed = r.nominees_initial.filter(n => !finals.has(nkey(n)));
  const on = removed.filter(n => !twist.has(nkey(n)));
  return { used: on.length > 0, on, replacements: r.nominees_final.filter(n => !initial.has(nkey(n))) };
}

// "used" or "not used"; the Veto section has the details.
function vetoBrief(r) {
  const u = vetoUse(r);
  return u ? (u.used ? "used" : "not used") : "";
}

// Twist row labels without Wikipedia's " winner": "Block Buster", "AI Arena".
const extraLabel = label => label.replace(/\s+winners?$/i, "");

function roundHtml(r, label) {
  const row = (name, names, extra) => `<dt>${esc(name)}</dt><dd>${esc(names.join(", "))}${extra || ""}</dd>`;
  const rows = [];
  for (const [k, name] of FIELDS) {
    // Twist rows (AI Arena, Block Buster, …) go before Final noms: they can take someone off the block.
    if (k === "nominees_final") for (const [label, v] of Object.entries(r.extras || {})) rows.push(row(extraLabel(label), v));
    const brief = k === "veto_winners" ? vetoBrief(r) : "";
    if (r[k] && r[k].length) rows.push(row(name, r[k], brief ? ` <span class="muted">· ${esc(brief)}</span>` : ""));
  }
  if (r.evicted) rows.push(`<dt class="result">Evicted</dt><dd class="result"><strong>${esc(r.evicted)}</strong>${r.tally ? ` <span class="muted">${esc(tallyText(r.tally))}</span>` : ""}</dd>`);
  return `<div class="round">${label ? `<h4>${esc(label)}</h4>` : ""}<dl>${rows.join("")}</dl></div>`;
}

const roundLabel = (w, i) => w.rounds.length > 1
  ? `Round ${i + 1}${w.rounds[i].sub_label ? " · " + w.rounds[i].sub_label : ""}${w.rounds[i].double_eviction ? " · Double eviction" : ""}` : "";

function rawHtml(raw) {
  if (!raw) return "";
  const head = raw.columns.length > 1 ? `<tr><td></td>${raw.columns.map(c => `<td><strong>${esc(c)}</strong></td>`).join("")}</tr>` : "";
  const body = raw.rows.map(r => `<tr><td>${esc(r.label)}</td>${r.cells.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("");
  return `<div class="raw"><h4>Table text for this week</h4><table>${head}${body}</table></div>`;
}

function tipHtml(w) {
  const status = w.status === "ok" ? (w.note || "") : `${w.status === "error" ? "Error" : "Note"}: ${w.note || ""}`;
  return `<h3>BB${w.season} · ${esc(w.week_label)}</h3>`
    + (status ? `<div class="status">${esc(status)}</div>` : "")
    + w.rounds.map((r, i) => roundHtml(r, roundLabel(w, i))).join("")
    + (w.status !== "ok" ? rawHtml(w.raw) : "");
}

function cellLabel(w) {
  const names = w.rounds.map(r => r.evicted).filter(Boolean);
  const hohs = w.rounds.map(r => r.hoh.join(" & ")).filter(Boolean);
  return `BB${w.season} ${w.week_label}: `
    + (gridMode === "hoh" ? (hohs.length ? `HOH ${hohs.join(", then ")}` : "no modeled HOH")
       : (names.length ? `evicted ${names.join(" and ")}` : "no modeled eviction"))
    + (w.status !== "ok" ? `, ${w.status}` : "");
}

// What each grid cell shows: who was evicted (default) or whose HOH week it was.
let gridMode = "evicted";
try { if (localStorage.getItem("gridMode") === "hoh") gridMode = "hoh"; } catch (e) {}

// Grid cells show a face above each name unless photos are switched off.
let showFaces = true;
try { if (localStorage.getItem("faces") === "off") showFaces = false; } catch (e) {}

function partHtml(r, season) {
  const text = gridMode === "hoh" ? r.hoh.join(" & ") : r.evicted;
  const names = gridMode === "hoh" ? r.hoh : (r.evicted ? [r.evicted] : []);
  // Co-HOHs wrap onto two lines rather than being cut off.
  const wrap = gridMode === "hoh" && r.hoh.length > 1 ? " wrap" : "";
  if (showFaces && names.length) {
    return `<span class="part faces${wrap}"><span class="who">${names.map(n => faceHtml(season, n)).join("")}</span>`
      + `<span class="nm">${esc(text)}</span></span>`;
  }
  return `<span class="part${wrap}">` + esc(text || "—") + `</span>`;
}

function render(data) {
  renderGrid(data);
  renderFooter(data);
  wireTooltip(data.weeks);
}

function renderGrid(data) {
  const weeks = data.weeks;
  // Newest season first, so the season currently airing is on top.
  const seasons = [...new Set(weeks.map(w => w.season))].sort((a, b) => b - a);
  // Columns keyed by week label as Wikipedia shows it; numbered weeks first, in order.
  const labels = [];
  for (const w of [...weeks].sort((a, b) => (a.week ?? 1e9) - (b.week ?? 1e9))) {
    if (!labels.includes(w.week_label)) labels.push(w.week_label);
  }
  const bySeason = new Map(seasons.map(s => [s, new Map()]));
  weeks.forEach(w => bySeason.get(w.season).set(w.week_label, w));
  const source = new Map((data.sources || []).map(s => [s.season, s]));
  // The newest season's latest week is the one "now" airing.
  const latest = weeks.filter(w => w.season === seasons[0]).reduce((a, w) => (w.week ?? -1) > (a.week ?? -1) ? w : a);
  const nowLabel = latest.week_label;
  const now = l => l === nowLabel ? ` class="now"` : "";
  document.getElementById("kicker").textContent = `Big Brother US · Seasons ${seasons[seasons.length - 1]}–${seasons[0]}`;
  const pill = document.getElementById("now-pill");
  pill.textContent = `BB${seasons[0]} · ${nowLabel}`;
  pill.hidden = false;

  let html = `<table class="grid"><thead><tr><th scope="col">Season</th>${labels.map(l => `<th scope="col"${now(l)}>${esc(l.replace(/^Week\s*/i, "Wk "))}</th>`).join("")}</tr></thead><tbody>`;
  for (const s of seasons) {
    const src = source.get(s);
    html += `<tr><th scope="row">${src ? `<a href="${esc(src.url)}" target="_blank" rel="noopener">BB${s}</a>` : `BB${s}`}</th>`;
    for (const l of labels) {
      const w = bySeason.get(s).get(l);
      if (!w) { html += `<td${now(l)}></td>`; continue; }
      const idx = weeks.indexOf(w);
      const parts = w.rounds.length
        ? w.rounds.map(r => partHtml(r, s)).join("")
        : `<span class="part empty">—</span>`;
      const badge = w.status === "ok" ? "" : `<i class="flag ${w.status}" aria-hidden="true"></i>`;
      html += `<td${now(l)}><button class="cell${w.rounds.length > 1 ? " multi" : ""}" data-i="${idx}" aria-label="${esc(cellLabel(w))}">${parts}${badge}</button></td>`;
    }
    html += "</tr>";
  }
  html += "</tbody></table>";
  document.getElementById("panel").innerHTML = html;
  document.getElementById("legend-error").hidden = !weeks.some(w => w.status === "error");
  document.querySelectorAll("#grid-mode button").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === gridMode));
  $("faces-btn").setAttribute("aria-pressed", showFaces);
}

function renderFooter(data) {
  // Sources: each season's article on both wikis, linked to the revision used.
  const missing = (data.sources || []).filter(s => s.error).map(s => `BB${s.season} (${esc(s.error)})`);
  const links = (list, pick) => [...list].sort((a, b) => a.season - b.season)
    .map(s => `<a href="${esc(pick(s))}" title="BB${s.season}">${s.season}</a>`).join(" ");
  const sources = data.sources || [];
  document.getElementById("footer").innerHTML =
    `<p>Wikipedia, seasons ${links(sources.filter(s => !s.error), s => s.permalink || s.url)} `
    + `· <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a></p>`
    + `<p><a href="https://bigbrother.fandom.com/">Big Brother Wiki</a>, seasons ${links(sources.filter(s => s.fandom), s => s.fandom.permalink || s.fandom.url) || "(not fetched yet)"} `
    + `· <a href="https://creativecommons.org/licenses/by-sa/3.0/">CC BY-SA 3.0</a></p>`
    + (data.photos ? `<p>Houseguest photos: CBS, via the Big Brother Wiki</p>` : "")
    + `<p>Rearranged and summarized from these pages; this page’s data is CC BY-SA 4.0. `
    + `Not affiliated with CBS or the makers of Big Brother.</p>`
    + `<p>Updated ${esc((data.generated_at || "").slice(0, 10))}${missing.length ? ` · Missing: ${missing.join(", ")}` : ""}</p>`;
}

function wireTooltip(weeks) {
  const tip = document.getElementById("tip");
  const show = (btn, x, y) => {
    tip.innerHTML = tipHtml(weeks[+btn.dataset.i]);
    tip.style.display = "block";
    const r = btn.getBoundingClientRect();
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let left, top;
    if (x != null) {
      // Mouse: follow the pointer, flipping left/up at the viewport edges.
      left = x + 12; top = y + 12;
      if (left + tw > innerWidth - 8) left = Math.max(8, x - tw - 12);
      if (top + th > innerHeight - 8) top = Math.max(8, innerHeight - th - 8);
    } else {
      // Keyboard focus: sit below the cell (above if no room) so it stays visible.
      left = Math.min(Math.max(8, r.left), innerWidth - tw - 8);
      top = r.bottom + 6;
      if (top + th > innerHeight - 8) top = r.top - th - 6;
      if (top < 8) top = Math.max(8, innerHeight - th - 8);
    }
    tip.style.left = left + "px"; tip.style.top = top + "px";
  };
  const hide = () => { tip.style.display = "none"; };
  const panel = document.getElementById("panel");
  const drawerOpen = () => !document.getElementById("drawer").hidden;
  panel.addEventListener("mousemove", e => {
    const btn = e.target.closest(".cell");
    btn && !drawerOpen() ? show(btn, e.clientX, e.clientY) : hide();
  });
  panel.addEventListener("mouseleave", hide);
  panel.addEventListener("focusin", e => { const btn = e.target.closest(".cell"); if (btn && !drawerOpen()) show(btn); });
  panel.addEventListener("focusout", hide);
  // Clicking or tapping a week opens its details (the hover card stays a summary).
  panel.addEventListener("click", e => {
    const btn = e.target.closest(".cell");
    if (!btn) return;
    hide();
    const w = weeks[+btn.dataset.i];
    location.hash = weekHash(w.season, w.week_label);
  });
}

// ---------- Detail views (loaded on demand from details.json) ----------

let DATA = null, DETAILS = null, detailsPromise = null, CATEGORY_NAMES = [];
function loadDetails() {
  if (!detailsPromise) {
    detailsPromise = fetch("details.json")
      .then(r => { if (!r.ok) throw new Error(r.status + " " + r.statusText); return r.json(); })
      .then(d => { CATEGORY_NAMES = (d.categories || []).map(c => c.name); return (DETAILS = d); })
      .catch(err => { detailsPromise = null; throw err; });
  }
  return detailsPromise;
}

const weekHash = (season, label) => `#week=${season}/${encodeURIComponent(label)}`;
const playerHash = (season, name) => `#player=${season}/${encodeURIComponent(name)}`;
// True while the address still shows this view. Compared decoded, since a shared
// link may encode characters ("Da%27Vonne") that encodeURIComponent leaves as is.
const decodeHash = h => { try { return decodeURIComponent(h); } catch (err) { return h; } };
const isCurrent = hash => decodeHash(location.hash) === decodeHash(hash);
const plink = (season, name) => `<a class="plink" href="${playerHash(season, name)}">${esc(name)}</a>`;
const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + "s")}`;

const $ = id => document.getElementById(id);
let lastFocus = null;

function openDrawer(title, status, body) {
  if ($("drawer").hidden) lastFocus = document.activeElement;
  $("drawer-title").textContent = title;
  $("drawer-status").textContent = status || "";
  $("drawer-body").innerHTML = body;
  $("drawer-body").scrollTop = 0;
  $("drawer").hidden = false;
  $("scrim").hidden = false;
  $("drawer-close").focus();
}

function hideDrawer() {
  $("drawer").hidden = true;
  $("scrim").hidden = true;
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
  lastFocus = null;
}

// Closing returns to the current view's own address.
function closeDrawer() {
  location.hash = currentView === "weeks" ? "" : `#${currentView}=${currentSeason}`;
}

function errorHtml(err) {
  return `<p class="muted">Couldn’t load details.json (${esc(err.message)}). Run <code>python -m bbgrid build</code> to create it.</p>`;
}

function weekRecord(season, label) {
  return DATA.weeks.find(w => w.season === season && w.week_label === label);
}

function statusText(w) {
  if (w.status === "ok") return w.note || "";
  return `${w.status === "error" ? "Error" : "Note"}: ${w.note || ""}`;
}

async function showWeek(season, label) {
  const w = weekRecord(season, label);
  if (!w) return closeDrawer();
  const title = `BB${season} · ${label}`;
  openDrawer(title, statusText(w), `<p class="muted">Loading…</p>`);
  let d;
  try { d = (await loadDetails()).weeks[`${season}|${label}`]; }
  catch (err) { return openDrawer(title, statusText(w), errorHtml(err)); }
  if (!isCurrent(weekHash(season, label))) return;  // moved on while loading
  const summary = w.rounds.length
    ? w.rounds.map((r, i) => roundHtml(r, roundLabel(w, i))).join("")
    : `<p class="muted">No round was modeled this week. See “What was different”.</p>`;
  const different = specialHtml(d);
  const fin = (DETAILS.finales || {})[season];
  openDrawer(title, statusText(w),
    pagerHtml(season, label)
    + `<h3>Summary</h3>${summary}`
    + (fin && fin.week === label ? `<p><a class="plink" href="#finale=${season}">The final HOH and the jury vote ›</a>`
      + ((DETAILS.afh || {})[season] ? ` · <a class="plink" href="#afh">America’s Favorite HouseGuest ›</a>` : "") + `</p>` : "")
    + (different ? `<h3>What was different</h3>${different}` : "")
    + `<h3>Competitions</h3>${compsHtml(w, d)}`
    + `<h3>Veto</h3>${vetoHtml(w, d)}`
    + `<h3>Votes to evict</h3>${votesHtml(w, d)}`
    + (d.fandom && d.fandom.have_nots.length ? `<h3>Have-Nots</h3>${haveNotsHtml(w, d)}` : "")
    + checksHtml(w, d)
    + `<h3>Episodes</h3>${episodesHtml(d)}`);
}

// The weeks before and after this one in the same season, in table order.
function weekNeighbors(season, label) {
  const list = DATA.weeks.filter(w => w.season === season);
  const i = list.findIndex(w => w.week_label === label);
  return { prev: list[i - 1] || null, next: list[i + 1] || null };
}

function pagerHtml(season, label) {
  const { prev, next } = weekNeighbors(season, label);
  const link = (w, text, rel) => w ? `<a href="${weekHash(season, w.week_label)}" rel="${rel}">${text}</a>` : `<span aria-hidden="true">${text}</span>`;
  return `<nav class="pager" aria-label="Weeks">${link(prev, `‹ ${esc(prev ? prev.week_label : "")}`, "prev")}`
    + `${link(next, `${esc(next ? next.week_label : "")} ›`, "next")}</nav>`;
}

function votesHtml(w, d) {
  if (!d || !d.rounds.length) return `<p class="muted">No vote to show.</p>`;
  const multi = d.rounds.length > 1;
  return d.rounds.map((v, i) => {
    const r = w.rounds[i];
    let html = multi ? `<h4>${esc(roundLabel(w, i))}</h4>` : "";
    if (r.tally && r.tally.type === "sole_vote") {
      html += `<p>${plink(w.season, r.tally.by)} cast the sole vote to evict.</p>`;
    }
    // One line per nominee: who voted to evict them (the count is in the summary's tally).
    html += `<dl class="votes">` + v.by_nominee.map(n =>
      `<dt>${faceHtml(w.season, n.nominee, n.nominee === r.evicted ? "out" : "")}${plink(w.season, n.nominee)}${n.nominee === r.evicted ? `<span class="tag">Evicted</span>` : ""}</dt>`
      + `<dd>${n.voters.length ? [...n.voters].sort((a, b) => a.localeCompare(b)).map(x => plink(w.season, x)).join(", ") : `<span class="muted">No votes</span>`}</dd>`).join("") + `</dl>`;
    return html;
  }).join("");
}

const roundTitle = roundLabel;
const compHash = format => `#comp=${encodeURIComponent(format)}`;
const catTag = c => c && c.category ? ` <span class="cat">${esc(c.category)}</span>` : "";

// The competition that decided a round's HOH or veto: the Big Brother Wiki's
// Competition History first, then a name found in Wikipedia's episode summaries.
function roundComp(d, round, kind) {
  const f = d.fandom && d.fandom.comps.find(c => c.kind === kind && c.round === round && c.name);
  if (f) return { name: f.name, format: f.format, category: f.category, winner: f.winners[0], fandom: true };
  const e = d.comps.find(c => c.winner && c.kind === kind && c.round === round);
  return e ? { name: e.name, winner: e.winner } : null;
}

function compsHtml(w, d) {
  const others = d.comps.filter(c => !c.winner);
  const kindName = { hoh: "HOH", veto: "Veto" };
  const fmt = c => (c.format ? ` <span class="muted">(<a class="plink" href="${compHash(c.format)}">${esc(c.format)}</a>)</span>` : "") + catTag(c);
  let html = "";
  w.rounds.forEach((r, i) => {
    const line = kind => {
      const c = roundComp(d, i + 1, kind);
      const winners = kind === "hoh" ? r.hoh : r.veto_winners;
      if (!winners.length) return "";
      // The winner is already in the summary above, so only the competition is named here.
      return `<dt>${kindName[kind]}</dt><dd>${c ? `“${esc(c.name)}”${fmt(c)}`
        : `Won by ${winners.map(x => plink(w.season, x)).join(", ")} <span class="muted">(competition not named)</span>`}</dd>`;
    };
    const title = roundTitle(w, i);
    html += `${title ? `<h4>${esc(title)}</h4>` : ""}<dl>${line("hoh")}${line("veto")}</dl>`;
  });
  // Everything else the Big Brother Wiki lists this week: twist comps, final HOH parts, unmodeled rounds.
  const shown = new Set(w.rounds.flatMap((_, i) => ["hoh", "veto"].map(k => roundComp(d, i + 1, k)))
    .filter(c => c && c.fandom).map(c => c.name));
  const extra = d.fandom ? d.fandom.comps.filter(c => !shown.has(c.name)) : [];
  // Twist rows the summary already shows (Block Buster, AI Arena) don't repeat their winner.
  const inSummary = new Set(w.rounds.flatMap(r => Object.keys(r.extras || {}).map(k => nkey(extraLabel(k)))));
  if (extra.length) {
    html += `<h4>${w.rounds.length ? "Other competitions this week" : "Competitions this week"}</h4><dl>`
      + extra.map(c => {
        const who = inSummary.has(nkey(c.type)) ? ""
          : c.winners.length ? `${c.winners.map(x => plink(w.season, x)).join(" & ")} ${esc(c.outcome)}` : esc(c.outcome);
        return `<dt>${esc(c.type)}</dt><dd>${c.name ? `“${esc(c.name)}”` : ""}${c.name && who ? ": " : ""}${who}`
          + prizeHtml(c.prize) + `${c.day ? ` <span class="muted">(Day ${esc(c.day)})</span>` : ""}</dd>`;
      }).join("") + `</dl>`;
  }
  if (d.fandom && d.fandom.comps.length) {
    html += `<p class="src">Source: Big Brother Wiki</p>`;
  } else if (others.length) {
    html += `<p class="src">Also mentioned in this week’s episodes: `
      + others.map(c => `“${esc(c.name)}” (${kindName[c.kind]})`).join(", ") + `</p>`;
  }
  if (!w.rounds.some((_, i) => roundComp(d, i + 1, "hoh") || roundComp(d, i + 1, "veto")) && !others.length && !extra.length) {
    html += `<p class="muted">Neither source names this week’s competitions.</p>`;
  }
  return html;
}

// "the “Diamond Power of Veto” power", from a twist's summary line.
const prizeHtml = p => p ? ` — the “${esc(p.name)}” ${esc(p.kind)}` : "";

function vetoHtml(w, d) {
  if (!d.rounds.length) return `<p class="muted">No veto to show.</p>`;
  let html = d.rounds.map((v, i) => {
    const r = w.rounds[i], u = v.veto;
    const title = roundTitle(w, i);
    let body;
    if (!u) body = `<p class="muted">No veto recorded.</p>`;
    else {
      const holder = r.veto_winners.map(x => plink(w.season, x)).join(" and ");
      const names = xs => xs.map(x => plink(w.season, x)).join(", ");
      const lines = [];
      if (!u.used) lines.push(`${holder} didn’t use the veto: the nominations stayed the same.`);
      else {
        const self = u.on.length === 1 && r.veto_winners.includes(u.on[0]);
        lines.push(`${holder} used the veto on ${self ? "themselves" : names(u.on)}.`);
        if (u.replacements.length) lines.push(`${names(u.replacements)} ${u.replacements.length > 1 ? "were" : "was"} named as the replacement${u.replacements.length > 1 ? "s" : ""}.`);
      }
      if (u.twist_saved.length) {
        const label = extraLabel(Object.keys(r.extras || {})[0] || "a twist");
        lines.push(`${names(u.twist_saved)} came off the block through the twist (${esc(label)}).`);
      }
      body = `<p style="margin:4px 0">${lines.join(" ")}</p>`;
    }
    return (title ? `<h4>${esc(title)}</h4>` : "") + body;
  }).join("");
  if (d.veto_notes.length) {
    html += `<details class="ep"><summary>From the episode summaries</summary>`
      + d.veto_notes.map(x => `<blockquote class="wnote">${esc(x)}</blockquote>`).join("") + `</details>`;
  }
  return html;
}

function haveNotsHtml(w, d) {
  return `<ul class="plain">` + d.fandom.have_nots.map(h => `<li>${plink(w.season, h.name)}`
    + (h.chosen_by ? ` <span class="muted">(made a Have-Not by ${esc(h.chosen_by)})</span>` : "") + `</li>`).join("")
    + `</ul><p class="src">Source: Big Brother Wiki</p>`;
}

// Where the Big Brother Wiki's Game History table disagrees with Wikipedia.
function checksHtml(w, d) {
  const checks = d.fandom ? d.fandom.checks : [];
  if (!checks.length) return "";
  const multi = w.rounds.length > 1;
  return `<h3>Sources disagree</h3><dl>` + checks.map(c => `<dt>${multi ? `Round ${c.round} · ` : ""}${esc(c.field)}</dt>`
    + `<dd>Wikipedia: ${esc(c.wikipedia.join(", "))}<br>Big Brother Wiki: ${esc(c.fandom.join(", "))}</dd>`).join("")
    + `</dl><p class="src">The grid follows Wikipedia.</p>`;
}

// "" when nothing was different. A Block Buster alone is routine for its seasons, so it doesn't count.
function specialHtml(d) {
  if (!d) return "";
  let items = d.special.items, notes = d.special.notes;
  const bb = x => /Block Buster/i.test(x);
  if (items.every(bb) && notes.every(n => bb(n.text))) items = notes = [];
  notes = notes.map(n => `<blockquote class="wnote">${esc(n.text)}<cite>Wikipedia</cite></blockquote>`).join("");
  if (!items.length && !notes) return "";
  return (items.length ? `<ul class="plain">${items.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "") + notes;
}

function fmtDate(ep) {
  if (!ep.air_date) return ep.air_date_text || "";
  return new Date(ep.air_date + "T12:00:00Z").toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" });
}

function episodesHtml(d) {
  if (!d || !d.episodes.length) return `<p class="muted">No episodes listed for this week.</p>`;
  return d.episodes.map(ep => {
    const meta = [ep.days, fmtDate(ep), ep.viewers_millions != null ? `${ep.viewers_millions}M viewers` : ""].filter(Boolean).join(" · ");
    const head = `<strong>${esc(ep.title)}</strong> <span class="ep-meta">${esc(meta)}</span>`;
    const paras = (ep.summary || "").split(/\n+/).map(x => x.trim()).filter(Boolean);
    return paras.length
      ? `<details class="ep"><summary>${head}</summary>${paras.map(x => `<p>${esc(x)}</p>`).join("")}</details>`
      : `<div class="ep">${head}</div>`;
  }).join("");
}

// ---------- Players ----------

let currentView = "weeks", currentSeason = null;

// A button per season while they fit on one line; a drop-down once there are more.
const SEASON_BUTTONS_MAX = 10;
function seasonPickerHtml(season) {
  const list = seasonList();
  if (list.length <= SEASON_BUTTONS_MAX) {
    return list.map(s => `<button aria-pressed="${s === season}" data-season="${s}">BB${s}</button>`).join("");
  }
  return `<select aria-label="Season">${list.map(s =>
    `<option value="${s}"${s === season ? " selected" : ""}>BB${s}</option>`).join("")}</select>`;
}
function wireSeasonPicker(id, hashFor) {
  $(id).addEventListener("click", e => {
    const b = e.target.closest("button[data-season]");
    if (b) location.hash = hashFor(b.dataset.season);
  });
  $(id).addEventListener("change", e => { location.hash = hashFor(e.target.value); });
}

function seasonList() {
  return [...new Set(DATA.weeks.map(w => w.season))].sort((a, b) => b - a);
}

const VIEW_TEXT = {
  weeks: ["Week by week", "Who was evicted each week, or who was HOH. Click or tap a week for the full story."],
  players: ["Players", "Every houseguest’s season in numbers. Click or tap a name for their week-by-week timeline."],
  comps: ["Competitions", "Every HOH and veto competition of a season. Click or tap a format to see each time it was played."],
  finale: ["Finale", "How each season’s winner was decided: the final HOH, the last eviction and every juror’s vote."],
  afh: ["America’s Favorite HouseGuest", "The viewers’ vote for their favorite houseguest, announced at each finale, and how that houseguest’s game went."],
};

function setView(view) {
  currentView = view;
  $("view-title").textContent = VIEW_TEXT[view][0];
  $("view-sub").textContent = VIEW_TEXT[view][1];
  for (const v of ["weeks", "players", "comps", "finale", "afh"]) {
    $(`${v}-view`).hidden = view !== v;
    $(`tab-${v}`).setAttribute("aria-selected", view === v);
  }
  // On a phone the tabs scroll sideways; keep the selected one in sight.
  const tabs = $(`tab-${view}`).parentElement, tab = $(`tab-${view}`);
  if (tabs.scrollWidth > tabs.clientWidth) {
    const r = tab.getBoundingClientRect(), box = tabs.getBoundingClientRect();
    if (r.right > box.right) tabs.scrollLeft += r.right - box.right + 4;
    else if (r.left < box.left) tabs.scrollLeft -= box.left - r.left + 4;
  }
}

// Twist rows a season runs every week get their own column.
const ARENA_RE = /AI Arena|Block Buster/i;
const MONEY_RE = /\$/;
const weekOf = key => key.replace(/ \((?:Day \d+|Inside|Outside|[^)]*)\)$/, "");

function arenaLabel(season) {
  for (const w of DATA.weeks) {
    if (w.season !== season) continue;
    for (const r of w.rounds) for (const k of Object.keys(r.extras || {})) {
      const m = k.match(ARENA_RE);
      if (m) return m[0];
    }
  }
  return null;
}

// Twists: powers, safety and other twist wins. The Big Brother Wiki's twist
// wins first (without money prizes), then any Wikipedia twist row in a week the
// wiki has none for. AI Arena / Block Buster wins are counted on their own.
function playerTwists(p) {
  const f = p.fandom || {};
  const wiki = (f.twist_wins || []).filter(t => !ARENA_RE.test(t.type) && !MONEY_RE.test(t.outcome || "") && !/luxury/i.test(t.type)
      && !/punish|downgrad/i.test(t.outcome || ""))
    .map(t => ({ week: t.week, label: t.type + (t.name ? ` (“${t.name}”)` : ""), outcome: t.outcome }));
  const weeks = new Set(wiki.map(t => t.week));
  const table = p.twist.filter(t => !ARENA_RE.test(t.label) && !weeks.has(weekOf(t.week)))
    .map(t => ({ week: weekOf(t.week), label: t.label.replace(/ winner$/i, "") }));
  return [...wiki, ...table];
}

function playerStats(p) {
  const against = p.votes_against.reduce((n, x) => n + x.voters.length, 0);
  const withHouse = p.votes_cast.filter(v => v.with_house).length;
  return { hoh: p.hoh.length, veto: p.veto.length, noms: p.nominated.length, block: p.on_block.length,
           against, cast: p.votes_cast.length, withHouse,
           arena: p.twist.filter(t => ARENA_RE.test(t.label)).length, twists: playerTwists(p).length };
}

// Age, hometown and occupation: Wikipedia's cast table, else the Big Brother Wiki.
function playerBio(p) {
  const b = p.bio || {}, f = p.fandom || {};
  return {
    full_name: f.full_name || b.full_name,
    age: b.age != null ? b.age : f.age,
    hometown: b.hometown || (f.hometown || []).join(" / ") || null,
    occupation: b.occupation || f.occupation || null,
  };
}

const pct = (n, d) => d ? `${Math.round(100 * n / d)}%` : "";

async function showPlayers(season) {
  setView("players");
  currentSeason = season;
  $("season-pick").innerHTML = seasonPickerHtml(season);
  const panel = $("players-panel");
  if (!DETAILS) panel.innerHTML = `<div class="msg">Loading players…</div>`;
  let d;
  try { d = await loadDetails(); } catch (err) { panel.innerHTML = `<div class="msg">${errorHtml(err)}</div>`; return; }
  if (currentSeason !== season) return;
  const rows = d.players.filter(p => p.season === season);
  const num = n => n ? n : `<span class="zero">0</span>`;
  const dash = `<span class="zero">–</span>`;
  const hasBio = rows.some(p => p.bio || p.fandom);
  const hasHaveNots = rows.some(p => p.fandom);
  const arena = arenaLabel(season);
  const info = (d.seasons || {})[season];
  const th = (text, title, cls) => `<th scope="col"${cls ? ` class="${cls}"` : ""}>${title ? `<abbr title="${esc(title)}">${esc(text)}</abbr>` : esc(text)}</th>`;
  // Column groups: who they are, then comps, nominations and votes.
  const groups = [["", 2], ...(hasBio ? [["", 3]] : []), ["Comps", arena ? 4 : 3], ["Nominations", 2], ["Votes", 3],
                  ...(hasHaveNots ? [["", 1]] : [])];
  const grp = groups.map(([label, n], i) => `<th colspan="${n}"${i > (hasBio ? 1 : 0) ? ` class="gs"` : ""}>${esc(label)}</th>`).join("");
  panel.innerHTML = (info ? seasonInfoHtml(info) : "") + leadersHtml(season, rows) + `<table class="players"><thead>
    <tr class="grp">${grp}</tr><tr>
      <th scope="col">Player</th><th scope="col" style="text-align:left">Result</th>
      ${hasBio ? th("Age", "", "bio num") + th("Hometown", "", "bio") + th("Occupation", "", "bio") : ""}
      ${th("HOHs", "", "gs")}${th("Vetoes")}${arena ? th(arena, `${arena} wins`) : ""}${th("Twists", "Powers, safety and other twist wins")}
      ${th("Noms", "Nominated", "gs")}${th("Final noms", "On the block at the vote")}
      ${th("VTE", "Votes to evict them", "gs")}${th("Cast", "Votes cast")}${th("With house", "Votes cast with the majority")}
      ${hasHaveNots ? th("Have-Not wks", "", "gs") : ""}
    </tr></thead><tbody>` + rows.map(p => {
      const s = playerStats(p);
      const b = playerBio(p);
      const full = b.full_name && b.full_name !== p.name ? `<small>${esc(b.full_name)}</small>` : "";
      return `<tr><td><div class="pl">${faceHtml(season, p.name, faceState(p))}<span>${plink(season, p.name)}${full}</span></div></td><td class="result">${esc(p.result || "In the game")}${afhTagHtml(d, p)}</td>`
        + (hasBio ? `<td class="bio num">${b.age != null ? b.age : dash}</td><td class="bio">${b.hometown ? esc(b.hometown) : dash}</td><td class="bio">${b.occupation ? esc(b.occupation) : dash}</td>` : "")
        + `<td class="gs">${num(s.hoh)}</td><td>${num(s.veto)}</td>${arena ? `<td>${num(s.arena)}</td>` : ""}<td>${num(s.twists)}</td>`
        + `<td class="gs">${num(s.noms)}</td><td>${num(s.block)}</td>`
        + `<td class="gs">${num(s.against)}</td><td>${num(s.cast)}</td><td>${s.cast ? pct(s.withHouse, s.cast) : dash}</td>`
        + (hasHaveNots ? `<td class="gs">${num(((p.fandom || {}).have_not || []).length)}</td>` : "") + `</tr>`;
    }).join("") + `</tbody></table>`;
}

// The season's top five by HOH and veto wins, like the broadcast board's "highest rated" strip.
function leadersHtml(season, rows) {
  const top = rows.map((p, i) => ({ p, i, s: playerStats(p) }))
    .map(x => ({ ...x, wins: x.s.hoh + x.s.veto }))
    .filter(x => x.wins > 0)
    .sort((a, b) => b.wins - a.wins || b.s.hoh - a.s.hoh || a.i - b.i)
    .slice(0, 5);
  if (top.length < 3) return "";
  return `<section class="leaders" aria-labelledby="leaders-h"><h2 id="leaders-h">Most competition wins</h2><ol>`
    + top.map(({ p, s, wins }, i) => `<li><span class="rank" aria-label="Rank ${i + 1}">${i + 1}</span>`
      + faceHtml(season, p.name, faceState(p))
      + `<span class="who">${plink(season, p.name)}<span>${plural(s.hoh, "HOH")} · ${plural(s.veto, "veto", "vetoes")}</span></span>`
      + `<span class="n" title="HOH and veto wins">${wins}</span></li>`).join("")
    + `</ol></section>`;
}

function seasonInfoHtml(info) {
  const date = iso => iso ? new Date(iso + "T12:00:00Z").toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" }) : "";
  const bits = [
    info.premiere && `Premiered ${date(info.premiere)}`,
    info.finale && (info.finale <= new Date().toISOString().slice(0, 10) ? `finale ${date(info.finale)}` : `finale due ${date(info.finale)}`),
    info.days && `${info.days} days`,
    info.houseguests && `${info.houseguests} houseguests`,
    info.prize && `${info.prize} prize`,
    info.host && `hosted by ${info.host}`,
  ].filter(Boolean);
  return `<p class="season-info">${esc(bits.join(" · "))}${info.url ? ` · <a href="${esc(info.url)}" target="_blank" rel="noopener">Big Brother Wiki</a>` : ""}</p>`;
}

// Week keys in season order, e.g. "Week 10 (Day 67)" for a round of a two-round week.
function roundKeys(season) {
  const keys = [];
  DATA.weeks.filter(w => w.season === season).forEach(w => {
    const multi = w.rounds.length > 1;
    if (!w.rounds.length) keys.push([w.week_label, w.week_label, 0]);
    w.rounds.forEach((r, i) => keys.push([multi && r.sub_label ? `${w.week_label} (${r.sub_label})` : w.week_label, w.week_label, i]));
  });
  return keys;
}

async function showPlayer(season, name) {
  const title = name;
  const status = `BB${season}`;
  openDrawer(title, status, `<p class="muted">Loading…</p>`);
  let d;
  try { d = await loadDetails(); } catch (err) { return openDrawer(title, status, errorHtml(err)); }
  if (!isCurrent(playerHash(season, name))) return;
  const p = d.players.find(x => x.season === season && x.name === name);
  if (!p) return openDrawer(title, status, `<p class="muted">No player by that name in BB${season}.</p>`);
  const s = playerStats(p);
  const f = p.fandom || {};
  const events = new Map();
  const add = (week, html) => { if (!events.has(week)) events.set(week, []); events.get(week).push(html); };
  // Look up a round's details from its timeline key, e.g. "Week 10 (Day 67)".
  const keys = new Map(roundKeys(season).map(([k, label, i]) => [k, { label, i }]));
  const roundInfo = k => {
    const at = keys.get(k); if (!at) return {};
    const wd = d.weeks[`${season}|${at.label}`];
    return wd ? { comp: kind => roundComp(wd, at.i + 1, kind), veto: (wd.rounds[at.i] || {}).veto } : {};
  };
  const wins = Object.fromEntries(CATEGORY_NAMES.map(c => [c, 0]));
  const compName = (k, kind) => {
    const info = roundInfo(k), c = info.comp && info.comp(kind);
    if (c && c.category) wins[c.category]++;
    return c ? ` <span class="muted">(“${esc(c.name)}”${c.format ? `, <a class="plink" href="${compHash(c.format)}">${esc(c.format)}</a>` : ""})</span>${catTag(c)}` : "";
  };
  p.hoh.forEach(w => add(w, "Won HOH" + compName(w, "hoh")));
  p.veto.forEach(w => add(w, "Won the veto" + compName(w, "veto")));
  p.twist.forEach(t => add(t.week, esc(extraLabel(t.label))));
  p.nominated.forEach(w => {
    if (p.on_block.includes(w)) return add(w, "Nominated");
    const v = roundInfo(w).veto;
    const how = v && v.on.includes(name) ? " by the veto" : v && v.twist_saved.includes(name) ? " by a twist" : "";
    add(w, `Nominated, then saved${how}`);
  });
  p.on_block.filter(w => !p.nominated.includes(w)).forEach(w => add(w, "Put on the block as a replacement nominee"));
  p.votes_against.forEach(v => add(v.week, `${plural(v.voters.length, "vote")} to evict them (${v.voters.map(x => plink(season, x)).join(", ")})`));
  p.votes_cast.forEach(v => add(v.week, `Voted to evict ${plink(season, v.vote)}${v.with_house ? "" : " <span class=\"tag\">against the house</span>"}`));
  if (p.evicted) add(p.evicted, "<strong>Evicted</strong>");
  // Have-Not weeks and twist wins are per week, so they go on the week's first round.
  const firstKey = new Map();
  roundKeys(season).forEach(([k, label]) => { if (!firstKey.has(label)) firstKey.set(label, k); });
  (f.have_not || []).forEach(label => firstKey.has(label) && add(firstKey.get(label), "Have-Not"));
  const wikiTwistWeeks = new Set(p.twist.map(t => keys.has(t.week) ? keys.get(t.week).label : t.week));
  (f.twist_wins || []).filter(t => !wikiTwistWeeks.has(t.week)).forEach(t =>
    firstKey.has(t.week) && add(firstKey.get(t.week), `${esc(t.type)}: ${esc(t.outcome || "won")}${prizeHtml(t.prize)}${t.name ? ` <span class="muted">(“${esc(t.name)}”)</span>` : ""}`));
  const byCat = CATEGORY_NAMES.filter(c => wins[c]).map(c => `${c} ${wins[c]}`);
  const timeline = roundKeys(season).filter(([k]) => events.has(k)).map(([k, label]) =>
    `<li><a class="plink" href="${weekHash(season, label)}">${esc(k)}</a><div>${events.get(k).join("<br>")}</div></li>`).join("");
  openDrawer(title, `BB${season} · ${p.result || "In the game"}`,
    bioHtml(p, season)
    + `<div class="stats">
       <div class="stat"><b>${s.hoh}</b><span>HOHs</span></div>
       <div class="stat"><b>${s.veto}</b><span>Vetoes</span></div>
       <div class="stat"><b>${s.noms}</b><span>Noms</span></div>
       <div class="stat"><b>${s.against}</b><span>Votes against</span></div>
     </div>
     <p class="voters" style="margin-top:8px">Final noms ${plural(s.block, "time")} · voted ${plural(s.cast, "time")}${s.cast ? `, ${pct(s.withHouse, s.cast)} with the house` : ""}${s.arena ? ` · ${s.arena} ${esc(arenaLabel(season) || "")}` : ""}${s.twists ? ` · ${plural(s.twists, "twist")}` : ""}</p>
     ${byCat.length ? `<p class="voters">Comp wins by type: ${esc(byCat.join(" · "))}</p>` : ""}
     <h3>Week by week</h3>
     ${timeline ? `<ul class="timeline">${timeline}</ul>` : `<p class="muted">Nothing recorded in the modeled weeks.</p>`}
     <p class="src">Twist weeks the grid doesn’t model aren’t counted.</p>`);
}

function bioHtml(p, season) {
  const f = p.fandom || {}, b = playerBio(p);
  const rows = [
    ["Full name", b.full_name],
    ["Age", b.age != null ? String(b.age) : null],
    ["Hometown", b.hometown],
    ["Occupation", b.occupation],
    ["Days", f.days],
    ["Alliances", (f.alliances || []).join(", ")],
    ["Other seasons", (f.seasons || []).filter(x => x !== `Big Brother ${season} (US)`).join(", ")],
    ["America’s Favorite", afhPlace(DETAILS, p)],
  ].filter(([, v]) => v);
  const face = faceHtml(season, p.name, faceState(p), f.portrait || null);
  if (!rows.length) return `<div class="bio-head">${face}</div>`;
  return `<div class="bio-head">${face}<dl class="bio">${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl></div>`
    + (f.url ? `<p class="src"><a href="${esc(f.url)}" target="_blank" rel="noopener">Profile on the Big Brother Wiki</a></p>` : "");
}
